apiVersion: v1
kind: ConfigMap
metadata:
  name: setters
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  source: |
    cfg = ctx.resource_list["functionConfig"]["data"]
    for resource in ctx.resource_list["items"]:
      if resource.get("kind") == "ConfigMap" and resource.get("metadata", {}).get("name") == "config-domain":
        data = resource.get("data", {})
        for key in list(data.keys()):
          if key.endswith(".sslip.io"):
            value = data.pop(key)
            data[cfg["edge-node-ip"] + ".sslip.io"] = value
  # Add default CPU and memory requests/limits to the injected queue-proxy.
  queueproxy-resource-defaults: "enabled"
  # IP of the edge worker node that fronts Kourier ingress (NodePort externalIPs).
  # The Starlark render step also derives the config-domain sslip.io key.
  edge-node-ip: "192.168.1.11"
