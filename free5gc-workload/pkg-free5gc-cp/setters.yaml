apiVersion: v1
kind: ConfigMap
metadata:
  name: setters
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  source: |
    def replace_marked_value(line, cfg, supported):
      marker = "# kpt-set: ${"
      if marker not in line:
        return line
      before, annotation = line.split("# kpt-set:", 1)
      setter = annotation.split("${", 1)[1].split("}", 1)[0]
      if setter not in supported:
        return line
      trimmed = before.rstrip()
      if ": " in trimmed:
        parts = trimmed.split(": ")
        return ": ".join(parts[:-1]) + ": " + cfg[setter] + " # kpt-set:" + annotation
      if "- " in trimmed:
        parts = trimmed.split("- ")
        return "- ".join(parts[:-1]) + "- " + cfg[setter] + " # kpt-set:" + annotation
      return line

    def replace_embedded_config(resources, cfg, supported):
      for resource in resources:
        if resource.get("kind") != "ConfigMap" or resource.get("metadata", {}).get("name") == "setters":
          continue
        data = resource.get("data", {})
        for key in list(data.keys()):
          if type(data[key]) != "string":
            continue
          lines = data[key].split("\n")
          for index in range(len(lines)):
            lines[index] = replace_marked_value(lines[index], cfg, supported)
          data[key] = "\n".join(lines)

    cfg = ctx.resource_list["functionConfig"]["data"]
    supported = ["amf-n2-ip", "smf-n4-ip", "upf-n4-ip", "upf-n3-ip", "ue-subnet", "ue-dns"]
    replace_embedded_config(ctx.resource_list["items"], cfg, supported)

    node_name = "ip-" + cfg["core-worker-node-ip"].replace(".", "-") + "." + cfg["aws-region"] + ".compute.internal"
    for resource in ctx.resource_list["items"]:
      if resource.get("kind") == "Deployment" and resource.get("metadata", {}).get("name") in ["amf", "smf"]:
        resource["spec"]["template"]["spec"]["nodeName"] = node_name
  # Namespace
  namespace: free5gc
  # AMF N2 Interface (NGAP over Multus ipvlan on ens6 — core-n2 subnet)
  amf-n2-ip: 192.168.10.200
  amf-n2-subnet: "24"
  amf-n2-gateway: 192.168.10.1
  amf-n2-nad-master: ens6
  amf-port: "38412"
  # UPF interface IPs (separate subnets on edge worker)
  upf-n4-ip: 192.168.11.202
  upf-n3-ip: 192.168.12.201
  # SMF N4 IP — assigned via Multus NAD on ens7 (core-n4 subnet 192.168.11.0/24)
  smf-n4-ip: 192.168.11.176
  smf-n4-subnet: "24"
  smf-n4-gateway: 192.168.11.1
  smf-n4-nad-master: ens7
  # AWS node names are composed as ip-<hyphenated-private-ip>.<region>.compute.internal.
  aws-region: ap-southeast-1
  core-worker-node-ip: 192.168.1.10
  # Core services
  nrf-service-name: nrf-service
  nrf-uri: https://nrf-service:8000
  mongodb-uri: mongodb://mongodb:27017
  # PLMN / Cell identity
  plmn-mcc: "001"
  plmn-mnc: "01"
  tac: "1"
  # Slice & DNN
  sst: "1"
  sd: "010203"
  dnn: internet
  # UE IP pool
  ue-subnet: 10.1.0.0/16
  ue-dns: 8.8.8.8
  # AMF identity
  amf-id: cafe00
  # Container images
  image-nrf: free5gc/nrf:v3.4.3
  image-udr: free5gc/udr:v3.4.3
  image-udm: free5gc/udm:v3.4.3
  image-ausf: free5gc/ausf:v3.4.3
  image-amf: free5gc/amf:v3.4.3
  image-smf: free5gc/smf:v3.4.3
  image-pcf: free5gc/pcf:v3.4.3
  image-nssf: free5gc/nssf:v3.4.3
  # PVC storage class
  storage-class: longhorn
