apiVersion: v1
kind: ConfigMap
metadata:
  name: setters
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  source: |
    def replace_marked_value(line, cfg, supported):
      marker = "# kpt-set: ${"
      if marker not in line:
        return line
      before, annotation = line.split("# kpt-set:", 1)
      setter = annotation.split("${", 1)[1].split("}", 1)[0]
      if setter not in supported:
        return line
      trimmed = before.rstrip()
      if ": " in trimmed:
        parts = trimmed.split(": ")
        return ": ".join(parts[:-1]) + ": " + cfg[setter] + " # kpt-set:" + annotation
      if "- " in trimmed:
        parts = trimmed.split("- ")
        return "- ".join(parts[:-1]) + "- " + cfg[setter] + " # kpt-set:" + annotation
      return line

    def replace_embedded_config(resources, cfg, supported):
      for resource in resources:
        if resource.get("kind") != "ConfigMap" or resource.get("metadata", {}).get("name") == "setters":
          continue
        data = resource.get("data", {})
        for key in list(data.keys()):
          if type(data[key]) != "string":
            continue
          lines = data[key].split("\n")
          for index in range(len(lines)):
            lines[index] = replace_marked_value(lines[index], cfg, supported)
          data[key] = "\n".join(lines)

    cfg = ctx.resource_list["functionConfig"]["data"]
    supported = ["upf-n3-ip", "upf-n4-ip", "upf-n6-ip", "ue-subnet"]
    replace_embedded_config(ctx.resource_list["items"], cfg, supported)
  namespace: free5gc
  # UPF N3: edge-n3 subnet (192.168.12.0/24) on ens8
  upf-n3-ip: 192.168.12.201
  upf-n3-subnet: "24"
  upf-n3-gateway: 192.168.12.1
  upf-n3-nad-master: ens8
  # UPF N4: edge-n4 subnet (192.168.11.0/24) on ens7
  upf-n4-ip: 192.168.11.202
  upf-n4-subnet: "24"
  upf-n4-gateway: 192.168.11.1
  upf-n4-nad-master: ens7
  # UPF N6: edge-n6 subnet (192.168.13.0/24) on ens9
  upf-n6-ip: 192.168.13.203
  upf-n6-subnet: "24"
  upf-n6-gateway: 192.168.13.1
  upf-n6-nad-master: ens9
  ue-subnet: 10.1.0.0/16
  dnn: internet
  # AWS node name is composed as <node-ip>.<region>.compute.internal.
  aws-region: ap-southeast-1
  edge-worker-node-ip: ip-192-168-1-11
  image-upf: free5gc/upf:v3.4.3
