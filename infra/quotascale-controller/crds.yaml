apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quotaautoscalers.dcn.ssu.ac.kr
spec:
  group: dcn.ssu.ac.kr
  names:
    kind: QuotaAutoscaler
    listKind: QuotaAutoscalerList
    plural: quotaautoscalers
    shortNames:
      - qa
    singular: quotaautoscaler
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                resourceQuota:
                  type: string
                  description: Optional ResourceQuota name in the same namespace
                min.cpu:
                  type: string
                  description: Minimum CPU quota
                max.cpu:
                  type: string
                  description: Maximum CPU quota
                min.memory:
                  type: string
                  description: Minimum memory quota
                max.memory:
                  type: string
                  description: Maximum memory quota
                behavior:
                  type: object
                  properties:
                    scaleUp:
                      type: object
                      required:
                        - policies
                      properties:
                        policies:
                          type: array
                          items:
                            type: object
                            required:
                              - method
                              - value
                            properties:
                              method:
                                type: string
                              value:
                                type: integer
                              targetUtilization:
                                type: integer
                                minimum: 1
                                maximum: 100
                    scaleDown:
                      type: object
                      required:
                        - policies
                      properties:
                        policies:
                          type: array
                          items:
                            type: object
                            required:
                              - method
                              - value
                            properties:
                              method:
                                type: string
                              value:
                                type: integer
                              targetUtilization:
                                type: integer
                                minimum: 1
                                maximum: 100
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodescalinginventories.dcn.ssu.ac.kr
spec:
  group: dcn.ssu.ac.kr
  names:
    kind: NodeScalingInventory
    listKind: NodeScalingInventoryList
    plural: nodescalinginventories
    shortNames:
      - nsi
    singular: nodescalinginventory
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.desired
          name: Desired
          type: integer
        - jsonPath: .status.replicas
          name: Replicas
          type: integer
        - jsonPath: .status.used
          name: Used
          type: integer
        - jsonPath: .status.unused
          name: Unused
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                machineDeploymentReplicas:
                  type: integer
                  format: int32
                nodes:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - order
                      - used
                    properties:
                      name:
                        type: string
                      order:
                        type: integer
                        format: int32
                      used:
                        type: boolean
            status:
              type: object
              properties:
                desired:
                  type: integer
                  format: int32
                replicas:
                  type: integer
                  format: int32
                used:
                  type: integer
                  format: int32
                unused:
                  type: integer
                  format: int32
