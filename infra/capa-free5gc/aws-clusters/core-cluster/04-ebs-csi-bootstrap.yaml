apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: '@{core-cluster-name}-cluster-crs-csi-reconcile'
  namespace: '@{namespace}'
  annotations:
    nephio.org/cluster-name: '@{core-cluster-name}'
spec:
  clusterSelector:
    matchLabels:
      csi: external
      nephio.org/cluster-name: '@{core-cluster-name}'
  resources:
    - kind: ConfigMap
      name: '@{core-cluster-name}-cluster-aws-ebs-csi-driver-addon'
  strategy: Reconcile
