apiVersion: config.porch.kpt.dev/v1alpha1
kind: PackageVariant
metadata:
  name: '@{core-cluster-name}-argocd'
  namespace: default
spec:
  annotations:
    approval.nephio.org/policy: initial
  upstream:
    repo: catalog-nephio-core
    package: argo-cd
    revision: v2.0.0
  downstream:
    repo: mgmt-staging
    package: '@{core-cluster-name}-argocd'
  injectors:
    - kind: WorkloadCluster
      name: '@{core-cluster-name}'
  pipeline:
    mutators:
      - image: ghcr.io/kptdev/krm-functions-catalog/set-annotations:v0.1.4
        configMap:
          nephio.org/cluster-name: '@{core-cluster-name}'
