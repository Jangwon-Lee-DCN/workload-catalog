apiVersion: v1
data:
  aws-ccm-external.yaml: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: aws-cloud-controller-manager
      namespace: kube-system
      labels:
        k8s-app: aws-cloud-controller-manager
    spec:
      selector:
        matchLabels:
          k8s-app: aws-cloud-controller-manager
      updateStrategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            k8s-app: aws-cloud-controller-manager
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ''
          tolerations:
          - key: node.cloudprovider.kubernetes.io/uninitialized
            value: 'true'
            effect: NoSchedule
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoSchedule
          - key: node.cluster.x-k8s.io/uninitialized
            operator: Exists
            effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
          serviceAccountName: cloud-controller-manager
          containers:
          - name: aws-cloud-controller-manager
            image: registry.k8s.io/provider-aws/cloud-controller-manager:v1.28.3@sha256:a2fa4d07b7a9dd5008f4f52250cedecfa44308cd715455096a5bab78b3febe69
            args:
            - --v=2
            - --cloud-provider=aws
            - --use-service-account-credentials=true
            - --configure-cloud-routes=false
            resources:
              requests:
                cpu: 200m
            env: []
          hostNetwork: true
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: cloud-controller-manager
      namespace: kube-system
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: cloud-controller-manager:apiserver-authentication-reader
      namespace: kube-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: extension-apiserver-authentication-reader
    subjects:
    - apiGroup: ''
      kind: ServiceAccount
      name: cloud-controller-manager
      namespace: kube-system
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: system:cloud-controller-manager
    rules:
    - apiGroups:
      - ''
      resources:
      - events
      verbs:
      - create
      - patch
      - update
    - apiGroups:
      - ''
      resources:
      - nodes
      verbs:
      - '*'
    - apiGroups:
      - ''
      resources:
      - nodes/status
      verbs:
      - patch
    - apiGroups:
      - ''
      resources:
      - services
      verbs:
      - list
      - patch
      - update
      - watch
    - apiGroups:
      - ''
      resources:
      - services/status
      verbs:
      - list
      - patch
      - update
      - watch
    - apiGroups:
      - ''
      resources:
      - serviceaccounts
      verbs:
      - create
      - get
      - list
      - watch
    - apiGroups:
      - ''
      resources:
      - persistentvolumes
      verbs:
      - get
      - list
      - update
      - watch
    - apiGroups:
      - ''
      resources:
      - configmaps
      verbs:
      - list
      - watch
    - apiGroups:
      - ''
      resources:
      - endpoints
      verbs:
      - create
      - get
      - list
      - watch
      - update
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - create
      - get
      - list
      - watch
      - update
    - apiGroups:
      - ''
      resources:
      - serviceaccounts/token
      verbs:
      - create
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: system:cloud-controller-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:cloud-controller-manager
    subjects:
    - apiGroup: ''
      kind: ServiceAccount
      name: cloud-controller-manager
      namespace: kube-system
kind: ConfigMap
metadata:
  annotations:
    note: generated
    nephio.org/cluster-name: '@{core-cluster-name}'
  labels:
    type: generated
  name: '@{core-cluster-name}-cluster-cloud-controller-manager-addon'
  namespace: '@{namespace}'
