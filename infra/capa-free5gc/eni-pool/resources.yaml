          - v1beta2
        operations:
          - CREATE
        resources:
          - awsmachines
  matchConditions:
    - name: fixed-worker
      expression: object.metadata.namespace == '@{namespace}' && has(object.metadata.annotations) && 'eni.dcn.ssu.ac.kr/interface-key' in object.metadata.annotations && object.metadata.annotations['eni.dcn.ssu.ac.kr/interface-key'] == 'edge_primary_eni'
  validations:
    - expression: request.dryRun == true || (has(object.spec.networkInterfaces) && object.spec.networkInterfaces == ['@{edge-primary-eni}'] && has(object.metadata.annotations) && 'eni.dcn.ssu.ac.kr/reserved-interface-set' in object.metadata.annotations && object.metadata.annotations['eni.dcn.ssu.ac.kr/reserved-interface-set'] == '@{edge-primary-eni},@{edge-n2-eni},@{edge-n4-eni},@{edge-n3-eni},@{edge-n6-eni}')
      message: The fixed worker requires its primary ENI and complete reserved data-interface plan
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: free5gc-edge-fixed-eni-set
spec:
  policyName: free5gc-edge-fixed-eni-set
  validationActions:
    - Deny
