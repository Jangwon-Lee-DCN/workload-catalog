apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-cluster-bindings
  namespace: '@{namespace}'
data:
  bind.py: |
    """Deliver Core's read-only identity and API endpoint to Edge."""
    import base64,json,os,pathlib,ssl,tempfile,time,urllib.error,urllib.request,yaml

    class Api:
        def __init__(self, path, directory, name):
            config=yaml.safe_load(pathlib.Path(path).read_text())
            selected=next(x['context'] for x in config['contexts'] if x['name']==config['current-context'])
            cluster=next(x['cluster'] for x in config['clusters'] if x['name']==selected['cluster'])
            user=next(x['user'] for x in config['users'] if x['name']==selected['user'])
            self.server=cluster['server'].rstrip('/')
            if not self.server.startswith('https://'):
                raise ValueError('CAPA API endpoint must use HTTPS')
            self.context=ssl.create_default_context(cadata=base64.b64decode(cluster['certificate-authority-data']).decode())
            cert=pathlib.Path(directory)/(name+'.crt');key=pathlib.Path(directory)/(name+'.key')
            cert.write_bytes(base64.b64decode(user['client-certificate-data']))
            key.write_bytes(base64.b64decode(user['client-key-data']))
            self.context.load_cert_chain(cert,key)

        def request(self, method, path, body=None):
            data=None if body is None else json.dumps(body).encode()
            request=urllib.request.Request(self.server+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(request,context=self.context,timeout=10) as response:
                if response.headers.get_content_type()!='application/json':
                    raise ValueError('Expected Kubernetes JSON response')
                return json.load(response)

    def deliver(core, edge, namespaces):
        source=core.request('GET','/api/v1/namespaces/ims-lab/secrets/ims-observer-read-token')
        data={name:source.get('data',{}).get(name) for name in ['token','ca.crt']}
        if not all(data.values()):
            raise ValueError('Core read-only token is not populated yet')
        data['server']=base64.b64encode(core.server.encode()).decode()
        for namespace in namespaces:
            try:
                edge.request('GET','/api/v1/namespaces/'+namespace)
            except urllib.error.HTTPError as error:
                if error.code!=404:
                    raise
                try:
                    edge.request('POST','/api/v1/namespaces',{'apiVersion':'v1','kind':'Namespace','metadata':{'name':namespace}})
                except urllib.error.HTTPError as conflict:
                    if conflict.code!=409:
                        raise
            collection='/api/v1/namespaces/'+namespace+'/secrets'
            path=collection+'/ims-observer-core'
            try:
                secret=edge.request('GET',path)
            except urllib.error.HTTPError as error:
                if error.code!=404:
                    raise
                edge.request('POST',collection,{'apiVersion':'v1','kind':'Secret','metadata':{'name':'ims-observer-core','namespace':namespace},'type':'Opaque','data':data})
            else:
                if secret.get('data')!=data:
                    secret['data']=data
                    edge.request('PUT',path,secret)

    def main():
        os.umask(0o077)
        namespaces=[name for name in os.environ['EDGE_NAMESPACES'].split(',') if name]
        ready=pathlib.Path('/work/ready')
        while True:
            try:
                with tempfile.TemporaryDirectory(dir='/work') as directory:
                    core=Api('/core-kubeconfig/value',directory,'core')
                    edge=Api('/edge-kubeconfig/value',directory,'edge')
                    deliver(core,edge,namespaces)
                if not ready.exists():
                    print('CORE_EDGE_BINDINGS_READY',flush=True)
                ready.touch()
            except (urllib.error.URLError,TimeoutError,ValueError,OSError,KeyError,StopIteration) as error:
                ready.unlink(missing_ok=True)
                print('Waiting for Core read-only identity and Edge API: '+type(error).__name__,flush=True)
            time.sleep(15)

    if __name__=='__main__':
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-cluster-bindings
  namespace: '@{namespace}'
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app: ims-cluster-bindings
  template:
    metadata:
      labels:
        app: ims-cluster-bindings
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bind
          image: '@{image-tools}'
          imagePullPolicy: IfNotPresent
          command: [python3, /bootstrap/bind.py]
          env:
            - name: EDGE_NAMESPACES
              value: '@{edge-namespaces}'
          readinessProbe:
            exec:
              command: [test, -f, /work/ready]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /bootstrap
              readOnly: true
            - name: core
              mountPath: /core-kubeconfig
              readOnly: true
            - name: edge
              mountPath: /edge-kubeconfig
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: code
          configMap:
            name: ims-cluster-bindings
        - name: core
          secret:
            secretName: '@{core-cluster-name}-kubeconfig'
            defaultMode: 256
            items:
              - key: value
                path: value
        - name: edge
          secret:
            secretName: '@{edge-cluster-name}-kubeconfig'
            defaultMode: 256
            items:
              - key: value
                path: value
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
