apiVersion: config.porch.kpt.dev/v1alpha1
kind: PackageVariant
metadata:
  name: '@{gpu-cluster-name}-20-platform'
  namespace: '@{namespace}'
spec:
  annotations:
    approval.nephio.org/policy: initial
  upstream:
    repo: '@{catalog-name}'
    package: free5gc-ims/gpu/20-platform
    revision: '@{catalog-revision}'
  downstream:
    repo: '@{staging-repository}'
    package: '@{gpu-cluster-name}-20-platform'
  injectors:
  - kind: WorkloadCluster
    name: '@{gpu-cluster-name}'
  pipeline:
    mutators:
    - image: ghcr.io/kptdev/krm-functions-catalog/set-annotations:v0.1.4
      configMap:
        nephio.org/cluster-name: '@{gpu-cluster-name}'
