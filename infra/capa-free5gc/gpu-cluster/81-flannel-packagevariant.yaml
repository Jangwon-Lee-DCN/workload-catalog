apiVersion: config.porch.kpt.dev/v1alpha1
kind: PackageVariant
metadata:
  name: '@{gpu-cluster-name}-flannel'
  namespace: default
spec:
  annotations:
    approval.nephio.org/policy: initial
  upstream:
    repo: catalog-nephio-optional
    package: flannel
    revision: v2.0.0
  downstream:
    repo: mgmt-staging
    package: '@{gpu-cluster-name}-flannel'
  injectors:
  - kind: WorkloadCluster
    name: '@{gpu-cluster-name}'
  pipeline:
    mutators:
    - image: ghcr.io/kptdev/krm-functions-catalog/set-annotations:v0.1.4
      configMap:
        nephio.org/cluster-name: '@{gpu-cluster-name}'
