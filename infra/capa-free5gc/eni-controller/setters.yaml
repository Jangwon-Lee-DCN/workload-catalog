apiVersion: v1
kind: ConfigMap
metadata:
  name: eni-controller-setters
  annotations:
    config.kubernetes.io/local-config: 'true'
    argocd.argoproj.io/hook: Skip
data:
  namespace: default
  aws-region: ap-northeast-2
  aws-az: ap-northeast-2a
  vpc-id: vpc-0123456789abcdef0
  public-subnet-id: subnet-0123456789abcdef0
  private-subnet-id: subnet-0123456789abcdef1
  security-group-id: sg-0123456789abcdef0
  ssh-key-name: mynephio2025
  node-ami: ami-045715a39cc1c8a78
  kubernetes-version: v1.32.0
  control-plane-instance-type: t3.large
  worker-instance-type: c5.4xlarge
  control-plane-iam-profile: control-plane.cluster-api-provider-aws.sigs.k8s.io
  worker-iam-profile: nodes.cluster-api-provider-aws.sigs.k8s.io
  controller-image: docker.io/jangwonlee/capa-eni-controller@sha256:57c2f32107b6b4c398fb2e3697adbb3d4de9445a975cd06410ea5fdf29c1fc14
  core-worker-ip: 172.31.81.10
  edge-worker-ip: 172.31.81.11
  amf-n2-ip: 172.31.90.200
  smf-n4-ip: 172.31.91.176
  gnb-n2-ip: 172.31.90.204
  upf-n4-ip: 172.31.91.202
  upf-n3-ip: 172.31.92.201
  gnb-n3-ip: 172.31.92.205
  upf-n6-ip: 172.31.93.203
  pcscf-ip: 172.31.93.210
  rtpengine-ip: 172.31.93.211
  mec-ip: 172.31.93.213
  core-primary-eni: eni-00000000000000001
  edge-primary-eni: eni-00000000000000002
  core-n2-eni: eni-00000000000000003
  core-n4-eni: eni-00000000000000004
  edge-n2-eni: eni-00000000000000005
  edge-n4-eni: eni-00000000000000006
  edge-n3-eni: eni-00000000000000007
  edge-n6-eni: eni-00000000000000008
  source: |
    # Preserve parameterized fields across Porch's automatic render after clone/edit.
    # The generated local-config file is excluded from ArgoCD by set-*.yaml.
    cfg = ctx.resource_list["functionConfig"]["data"]
    def replace_tokens(value):
        for key in cfg:
            if key != "source":
                value = value.replace("@{" + key + "}", cfg[key])
        return value

    def identity(resource):
        meta = resource.get("metadata", {})
        return "|".join([resource.get("apiVersion", ""), resource.get("kind", ""), meta.get("namespace", ""), meta.get("name", "")])

    def pointer_key(key):
        return str(key).replace("~", "~0").replace("/", "~1")

    items = ctx.resource_list["items"]
    states = [r for r in items if r.get("kind") == "ConfigMap" and r.get("metadata", {}).get("name") == "blueprint-render-state"]
    state = states[0] if states else {"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "blueprint-render-state", "annotations": {"config.kubernetes.io/local-config": "true", "config.kubernetes.io/path": "set-render-state.yaml", "internal.config.kubernetes.io/path": "set-render-state.yaml"}}, "data": {}}
    records = state["data"]
    lookup = {}
    for key in records:
        if key.endswith("-resource") and not key.endswith("-rendered-resource"):
            prefix = key[:-9]
            lookup[records[key] + "|" + records[prefix + "-path"]] = prefix
            rendered = records.get(prefix + "-rendered-resource")
            if rendered != None:
                lookup[rendered + "|" + records[prefix + "-path"]] = prefix
    for resource in items:
        if resource.get("metadata", {}).get("annotations", {}).get("config.kubernetes.io/local-config") == "true":
            continue
        rid = identity(resource)
        used = []
        pending = [(resource, key, "/" + pointer_key(key)) for key in resource]
        for depth in range(64):
            following = []
            for parent, key, path in pending:
                value = parent[key]
                if type(value) == "string":
                    token_key = rid + "|" + path
                    prefix = lookup.get(token_key)
                    # New upstream template text takes precedence over the stored render input.
                    if "@{" in value and any(["@{" + name + "}" in value for name in cfg if name != "source"]):
                        if prefix == None:
                            prefix = "r" + str(len(records))
                            lookup[token_key] = prefix
                        records[prefix + "-resource"] = rid
                        records[prefix + "-path"] = path
                        records[prefix + "-template"] = value
                    if prefix != None:
                        used.append(prefix)
                        parent[key] = replace_tokens(records[prefix + "-template"])
                elif type(value) == "dict":
                    following.extend([(value, child, path + "/" + pointer_key(child)) for child in value])
                elif type(value) == "list":
                    following.extend([(value, index, path + "/" + str(index)) for index in range(len(value))])
            pending = following
            if not pending:
                break
        for prefix in used:
            records[prefix + "-rendered-resource"] = identity(resource)
    if not states:
        items.append(state)
  core-n2-primary-ip: 172.31.90.10
  core-n4-primary-ip: 172.31.91.176
  edge-n2-primary-ip: 172.31.90.20
  edge-n4-primary-ip: 172.31.91.20
  edge-n3-primary-ip: 172.31.92.20
  edge-n6-primary-ip: 172.31.93.20
  core-node-name: ip-172-31-81-10.ap-northeast-2.compute.internal
  edge-node-name: ip-172-31-81-11.ap-northeast-2.compute.internal
  eni-retention-security-group-id: sg-0123456789abcdef1
