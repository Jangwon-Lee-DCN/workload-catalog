apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-service-template
  namespace: qwen-tts-lab
data:
  service.json: |
    {
      "apiVersion": "serving.knative.dev/v1",
      "kind": "Service",
      "metadata": {
        "name": "voice-ims-fast",
        "namespace": "qwen-tts-lab"
      },
      "spec": {
        "template": {
          "metadata": {
            "annotations": {
              "autoscaling.knative.dev/initial-scale": "0",
              "autoscaling.knative.dev/max-scale": "1",
              "autoscaling.knative.dev/min-scale": "0",
              "autoscaling.knative.dev/scale-down-delay": "20s",
              "autoscaling.knative.dev/target": "1",
              "autoscaling.knative.dev/target-utilization-percentage": "100",
              "autoscaling.knative.dev/window": "6s",
              "gpu-cr.io/checkpoint-mode": "direct-cache",
              "gpu-cr.io/checkpoint-uri": "file:///var/lib/gpu-cr/cache/voice-app-base.tar",
              "gpu-cr.io/checkpoint-workspace": "prepared",
              "gpu-cr.io/data-mode": "prepared-pod",
              "gpu-cr.io/data-uri": "hostpath:///var/lib/gcr-checkpoint/bootstrap-base.blob",
              "gpu-cr.io/restore": "true",
              "gpu-cr.io/restore-hugepages": "true",
              "gpu-cr.io/source-pod-uid": "00000000-0000-4000-8000-000000000002",
              "gpu-cr.io/target-container": "voice-api",
              "voice-service.io/observation-contract": "d7fb8243822e35235f914f4a8de3074acd02839979cda9e64a501fc6be5c0519",
              "autoscaling.knative.dev/target-burst-capacity": "-1"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containerConcurrency": 1,
            "containers": [
              {
                "command": [
                  "bash",
                  "-ec",
                  "export LD_PRELOAD=/opt/gpu-cr/libgcr-interceptor.so; exec /data/voice-env/bin/python /fast-model/fast_clone_server.py"
                ],
                "env": [
                  {
                    "name": "HF_HOME",
                    "value": "/data/huggingface"
                  },
                  {
                    "name": "HF_HUB_OFFLINE",
                    "value": "1"
                  },
                  {
                    "name": "OMP_NUM_THREADS",
                    "value": "1"
                  },
                  {
                    "name": "MKL_NUM_THREADS",
                    "value": "1"
                  },
                  {
                    "name": "GCR_VMM_ALLOC",
                    "value": "1"
                  },
                  {
                    "name": "GCR_CONTROL_DIR",
                    "value": "/var/lib/gpu-cr/run"
                  },
                  {
                    "name": "GCR_DATA_DIR",
                    "value": "/var/lib/gcr-data"
                  },
                  {
                    "name": "GCR_POD_UID",
                    "valueFrom": {
                      "fieldRef": {
                        "fieldPath": "metadata.uid"
                      }
                    }
                  },
                  {
                    "name": "VOICE_SIZE",
                    "value": "1.7B"
                  },
                  {
                    "name": "VOICE_CPU_THREADS",
                    "value": "1"
                  },
                  {
                    "name": "VOICE_SOURCE_WARMUP",
                    "value": "1"
                  },
                  {
                    "name": "VOICE_CODEC_GRAPH",
                    "value": "1"
                  }
                ],
                "image": "docker.io/pytorch/pytorch@sha256:77f17f843507062875ce8be2a6f76aa6aa3df7f9ef1e31d9d7432f4b0f563dee",
                "imagePullPolicy": "IfNotPresent",
                "name": "voice-api",
                "resources": {
                  "limits": {
                    "cpu": "12",
                    "memory": "40Gi",
                    "nvidia.com/gpu": "1"
                  },
                  "requests": {
                    "cpu": "4",
                    "memory": "8Gi",
                    "nvidia.com/gpu": "1"
                  }
                },
                "volumeMounts": [
                  {
                    "mountPath": "/data",
                    "name": "data",
                    "readOnly": true
                  },
                  {
                    "mountPath": "/opt/gpu-cr",
                    "name": "lib",
                    "readOnly": true
                  },
                  {
                    "mountPath": "/var/lib/gpu-cr/run",
                    "name": "run"
                  },
                  {
                    "mountPath": "/var/lib/gcr-data",
                    "name": "blob"
                  },
                  {
                    "mountPath": "/tmp",
                    "name": "tmp"
                  },
                  {
                    "mountPath": "/dev/shm",
                    "name": "shm"
                  },
                  {
                    "mountPath": "/fast-model",
                    "name": "fast-model-code",
                    "readOnly": true
                  }
                ]
              },
              {
                "command": [
                  "python3",
                  "/voice-observe/guard.py"
                ],
                "env": [
                  {
                    "name": "SOURCE_UID",
                    "value": "00000000-0000-4000-8000-000000000002"
                  },
                  {
                    "name": "NVIDIA_VISIBLE_DEVICES",
                    "value": "void"
                  },
                  {
                    "name": "UPSTREAM_PORT",
                    "value": "8000"
                  }
                ],
                "image": "docker.io/library/python@sha256:2b4f19dae3a777dfc3b76730bda1e82e1f66ab2a2686fa93ca78edbfb4f04ffe",
                "name": "guard",
                "ports": [
                  {
                    "containerPort": 8080,
                    "name": "http1",
                    "protocol": "TCP"
                  }
                ],
                "readinessProbe": {
                  "failureThreshold": 3,
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "periodSeconds": 1,
                  "successThreshold": 1,
                  "timeoutSeconds": 1
                },
                "resources": {
                  "limits": {
                    "cpu": "1",
                    "memory": "256Mi"
                  },
                  "requests": {
                    "cpu": "100m",
                    "memory": "64Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "mountPath": "/restore-run",
                    "name": "run",
                    "readOnly": true
                  },
                  {
                    "mountPath": "/voice-observe",
                    "name": "voice-observe",
                    "readOnly": true
                  }
                ]
              }
            ],
            "initContainers": [
              {
                "command": [
