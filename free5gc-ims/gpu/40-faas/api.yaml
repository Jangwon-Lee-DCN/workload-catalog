apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-gpu-api
  namespace: voice-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: voice-gpu-api-observer
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voice-gpu-api-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: voice-gpu-api-observer
subjects:
- kind: ServiceAccount
  name: voice-gpu-api
  namespace: voice-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-kubeconfig
  namespace: voice-system
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc:443
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: voice-api
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: voice-api
        context: {cluster: in-cluster, user: voice-api}
    current-context: voice-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gpu-api
  namespace: voice-system
spec:
  replicas: 1
  progressDeadlineSeconds: 18000
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice-gpu-api
  template:
    metadata:
      labels:
        app: voice-gpu-api
      annotations:
        cdi.k8s.io/gpu: nvidia.com/gpu=all
    spec:
      serviceAccountName: voice-gpu-api
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: wait-cache-and-stt
        image: docker.io/jangwonlee/ims-gpu-api@sha256:9f97d0c997ad5bd57ddf9444358f9aaf0725e61b25ec294d87a9624aeb5902ca
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        args:
        - until test -f /cache-ready && test -f /bootstrap-state/services-ready && test -s /opt/voice-quality/manifest.json; do sleep 2; done
        volumeMounts:
        - name: cache-ready
          mountPath: /cache-ready
          readOnly: true
        - name: stt
          mountPath: /opt/voice-quality
          readOnly: true
        - name: bootstrap-state
          mountPath: /bootstrap-state
          readOnly: true
      containers:
      - name: api
        image: docker.io/jangwonlee/ims-gpu-api@sha256:9f97d0c997ad5bd57ddf9444358f9aaf0725e61b25ec294d87a9624aeb5902ca
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: voice-gpu-api-config
        - secretRef:
            name: voice-gpu-api-secrets
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: utility
        - name: VOICE_KUBECONFIG
          value: /etc/voice-kube/kubeconfig
        - name: IMS_REFERENCE_MODE
          value: xvector
        - name: IMS_RESIDENT_SPEECH
          value: '1'
        ports:
        - name: http
          containerPort: 8090
          hostPort: 8090
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '12'
            memory: 12Gi
            nvidia.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 3
        volumeMounts:
        - name: state
          mountPath: /var/lib/voice-service
        - name: stt
          mountPath: /opt/voice-quality/model
          subPath: model
          readOnly: true
        - name: stt
          mountPath: /opt/voice-quality/manifest.json
          subPath: manifest.json
          readOnly: true
        - name: kubeconfig
          mountPath: /etc/voice-kube
          readOnly: true
        - name: pod-logs
          mountPath: /var/log/pods
          readOnly: true
        - name: cache
          mountPath: /var/lib/gpu-cr/cache
          readOnly: true
          mountPropagation: HostToContainer
        - name: pinned-gpu
          mountPath: /var/lib/gpu-cr/pinned-gpu
          readOnly: true
          mountPropagation: HostToContainer
        - name: resident
          mountPath: /var/lib/voice-service/resident
          readOnly: true
          mountPropagation: HostToContainer
        - name: cache-ready
          mountPath: /cache-ready
          readOnly: true
        - name: api-code
          mountPath: /app
          readOnly: true
      volumes:
      - name: cache-ready
        hostPath:
          path: /run/voice-cache-ready
          type: File
      - name: state
        hostPath:
          path: /var/lib/voice-service
          type: DirectoryOrCreate
      - name: stt
        hostPath:
          path: /opt/voice-quality
          type: DirectoryOrCreate
      - name: kubeconfig
        configMap:
          name: voice-kubeconfig
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: cache
        hostPath:
          path: /var/lib/gpu-cr/cache
          type: Directory
      - name: pinned-gpu
        hostPath:
          path: /var/lib/gpu-cr/pinned-gpu
          type: Directory
      - name: resident
        hostPath:
          path: /var/lib/voice-service/resident
          type: Directory
      - name: bootstrap-state
        hostPath:
          path: /run/voice-bootstrap
          type: DirectoryOrCreate
      - name: api-code
        configMap:
          name: voice-gpu-api-code
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
