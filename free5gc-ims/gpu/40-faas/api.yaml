    """Fail-closed generated-speech content gate; never certifies naturalness/truth.

    Rejected bytes stay in memory only. The CPU recognizer runs in an isolated,
    bounded subprocess so a hung decoder can be killed without blocking the API.
    """
    import asyncio
    import hashlib
    import io
    import json
    import math
    import re
    import time
    import unicodedata
    from pathlib import Path

    POLICY='stt-content-v1'
    MODEL_REVISION='0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf'
    MAX_ATTEMPTS=3
    _slots=asyncio.Semaphore(2)


    class QualityUnavailable(RuntimeError):
        pass


    def normalized(text,language):
        text=unicodedata.normalize('NFKC',text).casefold()
        if language=='Korean':
            text=re.sub(r'\bgpu\b','지피유',text)
            text=re.sub(r'\bai\b','에이아이',text)
        return ''.join(c for c in text if c.isalnum())


    def distance(a,b):
        row=list(range(len(b)+1))
        for i,x in enumerate(a,1):
            nxt=[i]
            for j,y in enumerate(b,1):nxt.append(min(nxt[-1]+1,row[j]+1,row[j-1]+(x!=y)))
            row=nxt
        return row[-1]


    def assess(expected,recognized,language):
        confidence=recognized.get('avg_logprob')
        if not isinstance(recognized.get('transcript'),str) or type(confidence) not in (float,int) or not math.isfinite(confidence):
            raise QualityUnavailable('STT 응답 형식이 올바르지 않습니다.')
        target=normalized(expected,language)
        transcript=recognized.get('transcript','')
        actual=normalized(transcript,language)
        if not target or len(target)>2000 or len(actual)>4000:
            raise QualityUnavailable('검증할 문장 또는 STT 응답 형식이 올바르지 않습니다.')
        cer=distance(target,actual)/len(target)
        limit=.10 if len(target)<15 else .18
        reasons=[]
        if not actual:reasons.append('음성이 인식되지 않았습니다')
        if cer>limit:reasons.append('요청 문장과 다른 내용·누락·반복이 감지되었습니다')
        if confidence<-1.0:reasons.append('음성 인식 신뢰도가 낮습니다')
        return {'policy':POLICY,'passed':not reasons,'transcript':transcript,
                'character_error_rate':round(cer,4),'maximum_error_rate':limit,
                'reasons':reasons,'recognizer':'faster-whisper-large-v3-turbo/cpu-int8',
                'model_revision':MODEL_REVISION,'language':language}


    async def validate(data,text,language):
        if language not in ('Korean','English'):raise QualityUnavailable('지원하지 않는 검증 언어입니다.')
        # Already-normalized bytes are checked and then stored unchanged by app.py.
        import numpy as np
        import soundfile as sf
        samples,rate=sf.read(io.BytesIO(data),always_2d=True)
        if not len(samples) or not np.isfinite(samples).all():
            raise QualityUnavailable('생성 음성을 읽을 수 없습니다.')
        if float(np.sqrt(np.mean(samples*samples)))<.001 or float(np.max(np.abs(samples)))<.005:
            return {'policy':POLICY,'passed':False,'reasons':['무음 또는 지나치게 작은 음성입니다'],
                    'transcript':'','sha256':hashlib.sha256(data).hexdigest(),'seconds':0}
        start=time.monotonic()
        async with _slots:
            proc=None
            try:
                proc=await asyncio.create_subprocess_exec('/opt/voice-quality/runtime/bin/python',
                    str(Path(__file__).with_name('quality_worker.py')),language,
                    stdin=asyncio.subprocess.PIPE,stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.PIPE)
                stdout,stderr=await asyncio.wait_for(proc.communicate(data),timeout=75)
                if proc.returncode:raise QualityUnavailable('STT 검증기를 사용할 수 없습니다. 검증 없이 음성을 제공하지 않습니다.')
                recognized=json.loads(stdout)
                if recognized.get('model_revision')!=MODEL_REVISION:raise ValueError('Wrong recognizer revision')
                result=assess(text,recognized,language)
            except asyncio.CancelledError:
                raise
            except QualityUnavailable:raise
            except Exception as exc:
                raise QualityUnavailable('STT 검증에 실패했습니다. 검증 없이 음성을 제공하지 않습니다.') from exc
            finally:
                if proc is not None and proc.returncode is None:
                    proc.kill();await proc.wait()
        return {**result,'sha256':hashlib.sha256(data).hexdigest(),'seconds':round(time.monotonic()-start,3),
                'peak_rss_bytes':recognized.get('peak_rss_bytes')}
