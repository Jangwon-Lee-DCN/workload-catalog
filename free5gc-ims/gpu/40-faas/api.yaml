    """Bounded persistent CPU recognizer, isolated from the GPU API interpreter."""
    import asyncio,base64,hashlib,io,json,math
    from pathlib import Path
    import generation_quality
    _lock=asyncio.Lock()
    _process=None
    async def _stop():
     global _process
     p,_process=_process,None
     if p and p.returncode is None:p.kill();await p.wait()
    async def _start():
     global _process
     if _process is None or _process.returncode is not None:
      _process=await asyncio.create_subprocess_exec('/opt/voice-quality/runtime/bin/python',str(Path(__file__).with_name('ims_speech_worker.py')),stdin=asyncio.subprocess.PIPE,stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.DEVNULL,limit=100000)
      ready=json.loads(await asyncio.wait_for(_process.stdout.readline(),timeout=30))
      if ready.get('model_revision')!=generation_quality.MODEL_REVISION:raise RuntimeError('Recognizer revision mismatch')
    async def warm():
     async with _lock:
      try:await _start()
      except BaseException:await _stop();raise
    async def transcribe(data,language=None,compact_quality=False):
     async with _lock:
      try:
       await _start();_process.stdin.write((json.dumps({'audio':base64.b64encode(data).decode(),'language':language,'compact_quality':compact_quality})+'\n').encode());await _process.stdin.drain()
       result=json.loads(await asyncio.wait_for(_process.stdout.readline(),timeout=75))
       if result.get('model_revision')!=generation_quality.MODEL_REVISION or not isinstance(result.get('transcript'),str) or not math.isfinite(result.get('avg_logprob',float('nan'))):raise RuntimeError('Recognizer response invalid')
       return result
      except BaseException:await _stop();raise
    async def validate(data,text,language):
     import numpy as np,soundfile as sf
     samples,rate=sf.read(io.BytesIO(data),always_2d=True)
     if not len(samples) or not np.isfinite(samples).all():raise generation_quality.QualityUnavailable('Invalid generated audio')
     if float(np.sqrt(np.mean(samples*samples)))<.001 or float(np.max(np.abs(samples)))<.005:return {'passed':False,'reasons':['Silent generated audio']}
     try:
      recognized=await transcribe(data,{'Korean':'ko','English':'en'}[language],compact_quality=True)
      result=generation_quality.assess(text,recognized,language)
      seconds=recognized['seconds']
      if not result['passed']:
       # Preserve the original recognizer path for uncertain shortened-padding
       # results; no missing or failed content check is accepted.
       recognized=await transcribe(data,{'Korean':'ko','English':'en'}[language])
       result=generation_quality.assess(text,recognized,language);seconds+=recognized['seconds']
     except Exception as exc:raise generation_quality.QualityUnavailable('Generated speech recognition unavailable') from exc
     return {**result,'sha256':hashlib.sha256(data).hexdigest(),'seconds':seconds,'peak_rss_bytes':recognized['peak_rss_bytes']}
