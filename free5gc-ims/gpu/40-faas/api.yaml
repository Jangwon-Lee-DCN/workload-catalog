apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-gpu-api-code
  namespace: voice-system
data:
  gpu_metrics.py: |
    """Cached GPU and current Pod observations, collected on the GPU host."""
    import json
    import os
    import re
    import subprocess
    import time
    from pathlib import Path


    def tmpfs_mounts():
        result=set()
        for line in Path('/proc/self/mountinfo').read_text().splitlines():
            fields=line.split();separator=fields.index('-')
            if fields[separator+1]=='tmpfs':
                path=re.sub(r'\\([0-7]{3})',lambda m:chr(int(m[1],8)),fields[4])
                result.add(os.path.realpath(path))
        return result


    def cache_fs_info(path):
        stat=os.stat(path);usage=os.statvfs(path)
        return stat.st_dev,(usage.f_blocks-usage.f_bfree)*usage.f_frsize


    def cache_usage():
        """Allocated tmpfs blocks, not RSS, mlock proof, or additive VRAM usage."""
        try:
            paths=json.loads(os.getenv('GPU_CACHE_PATHS','["/var/lib/gpu-cr/cache","/var/lib/gpu-cr/pinned-gpu","/var/lib/voice-service/resident"]'))
            if not isinstance(paths,list) or not 1<=len(paths)<=8 or not all(isinstance(p,str) and os.path.isabs(p) for p in paths):raise ValueError()
            mounted=tmpfs_mounts();devices={}
            for path in paths:
                real=os.path.realpath(path)
                if real not in mounted:return {'ram_cache_used_bytes':None,'ram_cache_status':'incomplete'}
                device,used=cache_fs_info(real);devices[device]=used
            return {'ram_cache_used_bytes':sum(devices.values()),'ram_cache_status':'measured',
                    'ram_cache_filesystems':len(devices),'ram_cache_measurement':'tmpfs-allocated-blocks'}
        except (OSError,ValueError,IndexError):return {'ram_cache_used_bytes':None,'ram_cache_status':'unavailable'}


    def pod_logs(pod,container):
        root=Path('/var/log/pods')/(pod['metadata']['namespace']+'_'+pod['metadata']['name']+'_'+pod['metadata']['uid'])/container
        files=list(root.glob('*.log'))
        if not files:return ''
        latest=max(files,key=lambda p:p.stat().st_mtime)
        with latest.open('rb') as f:
            f.seek(max(0,latest.stat().st_size-65536))
            return f.read().decode(errors='replace')


    def sample():
        now=time.time()
        out={'status':'online','sampled_at':now,'models':[],'model_events':[]}
        def call(*args):return subprocess.check_output(args,text=True,timeout=8,stderr=subprocess.DEVNULL)
        raw=call('nvidia-smi','--query-gpu=memory.used,memory.total,utilization.gpu','--format=csv,noheader,nounits').strip().split(',')
        out.update(memory_used=int(raw[0]),memory_total=int(raw[1]),utilization=int(raw[2]))
        mem={x.split(':')[0]:int(x.split()[1])*1024 for x in open('/proc/meminfo')}
        out['ram_available']=mem['MemAvailable']
        out['ram_total']=mem['MemTotal']
        out.update(cache_usage())
        cmd=['kubectl','--kubeconfig='+os.getenv('VOICE_KUBECONFIG','/etc/kubernetes/admin.conf')]
        pods=json.loads(call(*cmd,'get','pods','-A','-o','json'))['items']
        for name in ['voice-ims-fast','sasv-restored']:
            selected=[p for p in pods if p['metadata'].get('labels',{}).get('serving.knative.dev/service')==name]
            ready=sum(any(c['type']=='Ready' and c['status']=='True' for c in p.get('status',{}).get('conditions',[])) for p in selected)
            details=[]
            for p in selected:
                details.append({'name':p['metadata']['name'],'phase':p.get('status',{}).get('phase'),
                                'node':p.get('spec',{}).get('nodeName'),'terminating':bool(p['metadata'].get('deletionTimestamp')),
                                'reasons':[s.get('state',{}).get('waiting',{}).get('reason') for s in p.get('status',{}).get('containerStatuses',[]) if s.get('state',{}).get('waiting')],
                                'created':p['metadata'].get('creationTimestamp')})
            out['models'].append({'name':name,'pods':len(selected),'ready':ready,
                                  'phases':[p.get('status',{}).get('phase') for p in selected],'restored':False,'details':details})
        for p in pods:
            service=p['metadata'].get('labels',{}).get('serving.knative.dev/service')
            if not service:continue
            containers=[c['name'] for c in p['spec']['containers'] if c['name'] in ('voice-api','sasv-api','server','app','guard','restore-guard')]
            for container in containers:
                try:
                    logs=pod_logs(p,container)
                    if 'restore ACK sent' in logs:
                        for model in out['models']:
                            if model['name']==service:model['restored']=True
                    for line in logs.splitlines():
                        if 'VOICE_OBS ' not in line:continue
                        try:
                            event=json.loads(line.split('VOICE_OBS ',1)[1])
                            if event.get('id') and event.get('phase') and event.get('at'):
                                event.update(pod=p['metadata']['name'],model=service)
                                out['model_events'].append(event)
                        except ValueError:pass
                except Exception:pass
        return out
  model_scores.py: |
    """Extract only the matching inference's numeric log record; never use warmup data."""
    import ast,json,math,pathlib,re,time

    MODEL='MDT_241214_lora_250501'

    def parse_scores(logs,request_id,prediction):
     if not isinstance(request_id,str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,128}',request_id) or prediction not in ('Real','Fake'):return None
     active=False;scores=None
     for line in logs.splitlines():
      if 'Received file:' in line and 'UID:' in line:
       active=bool(re.search(r'UID:\s*'+re.escape(request_id)+r'\s*,',line));scores=None
      if not active:continue
      if 'Full detection result:' in line:
       try:
        values=ast.literal_eval(line.split('Full detection result:',1)[1].strip())[MODEL]
        if not isinstance(values,dict):continue
        scores={k:float(values[k]) for k in ('spoof','bonafide','confidence') if type(values.get(k)) in (int,float) and math.isfinite(values[k])}
        if set(scores)!=set(('spoof','bonafide','confidence')) or not all(0<=scores[k]<=100 for k in ('spoof','bonafide')):scores=None
       except (ValueError,SyntaxError,TypeError,KeyError):scores=None
      if ': {' in line:
       try:result=json.loads(line[line.index('{'):])
       except (ValueError,TypeError):continue
       if isinstance(result,dict) and result.get(request_id)==prediction and scores:
        return {**scores,'source':'model_log','request_id':request_id}
     return None

    def read_scores(pod,request_id,prediction,root='/var/log/pods'):
     if not isinstance(pod,str) or not re.fullmatch(r'sasv-restored-[a-z0-9-]{1,200}',pod):return None
     for attempt in range(3):
      try:
       dirs=list(pathlib.Path(root).glob('sasv-restore-lab_'+pod+'_*'))
       files=[p for d in dirs for p in [*d.glob('sasv-api/*.log'),*d.glob('*.log')] if p.parent.name=='sasv-api' or re.fullmatch(r'[a-f0-9]{64}\.log',p.name)]
       files=sorted(files,key=lambda p:p.stat().st_mtime,reverse=True)[:2]
      except OSError:return None
      for path in files:
       try:
        with path.open('rb') as f:f.seek(max(0,path.stat().st_size-262144));logs=f.read(262144).decode(errors='replace')
        result=parse_scores(logs,request_id,prediction)
        if result:return result
       except OSError:continue
      if attempt<2:time.sleep(.05)
     return None
  ims_speech_worker.py: |
    """Resident, private CPU speech recognizer. JSON lines over anonymous pipes only."""
    import base64,io,json,math,resource,sys,time,wave
    from pathlib import Path
    from faster_whisper import WhisperModel
    REVISION='0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf'
    assert json.loads(Path('/opt/voice-quality/manifest.json').read_text())['revision']==REVISION
    model=WhisperModel('/opt/voice-quality/model',device='cpu',compute_type='int8',cpu_threads=8,num_workers=1,local_files_only=True)
    original_encode=model.encode
    print(json.dumps({'ready':True,'model_revision':REVISION}),flush=True)
    for line in sys.stdin:
     try:
      request=json.loads(line);data=base64.b64decode(request['audio'],validate=True)
      if not 0<len(data)<=6_000_000:raise ValueError('audio size')
      language=request.get('language');assert language in (None,'ko','en')
      compact=request.get('compact_quality',False) is True;frames=3000
      if compact:
       with wave.open(io.BytesIO(data)) as w:duration=w.getnframes()/w.getframerate()
       # Keep the entire waveform plus two seconds of feature padding. Only excess
       # trailing padding is omitted from encoder work, never any supplied audio.
       frames=min(3000,2*math.ceil((duration*100+200)/2))
       model.encode=lambda features:original_encode(features[...,:frames])
      start=time.monotonic();segments,info=model.transcribe(io.BytesIO(data),language=language,beam_size=5,condition_on_previous_text=False,vad_filter=True,vad_parameters={'min_silence_duration_ms':500},without_timestamps=compact);segments=list(segments)
      duration=sum(max(.001,s.end-s.start) for s in segments)
      result={'transcript':' '.join(s.text.strip() for s in segments),'language':info.language,'avg_logprob':sum(s.avg_logprob*max(.001,s.end-s.start) for s in segments)/duration if duration else -100,'model_revision':REVISION,'seconds':time.monotonic()-start,'encoded_frames':frames,'compact_quality':compact,'peak_rss_bytes':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss*1024}
     except Exception:result={'error':'Speech recognition failed'}
     finally:model.encode=original_encode
     print(json.dumps(result,ensure_ascii=False),flush=True)
