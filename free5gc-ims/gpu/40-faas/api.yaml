    """Private local CPU recognizer. No network and no expected-text prompt."""
    import io
    import json
    import resource
    import sys
    from pathlib import Path

    from faster_whisper import WhisperModel

    REVISION='0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf'


    def main():
        language={'Korean':'ko','English':'en'}[sys.argv[1]]
        manifest=json.loads(Path('/opt/voice-quality/manifest.json').read_text())
        assert manifest['revision']==REVISION
        model=WhisperModel('/opt/voice-quality/model',device='cpu',compute_type='int8',
                          cpu_threads=8,num_workers=1,local_files_only=True)
        segments,info=model.transcribe(io.BytesIO(sys.stdin.buffer.read(20*1024*1024+1)),
            language=language,beam_size=5,condition_on_previous_text=False,vad_filter=True,
            vad_parameters={'min_silence_duration_ms':500})
        segments=list(segments)
        duration=sum(max(.001,s.end-s.start) for s in segments)
        logprob=sum(s.avg_logprob*max(.001,s.end-s.start) for s in segments)/duration if duration else -100
        print(json.dumps({'transcript':' '.join(s.text.strip() for s in segments),
            'avg_logprob':logprob,'model_revision':REVISION,'language':language,
            'peak_rss_bytes':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss*1024},ensure_ascii=False))


    if __name__=='__main__':main()
