    """Authenticated, ephemeral IMS voice generation. No classification or asset storage."""
    import asyncio,base64,io,json,os,re,time,uuid,wave
    from pathlib import Path
    import httpx
    from fastapi import APIRouter,HTTPException,Request,Response
    import generation_quality
    _GATE=asyncio.Semaphore(1)
    MODEL_HOST=os.environ.get('IMS_GENERATION_HOST','voice-ims-fast.qwen-tts-lab.gpu.internal')
    REFERENCE_MODE=os.environ.get('IMS_REFERENCE_MODE','icl')
    RESIDENT_SPEECH=os.environ.get('IMS_RESIDENT_SPEECH','0')=='1'
    assert REFERENCE_MODE in ('icl','xvector')

    async def normalized_reference(sample):
     # Normalize before entering the model so 8kHz references do not trigger its
     # first-use Python/Numba resampling initialization after every restore.
     with wave.open(io.BytesIO(sample)) as w:
      rate=w.getframerate();frames=w.getnframes();pcm=w.readframes(frames)
     if rate==24000:return sample
     proc=await asyncio.create_subprocess_exec('ffmpeg','-hide_banner','-loglevel','error','-f','s16le','-ar','8000','-ac','1','-i','pipe:0','-ar','24000','-ac','1','-f','s16le','pipe:1',stdin=asyncio.subprocess.PIPE,stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.DEVNULL)
     try:
      data,_=await asyncio.wait_for(proc.communicate(pcm),timeout=10)
      if proc.returncode or len(data)!=frames*3*2:raise HTTPException(503,'Reference normalization failed')
      b=io.BytesIO()
      with wave.open(b,'wb') as w:w.setparams((1,2,24000,0,'NONE',''));w.writeframes(data)
      return b.getvalue()
     finally:
      if proc.returncode is None:proc.kill();await proc.wait()

    async def transcribe_reference(sample):
     if RESIDENT_SPEECH:
      import ims_speech
      o=await ims_speech.transcribe(sample)
      if not o['transcript'] or o['avg_logprob']<-1.0:raise HTTPException(422,'Reference speech could not be recognized')
      return o
     p=await asyncio.create_subprocess_exec('/opt/voice-quality/runtime/bin/python',str(Path(__file__).with_name('ims_reference_worker.py')),stdin=asyncio.subprocess.PIPE,stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.PIPE)
     try:
      stdout,_=await asyncio.wait_for(p.communicate(sample),timeout=75)
      if p.returncode:raise HTTPException(503,'Reference transcription unavailable')
      o=json.loads(stdout)
      if not isinstance(o.get('transcript'),str) or not 1<=len(o['transcript'])<=2000 or o.get('avg_logprob',-100)<-1.0:raise HTTPException(422,'Reference speech could not be recognized')
      return o
     finally:
      if p.returncode is None:p.kill();await p.wait()

    def parse_input(b):
     if not isinstance(b,dict) or not isinstance(b.get('text'),str) or not 1<=len(b['text'])<=300:raise HTTPException(400,'Invalid synthesis text')
     if b.get('model','base')!='base':raise HTTPException(400,'Unsupported IMS generation model')
     try:
      sample=base64.b64decode(b['reference_wav_b64'],validate=True)
      with wave.open(io.BytesIO(sample)) as w:
       rate=w.getframerate();frames=w.getnframes()
       if w.getnchannels()!=1 or w.getsampwidth()!=2 or rate not in (8000,24000) or not 8<=frames/rate<=180:raise ValueError()
       pcm=w.readframes(frames)
       if len(pcm)!=frames*2:raise ValueError()
      normalized=io.BytesIO()
      with wave.open(normalized,'wb') as w:w.setparams((1,2,rate,0,'NONE',''));w.writeframes(pcm)
     except (ValueError,KeyError,TypeError,wave.Error,EOFError):raise HTTPException(400,'Invalid reference WAV') from None
     rid=b.get('request_id') or 'ims-gen-'+uuid.uuid4().hex
     if not isinstance(rid,str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,100}',rid):raise HTTPException(400,'Invalid request ID')
     return normalized.getvalue(),rid

    def build_router(begin_trace,trace_phase,normalize_wav):
     router=APIRouter()
     if RESIDENT_SPEECH:
      @router.on_event('startup')
      async def start_recognizer():
       import ims_speech
       await ims_speech.warm()
      @router.on_event('shutdown')
      async def stop_recognizer():
       import ims_speech
       await ims_speech._stop()
     @router.post('/internal/ims-prepare')
     async def prepare():
      async with httpx.AsyncClient(trust_env=False,timeout=120) as c:
       r=await c.get(os.environ['KOURIER_URL']+'/healthz',headers={'Host':MODEL_HOST});r.raise_for_status()
      return {'ready':True,'model':'qwen3-tts-base-1.7b'}
     async def generate(request:Request):
      if int(request.headers.get('content-length','0'))>12000000:raise HTTPException(413,'Reference request too large')
      b=await request.json();sample,rid=parse_input(b);started=time.monotonic()
      begin_trace(request,'ims-generation',rid,'generation','voice-ims-fast','Korean')
      async with _GATE:
       if REFERENCE_MODE=='xvector':sample=await normalized_reference(sample)
       async with httpx.AsyncClient(trust_env=False,timeout=180) as c:
        wake=asyncio.create_task(c.get(os.environ['KOURIER_URL']+'/healthz',headers={'Host':MODEL_HOST}))
        try:
         body={'text':b['text'],'reference':base64.b64encode(sample).decode(),'language':'Korean','reference_mode':REFERENCE_MODE}
         if REFERENCE_MODE=='icl':
          trace_phase(rid,'reference_transcribing');reference=await transcribe_reference(sample)
          trace_phase(rid,'reference_transcribed',reference_language=reference['language']);body['ref_text']=reference['transcript']
         else:trace_phase(rid,'reference_conditioning',reference_mode='xvector',reference_bytes=len(sample))
         (await wake).raise_for_status()
        finally:
         if not wake.done():wake.cancel()
         await asyncio.gather(wake,return_exceptions=True)
        for attempt in range(1,4):
         trace_phase(rid,'model_requested',attempt=attempt)
         r=await c.post(os.environ['KOURIER_URL']+'/infer',headers={'Host':MODEL_HOST,'X-Request-ID':rid+'-'+str(attempt)},json=body);r.raise_for_status()
         if r.headers.get('X-Voice-Contract')!='dynamic-v1':raise HTTPException(503,'Dynamic generation contract missing')
         timing=json.loads(r.headers.get('X-Generation-Timing','{}'))
         if REFERENCE_MODE=='xvector' and timing.get('reference_mode')!='xvector':raise HTTPException(503,'Reference conditioning contract missing')
         data=normalize_wav(r.content);trace_phase(rid,'quality_checking',pod=r.headers.get('X-Restore-Pod'))
         try:
          if RESIDENT_SPEECH:
           import ims_speech
           quality=await ims_speech.validate(data,b['text'],'Korean')
          else:quality=await generation_quality.validate(data,b['text'],'Korean')
         except generation_quality.QualityUnavailable:raise HTTPException(503,'Generated speech content check unavailable') from None
         trace_phase(rid,'quality_checked',passed=quality.get('passed',False),character_error_rate=quality.get('character_error_rate'),quality_seconds=quality.get('seconds'))
         if quality.get('passed'):
          trace_phase(rid,'generation_returned_to_ue',pod=r.headers.get('X-Restore-Pod'))
          return Response(data,media_type='audio/wav',headers={'X-Generation-Seconds':str(round(time.monotonic()-started,3)),'X-Generation-Model':'qwen3-tts-base-1.7b','X-Generation-Pod':r.headers.get('X-Restore-Pod',''),'X-Generation-Attempts':str(attempt),'X-Content-Check':'passed','X-Quality-Seconds':str(quality.get('seconds','')),'X-Generation-Timing':json.dumps(timing),'X-Request-ID':rid})
       raise HTTPException(422,'Generated speech did not pass content validation')
     @router.post('/internal/ims-generate')
     async def bounded_generate(request:Request):
      try:return await asyncio.wait_for(generate(request),timeout=360)
      except asyncio.TimeoutError:raise HTTPException(504,'GPU generation deadline exceeded') from None
      except (httpx.RequestError,httpx.HTTPStatusError):raise HTTPException(503,'GPU generation temporarily unavailable') from None
     return router
