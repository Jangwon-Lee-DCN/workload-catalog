    """IMS GPU gateway: authenticated transient audio, Knative calls and real observations."""
    import asyncio,base64,hashlib,hmac,io,json,os,re,time,wave
    from contextlib import asynccontextmanager
    from pathlib import Path
    import httpx
    from fastapi import FastAPI,HTTPException,Request
    from fastapi.responses import JSONResponse
    import gpu_metrics,model_scores

    TOKEN=os.environ.get('SERVICE_TOKEN','')
    if len(TOKEN)<24:raise RuntimeError('SERVICE_TOKEN is missing or too short')
    TRACES={}; METRICS={'status':'starting','sampled_at':0,'models':[]}
    TERMINAL={'complete','error','failed','cancelled','canceled','rejected','timed_out'}

    def identifier(value):
        if not isinstance(value,str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,100}',value):
            raise HTTPException(400,'Invalid request ID')
        return value

    def begin_trace(request,owner,rid,kind,model=None,language=None,parent=None):
        identifier(rid)
        if not isinstance(owner,str) or not 1<=len(owner)<=100:raise HTTPException(400,'Invalid owner')
        if rid in TRACES:raise HTTPException(409,'Request ID already used')
        if len(TRACES)>=512:
            done=[key for key,t in TRACES.items() if t['phase'] in TERMINAL]
            if not done:raise HTTPException(429,'Too many requests')
            del TRACES[done[0]]
        request.state.trace_id=rid
        TRACES[rid]={'id':rid,'owner':owner,'kind':kind,'model':model,'parent':parent,'phase':'accepted','marks':[{'phase':'accepted','at':time.time()}]}

    def trace_phase(rid,phase,**fields):
        if rid not in TRACES:return
        item=TRACES[rid];mark={'phase':phase,'at':time.time(),**fields}
        item['marks'].append(mark);item['marks']=item['marks'][-64:]
        item.update(phase=phase)
        if fields.get('pod'):item['pod']=fields['pod']

    def wav(data):
        try:
            if not 44<=len(data)<=6_000_000:raise ValueError()
            with wave.open(io.BytesIO(data)) as w:
                n=w.getnframes();rate=w.getframerate()
                if w.getnchannels()!=1 or w.getsampwidth()!=2 or rate not in (8000,16000,22050,24000,44100,48000) or not .1<=n/rate<=180:raise ValueError()
                if len(w.readframes(n))!=n*2:raise ValueError()
            return data
        except (EOFError,wave.Error,ValueError):raise HTTPException(400,'Invalid PCM16 mono WAV') from None

    async def samples():
        global METRICS
        while True:
            try:
                observation=await asyncio.to_thread(gpu_metrics.sample)
                for event in observation.get('model_events',[]):
                    item=TRACES.get(event.get('id'))
                    if item and event.get('phase')=='model_started':
                        if not any(m.get('phase')=='model_started' and m.get('pod')==event.get('pod') for m in item['marks']):
                            item['marks'].append(event)
                METRICS=observation
            except Exception:
                # Keep the last successful sample timestamp; never fabricate online/zero Pods.
                METRICS={**METRICS,'status':'unavailable'}
            await asyncio.sleep(1)

    @asynccontextmanager
    async def lifespan(app):
        import ims_speech
        await ims_speech.warm()
        task=asyncio.create_task(samples())
        try:yield
        finally:
            task.cancel();await asyncio.gather(task,return_exceptions=True);await ims_speech._stop()

    app=FastAPI(lifespan=lifespan,docs_url=None,redoc_url=None,openapi_url=None)

    @app.middleware('http')
    async def boundary(request,call_next):
        if request.url.path!='/healthz':
            supplied=request.headers.get('Authorization','')
            if not hmac.compare_digest(supplied,'Bearer '+TOKEN):return JSONResponse({'detail':'Unauthorized'},401)
        if request.method=='POST':
            body=bytearray()
            async for chunk in request.stream():
                body.extend(chunk)
                if len(body)>12_000_000:return JSONResponse({'detail':'Request too large'},413)
            request._body=bytes(body)
        rid=request.headers.get('X-Request-ID','')
        try:
            response=await call_next(request)
            # Generation IDs can be supplied in JSON rather than the request header.
            trace_id=getattr(request.state,'trace_id',None)
            if trace_id:trace_phase(trace_id,'complete' if response.status_code<400 else 'error')
            return response
        except Exception:
            trace_id=getattr(request.state,'trace_id',None)
            if trace_id:trace_phase(trace_id,'error')
            return JSONResponse({'detail':'GPU request failed'},503)

    @app.get('/healthz')
    def health():
        return {'ok':Path('/cache-ready').is_file(),'role':'gpu'} if Path('/cache-ready').is_file() else JSONResponse({'ok':False},503)

    @app.get('/internal/metrics')
    def metrics():return {**METRICS,'requests':list(TRACES.values())}

    @app.post('/internal/verify')
    async def verify(request:Request):
        rid=None
        try:
            b=await request.json()
            if not isinstance(b,dict):raise HTTPException(400,'Invalid verification request')
            rid=identifier(b.get('request_id'))
            data=wav(base64.b64decode(b['audio'],validate=True))
            begin_trace(request,b.get('owner','ims-mec'),rid,'verification','sasv-restored',parent=b.get('parent'))
            start=time.monotonic();trace_phase(rid,'model_requested')
            async with httpx.AsyncClient(trust_env=False,timeout=180) as c:
                r=await c.post(os.environ['KOURIER_URL']+'/detect/MDT_241214_lora_250501',headers={'Host':os.environ['AISRC_HOST'],'X-Request-ID':rid},data={'uid':rid,'is_confidence':'true'},files={'file':('sample.wav',data,'audio/wav')})
                r.raise_for_status()
            result=r.json();prediction=result.get(rid);pod=r.headers.get('X-Restore-Pod')
            if prediction not in ('Real','Fake') or not pod:raise HTTPException(502,'Invalid detector response')
            trace_phase(rid,'model_response',pod=pod)
            scores=await asyncio.to_thread(model_scores.read_scores,pod,rid,prediction)
            trace_phase(rid,'complete',pod=pod)
            return {'prediction':prediction,'raw':result,'sha256':hashlib.sha256(data).hexdigest(),'seconds':time.monotonic()-start,'pod':pod,'scores':scores}
        except HTTPException:
            if getattr(request.state,'trace_id',None)==rid and rid in TRACES and TRACES[rid]['phase'] not in TERMINAL:trace_phase(rid,'error')
            raise
        except (KeyError,TypeError,ValueError):
            if getattr(request.state,'trace_id',None)==rid and rid:trace_phase(rid,'error')
            raise HTTPException(400,'Invalid verification request') from None
        except Exception:
            if getattr(request.state,'trace_id',None)==rid and rid:trace_phase(rid,'error')
            raise HTTPException(503,'Detector temporarily unavailable') from None

    from ims_generation import build_router
    app.include_router(build_router(begin_trace,trace_phase,wav))
