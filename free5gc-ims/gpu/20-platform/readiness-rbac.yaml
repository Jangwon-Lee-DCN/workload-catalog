apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-platform-readiness
  namespace: gpu-cr-system
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  resourceNames:
  - voice-installation-reference
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
