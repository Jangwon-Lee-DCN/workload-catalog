    """Per-Pod request serialization and restore ACK readiness; no app modifications."""
    import http.client
    import http.server
    import os
    import pathlib
    import signal
    import threading

    ready = pathlib.Path('/restore-run')/os.environ['SOURCE_UID']/'restored-ready'
    lock = threading.Lock()
    failed = threading.Event()
    signal.signal(signal.SIGTERM, lambda *_: exit(0))
    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, *_): pass
        def do_GET(self):
            self.send_response(200 if ready.is_file() and not failed.is_set() else 503)
            self.end_headers()
        def do_POST(self):
            if not ready.is_file() or failed.is_set():
                self.send_error(503, 'Restore not ready')
                return
            length = int(self.headers.get('Content-Length', '0'))
            if not 0 < length <= 32*1024*1024:
                self.send_error(413)
                return
            body = self.rfile.read(length)
            with lock:
                if failed.is_set():
                    self.send_error(503, 'Upstream state unknown')
                    return
                conn = http.client.HTTPConnection('127.0.0.1',5433,timeout=600)
                completed = False
                try:
                    conn.request('POST',self.path,body,{'Content-Type':self.headers['Content-Type'],'Connection':'close'})
                    response=conn.getresponse()
                    payload=response.read()
                    completed = True
                    self.send_response(response.status)
                    self.send_header('Content-Type',response.getheader('Content-Type','application/json'))
                    self.send_header('Content-Length',str(len(payload)))
                    self.send_header('X-Restore-Pod',os.environ.get('HOSTNAME','unknown'))
                    self.end_headers()
                    self.wfile.write(payload)
                except (BrokenPipeError,ConnectionResetError):
                    if not completed: failed.set()
                except Exception:
                    # Upstream may still be executing after a timeout: fail closed,
                    # never release another inference into an unknown app state.
                    failed.set()
                    try: self.send_error(502, 'Upstream state unknown')
                    except (BrokenPipeError,ConnectionResetError): pass
                finally:
                    conn.close()
    http.server.ThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()
