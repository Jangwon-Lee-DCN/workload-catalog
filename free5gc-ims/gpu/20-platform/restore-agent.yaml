apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-cr-node-agent
  namespace: gpu-cr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-cr-node-agent
rules:
- apiGroups:
  - gpu-cr.io
  resources:
  - gpucheckpoints
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - gpu-cr.io
  resources:
  - gpucheckpoints/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes/proxy
  - nodes/checkpoint
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-cr-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-cr-node-agent
subjects:
- kind: ServiceAccount
  name: gpu-cr-node-agent
  namespace: gpu-cr-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-cr-node-agent
  namespace: gpu-cr-system
  labels:
    app.kubernetes.io/name: gpu-cr-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-cr-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-cr-node-agent
    spec:
      serviceAccountName: gpu-cr-node-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: node-agent
        image: docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
        imagePullPolicy: IfNotPresent
        args:
        - --kubelet-url=https://127.0.0.1:10250
        - --kubelet-insecure=true
        - --kubelet-timeout=30m
        - --host-lib-dir=/host/gpu-cr/lib
        - --host-run-dir=/host/gpu-cr/run
        - --interceptor-dist-dir=/lab/interceptor
        - --dry-run=false
        - --metrics-bind-address=:9290
        - --health-probe-bind-address=:9291
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: gpu-cr-host
          mountPath: /host/gpu-cr
        - name: kubelet-checkpoints
          mountPath: /var/lib/kubelet/checkpoints
        - name: gcr-checkpoint
          mountPath: /var/lib/gcr-checkpoint
        - name: gcr-data
          mountPath: /var/lib/gcr-data
        - name: agent-bin
          mountPath: /lab
          readOnly: true
        ports:
        - name: metrics
          containerPort: 9290
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9291
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9291
          initialDelaySeconds: 10
        command:
        - /lab/node-agent
      volumes:
      - name: gpu-cr-host
        hostPath:
          path: /var/lib/gpu-cr
          type: DirectoryOrCreate
      - name: kubelet-checkpoints
        hostPath:
          path: /var/lib/kubelet/checkpoints
          type: DirectoryOrCreate
      - name: gcr-checkpoint
        hostPath:
          path: /var/lib/gcr-checkpoint
          type: DirectoryOrCreate
      - name: gcr-data
        hostPath:
          path: /var/lib/gcr-data
          type: DirectoryOrCreate
      - name: agent-bin
        hostPath:
          path: /opt/gpu-cr/bin
          type: Directory
