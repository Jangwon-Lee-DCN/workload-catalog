apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-install-code
  namespace: gpu-cr-system
data:
  bootstrap.py: |
    """Public orchestration; checkpoint implementation is supplied as prebuilt node binaries."""
    import base64,hashlib,http.client,json,os,pathlib,secrets,socket,ssl,sys,time,urllib.error,urllib.request

    ROOT=pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount')
    NS='gpu-cr-system'
    MODELS=[('detector','sasv-restore-lab','sasv-source','sasv-api','sasv-checkpoint','aisrc'),('base','qwen-tts-lab','voice-base-source','voice-api','voice-base-checkpoint','base')]

    class Api:
        def __init__(self):
            self.url='https://'+os.environ['KUBERNETES_SERVICE_HOST']+':'+os.environ.get('KUBERNETES_SERVICE_PORT','443')
            self.context=ssl.create_default_context(cafile=str(ROOT/'ca.crt'))
        def request(self,method,path,body=None):
            headers={'Authorization':'Bearer '+(ROOT/'token').read_text().strip()}
            if body is not None:headers['Content-Type']='application/merge-patch+json' if method=='PATCH' else 'application/json'
            req=urllib.request.Request(self.url+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
            with urllib.request.urlopen(req,context=self.context,timeout=30) as response:return json.load(response)
        def maybe(self,path):
            try:return self.request('GET',path)
            except urllib.error.HTTPError as e:
                if e.code==404:return None
                raise
        def put(self,collection,name,obj):
            current=self.maybe(collection+'/'+name)
            if current:
                if current.get('data')==obj.get('data'):return current
                obj['metadata']['resourceVersion']=current['metadata']['resourceVersion']
                return self.request('PUT',collection+'/'+name,obj)
            return self.request('POST',collection,obj)

    def cm(api,name,data):
        return api.put('/api/v1/namespaces/'+NS+'/configmaps',name,{'apiVersion':'v1','kind':'ConfigMap','metadata':{'name':name,'namespace':NS},'data':data})

    def dotenv(path):
        result={}
        for line in pathlib.Path(path).read_text().splitlines():
            line=line.strip()
            if not line or line.startswith('#'):continue
            if line.startswith('export '):line=line[7:]
            key,sep,value=line.partition('=')
            if not sep or not key.replace('_','a').isalnum():raise ValueError('Invalid AISRC environment file')
            value=value.strip()
            if len(value)>=2 and value[0]==value[-1] and value[0] in "\"'":value=value[1:-1]
            result[key]=value
        return result

    def inject():
        api=Api();root=pathlib.Path('/input')
        required=['.ready','image.tar','machine-id','runtime/client.env','runtime/pretrained','runtime/DATA/license','runtime/DATA/security']
        while not all((root/p).exists() for p in required):
            print('WAITING_FOR_AISRC_FILES',flush=True);time.sleep(10)
        import subprocess
        subprocess.run(['bash','/bootstrap/stage-private.sh'],check=True)
        for name,namespace,values in [('sasv-runtime-env','sasv-restore-lab',dotenv(root/'runtime/client.env')),('voice-gpu-api-secrets','voice-system',{'SERVICE_TOKEN':secrets.token_urlsafe(32)})]:
            collection='/api/v1/namespaces/'+namespace+'/secrets';existing=api.maybe(collection+'/'+name)
            if name=='voice-gpu-api-secrets' and existing:
                assert len(base64.b64decode(existing['data']['SERVICE_TOKEN']))>=24
                continue
            encoded={k:base64.b64encode(v.encode()).decode() for k,v in values.items()}
            api.put(collection,name,{'apiVersion':'v1','kind':'Secret','metadata':{'name':name,'namespace':namespace},'type':'Opaque','data':encoded})
        pathlib.Path('/host/run/voice-private-ready').touch()
        print('AISRC_INPUTS_READY',flush=True)
        while True:time.sleep(30)

    def wait_source(api,namespace,name,port):
        deadline=time.monotonic()+2400
        while time.monotonic()<deadline:
            pod=api.maybe('/api/v1/namespaces/'+namespace+'/pods/'+name)
            if pod and pod.get('status',{}).get('phase')=='Failed':raise RuntimeError('Model source Pod failed: '+name)
            ip=(pod or {}).get('status',{}).get('podIP')
            if ip:
                try:
                    with socket.create_connection((ip,port),timeout=2):return ip
                except OSError:pass
            time.sleep(3)
        raise TimeoutError('Source did not start: '+name)

    def warm_detector(ip):
        sample=pathlib.Path('/samples/official-reference.wav').read_bytes();boundary='kpt-bootstrap-source'
        body=b''
        for key,value in [('uid',b'kpt-bootstrap'),('is_confidence',b'true'),('file',sample)]:
            head='--'+boundary+'\r\nContent-Disposition: form-data; name="'+key+'"'
            if key=='file':head+='; filename="reference.wav"\r\nContent-Type: audio/wav'
            body+=head.encode()+b'\r\n\r\n'+value+b'\r\n'
        body+=('--'+boundary+'--\r\n').encode()
        req=urllib.request.Request('http://'+ip+':5433/detect/MDT_241214_lora_250501',body,{'Content-Type':'multipart/form-data; boundary='+boundary})
        with urllib.request.urlopen(req,timeout=360) as response:result=json.load(response)
        if result.get('kpt-bootstrap') not in ['Real','Fake']:raise ValueError('Source returned no valid classification')

    def platform_ready(api):
        for group,resource in [('gpu-cr.io/v1alpha1','gpucheckpoints'),('serving.knative.dev/v1','services')]:
            discovery=api.maybe('/apis/'+group)
            if not discovery or not any(r.get('name')==resource for r in discovery.get('resources',[])):return False
        jobs=[('qwen-tts-lab','voice-model-download'),('qwen-tts-lab','voice-env-setup'),('voice-system','voice-stt-model'),(NS,'voice-installation-reference')]
        for namespace,name in jobs:
            job=api.maybe('/apis/batch/v1/namespaces/'+namespace+'/jobs/'+name)
            conditions=(job or {}).get('status',{}).get('conditions',[])
            if any(c.get('type')=='Failed' and c.get('status')=='True' for c in conditions):
                raise RuntimeError('Platform prerequisite failed: '+namespace+'/'+name)
            if not any(c.get('type')=='Complete' and c.get('status')=='True' for c in conditions):return False
        for namespace,name in [(NS,'voice-private-inputs'),(NS,'gpu-cr-node-agent'),('kube-system','nvidia-device-plugin-daemonset')]:
            obj=api.maybe('/apis/apps/v1/namespaces/'+namespace+'/daemonsets/'+name)
            if not obj:return False
            status=obj.get('status',{});desired=status.get('desiredNumberScheduled',0)
            if desired<1 or status.get('observedGeneration',0)<obj['metadata']['generation'] or status.get('numberAvailable',0)<desired:return False
        for name in ['controller','webhook']:
            obj=api.maybe('/apis/apps/v1/namespaces/knative-serving/deployments/'+name)
            if not obj:return False
            status=obj.get('status',{})
            if status.get('observedGeneration',0)<obj['metadata']['generation'] or status.get('availableReplicas',0)<obj.get('spec',{}).get('replicas',1):return False
        return True

    def wait_platform(api,timeout=10800):
        deadline=time.monotonic()+timeout
        while time.monotonic()<deadline:
            try:
                if platform_ready(api):
                    print('PLATFORM_PREREQUISITES_READY',flush=True);return
            except urllib.error.HTTPError as error:
                if error.code not in [403,404,429,500,502,503,504]:raise
            except (urllib.error.URLError,OSError):pass
            print('WAITING_FOR_PLATFORM_PREREQUISITES',flush=True);time.sleep(10)
        raise TimeoutError('Platform prerequisites did not become ready')

    def capture():
        api=Api();wait_platform(api)
        profiles={};templates=json.loads(pathlib.Path('/bootstrap/source-pods.json').read_text())
        try:
            for key,namespace,podname,container,checkpoint,cachekey in MODELS:
                path='/apis/gpu-cr.io/v1alpha1/namespaces/'+namespace+'/gpucheckpoints';cr=api.maybe(path+'/'+checkpoint)
                if not cr or cr.get('status',{}).get('phase')!='Completed':
                    podpath='/api/v1/namespaces/'+namespace+'/pods'
                    if not api.maybe(podpath+'/'+podname):api.request('POST',podpath,templates[key])
                    ip=wait_source(api,namespace,podname,5433 if key=='detector' else 8000)
                    if key=='detector':warm_detector(ip)
                    else:
                        with urllib.request.urlopen('http://'+ip+':8000/healthz',timeout=30) as response:
                            assert response.status==200
                            response.read()
                    if not cr:api.request('POST',path,{'apiVersion':'gpu-cr.io/v1alpha1','kind':'GPUCheckpoint','metadata':{'name':checkpoint,'namespace':namespace},'spec':{'workloadRef':{'kind':'Pod','namespace':namespace,'name':podname,'container':container},'storage':{'type':'hostPath','path':'/var/lib/gcr-checkpoint'}}})
                    deadline=time.monotonic()+1800
                    while time.monotonic()<deadline:
                        cr=api.request('GET',path+'/'+checkpoint);phase=cr.get('status',{}).get('phase')
                        if phase=='Completed':break
                        if phase in ['Failed','Error']:raise RuntimeError('Checkpoint failed: '+checkpoint)
                        time.sleep(3)
                    else:raise TimeoutError('Checkpoint timeout: '+checkpoint)
                status=cr['status'];archive=pathlib.Path(status['lastCheckpointPath']);blob=archive.with_suffix('.blob')
                for file in [archive,blob]:
                    assert file.parent==pathlib.Path('/var/lib/gcr-checkpoint') and file.is_file(),str(file)
                def digest(file):
                    with file.open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
                profiles[key]={'uid':status['podUID'],'record':{'model':cachekey,'archive':str(archive),'blob':str(blob),'archive_sha256':digest(archive),'blob_sha256':digest(blob)}}
                cm(api,'voice-profile-'+key,{'profile.json':json.dumps(profiles[key])})
                if api.maybe('/api/v1/namespaces/'+namespace+'/pods/'+podname):api.request('DELETE','/api/v1/namespaces/'+namespace+'/pods/'+podname)
                print('MODEL_CHECKPOINT_READY '+key,flush=True)
            cm(api,'voice-cache-records',{'checkpoints.json':json.dumps([profiles[key]['record'] for key,*_ in MODELS])})
            print('MODEL_PROFILES_READY',flush=True)
        finally:
            # Keep failed sources available for logs; successful sources are removed above.
            pass

    def replace(value,old,new):
        if isinstance(value,str):return value.replace(old,new)
        if isinstance(value,list):return [replace(v,old,new) for v in value]
        if isinstance(value,dict):return {k:replace(v,old,new) for k,v in value.items()}
        return value

    def contains(actual,wanted):
        if isinstance(wanted,dict):
            return isinstance(actual,dict) and all(k in actual and contains(actual[k],v) for k,v in wanted.items())
        if isinstance(wanted,list):
            return isinstance(actual,list) and len(actual)==len(wanted) and all(contains(a,b) for a,b in zip(actual,wanted))
        return actual==wanted

    def bind():
        api=Api();ready=pathlib.Path('/run-state/services-ready')
        while True:
            try:
                complete=True
                for key,namespace,_,_,_,_ in MODELS:
                    profile=json.loads(api.request('GET','/api/v1/namespaces/'+NS+'/configmaps/voice-profile-'+key)['data']['profile.json'])
                    template=api.request('GET','/api/v1/namespaces/'+namespace+'/configmaps/voice-service-template')
                    desired=json.loads(template['data']['service.json'])
                    annotations=desired['spec']['template']['metadata']['annotations'];old=annotations['gpu-cr.io/source-pod-uid']
                    desired=replace(desired,old,profile['uid'])
                    desired['spec']['template']['metadata']['annotations']['gpu-cr.io/data-uri']='hostpath://'+profile['record']['blob']
                    desired['metadata']['ownerReferences']=[{'apiVersion':'v1','kind':'ConfigMap','name':template['metadata']['name'],'uid':template['metadata']['uid']}]
                    collection='/apis/serving.knative.dev/v1/namespaces/'+namespace+'/services'
                    path=collection+'/'+desired['metadata']['name'];service=api.maybe(path)
                    if not service:
                        api.request('POST',collection,desired);complete=False
                    elif not contains(service['spec'],desired['spec']) or not contains(service['metadata'].get('ownerReferences',[]),desired['metadata']['ownerReferences']):
                        api.request('PATCH',path,{'spec':desired['spec'],'metadata':{'ownerReferences':desired['metadata']['ownerReferences']}});complete=False
                    else:
                        status=service.get('status',{});complete &= status.get('observedGeneration',0)>=service['metadata']['generation'] and status.get('latestReadyRevisionName')==status.get('latestCreatedRevisionName') and any(c['type']=='Ready' and c['status']=='True' for c in status.get('conditions',[]))
                if complete:ready.touch()
                else:ready.unlink(missing_ok=True)
            except (urllib.error.URLError,KeyError,ValueError):ready.unlink(missing_ok=True)
            time.sleep(3)

    if __name__=='__main__':
        {'inject':inject,'capture':capture,'bind':bind}[sys.argv[1]]()
