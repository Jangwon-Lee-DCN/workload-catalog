    #!/usr/bin/env bash
    set -euo pipefail
    install -m 0700 /bootstrap/host-private.sh /host/run/ims-host-private.sh
    nsenter -t 1 -m -p -r -w -- /usr/bin/bash /run/ims-host-private.sh
  host-private.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    INPUT=/var/lib/voice-private/aisrc
    STATE=/var/lib/voice-service/bootstrap
    mkdir -p "$STATE" /opt/sasv-client-api/DATA /opt/sasv-client-api/cache/torch-seed /var/lib/qwen-tts-lab
    for name in image.tar machine-id runtime/client.env runtime/pretrained runtime/DATA/license runtime/DATA/security; do
      test -e "$INPUT/$name"
    done
    # Public optimization libraries arrive with the pinned node runtime release.
    test -s /opt/voice-runtime/simd-libs-seed/pybase64/__init__.py
    install -m 0444 "$INPUT/machine-id" /opt/sasv-client-api/machine-id
    cp -a "$INPUT/runtime/DATA/license" "$INPUT/runtime/DATA/security" /opt/sasv-client-api/DATA/
    cp -a "$INPUT/runtime/pretrained" /opt/sasv-client-api/
    tar -xf /opt/voice-runtime/silero-vad-seed.tar -C /opt/sasv-client-api/cache/torch-seed
    for folder in uploads speaker_embs enroll_tmp archive runtime-cache/numba-3a07eb16e74e; do mkdir -p "/opt/sasv-client-api/DATA/$folder"; done
    chown -R root:10001 /opt/sasv-client-api
    chmod -R u=rwX,g=rX,o= /opt/sasv-client-api
    for folder in security uploads speaker_embs enroll_tmp archive runtime-cache/numba-3a07eb16e74e; do
      chown -R 10001:10001 "/opt/sasv-client-api/DATA/$folder"
      chmod -R u=rwX,go= "/opt/sasv-client-api/DATA/$folder"
    done
    current=$(sha256sum "$INPUT/image.tar" | cut -d' ' -f1)
    if ! test -s "$STATE/aisrc-image.sha256" || ! grep -qx "$current" "$STATE/aisrc-image.sha256" || ! crictl inspecti localhost/sasv-api-secure:baseline >/dev/null 2>&1; then
      format=$(python3 - "$INPUT/image.tar" <<'PY'
    import sys,tarfile
    with tarfile.open(sys.argv[1]) as archive:
        try:archive.getmember('oci-layout');print('oci-archive')
        except KeyError:print('docker-archive')
    PY
    )
      skopeo copy "$format:$INPUT/image.tar" containers-storage:localhost/sasv-api-secure:baseline
      printf '%s\n' "$current" > "$STATE/aisrc-image.sha256"
    fi
    crictl inspecti localhost/sasv-api-secure:baseline >/dev/null
    printf 'AISRC_FILES_STAGED\n'
