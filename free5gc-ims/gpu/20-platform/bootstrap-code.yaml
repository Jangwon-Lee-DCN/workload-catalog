      "base": {
        "apiVersion": "v1",
        "kind": "Pod",
        "metadata": {
          "name": "voice-base-source",
          "namespace": "qwen-tts-lab"
        },
        "spec": {
          "restartPolicy": "Never",
          "automountServiceAccountToken": false,
          "containers": [
            {
              "name": "voice-api",
              "image": "docker.io/pytorch/pytorch@sha256:77f17f843507062875ce8be2a6f76aa6aa3df7f9ef1e31d9d7432f4b0f563dee",
              "imagePullPolicy": "IfNotPresent",
              "command": [
                "bash",
                "-ec",
                "export LD_PRELOAD=/opt/gpu-cr/libgcr-interceptor.so; exec /data/voice-env/bin/python /fast-model/fast_clone_server.py"
              ],
              "env": [
                {
                  "name": "HF_HOME",
                  "value": "/data/huggingface"
                },
                {
                  "name": "HF_HUB_OFFLINE",
                  "value": "1"
                },
                {
                  "name": "OMP_NUM_THREADS",
                  "value": "1"
                },
                {
                  "name": "MKL_NUM_THREADS",
                  "value": "1"
                },
                {
                  "name": "GCR_VMM_ALLOC",
                  "value": "1"
                },
                {
                  "name": "GCR_CONTROL_DIR",
                  "value": "/var/lib/gpu-cr/run"
                },
                {
                  "name": "GCR_DATA_DIR",
                  "value": "/var/lib/gcr-data"
                },
                {
                  "name": "GCR_POD_UID",
                  "valueFrom": {
                    "fieldRef": {
                      "fieldPath": "metadata.uid"
                    }
                  }
                },
                {
                  "name": "VOICE_SIZE",
                  "value": "1.7B"
                },
                {
                  "name": "VOICE_CPU_THREADS",
                  "value": "1"
                },
                {
                  "name": "VOICE_SOURCE_WARMUP",
                  "value": "1"
                },
                {
                  "name": "VOICE_CODEC_GRAPH",
                  "value": "1"
                }
              ],
              "volumeMounts": [
                {
                  "name": "data",
                  "mountPath": "/data"
                },
                {
                  "name": "lib",
                  "mountPath": "/opt/gpu-cr"
                },
                {
                  "name": "run",
                  "mountPath": "/var/lib/gpu-cr/run"
                },
                {
                  "name": "blob",
                  "mountPath": "/var/lib/gcr-data"
                },
                {
                  "name": "tmp",
                  "mountPath": "/tmp"
                },
                {
                  "name": "shm",
                  "mountPath": "/dev/shm"
                },
                {
                  "name": "fast-model-code",
                  "mountPath": "/fast-model",
                  "readOnly": true
                }
              ],
              "resources": {
                "requests": {
                  "cpu": "4",
                  "memory": "8Gi",
                  "nvidia.com/gpu": "1"
                },
                "limits": {
                  "cpu": "12",
                  "memory": "40Gi",
                  "nvidia.com/gpu": "1"
                }
              },
              "ports": [
                {
                  "containerPort": 8000
                }
              ]
            }
          ],
          "initContainers": [
            {
              "name": "wait-reference",
              "image": "docker.io/library/python@sha256:2b4f19dae3a777dfc3b76730bda1e82e1f66ab2a2686fa93ca78edbfb4f04ffe",
              "command": [
                "python",
                "-c",
                "import pathlib,time; root=pathlib.Path('/data'); deadline=time.monotonic()+7200\nwhile not ((root/'official-reference.wav').is_file() and (root/'.voice-env-ready').is_file()):\n assert time.monotonic()<deadline;time.sleep(2)"
              ],
              "volumeMounts": [
                {
                  "name": "data",
                  "mountPath": "/data",
                  "readOnly": true
                }
              ]
            },
            {
              "name": "prepare",
              "image": "docker.io/pytorch/pytorch@sha256:77f17f843507062875ce8be2a6f76aa6aa3df7f9ef1e31d9d7432f4b0f563dee",
              "command": [
                "bash",
                "-ec",
                "mkdir -p /var/lib/gpu-cr/run/$UID_VALUE /var/lib/gcr-data/$UID_VALUE /tmp/gpu-lock; printf 0 > /var/lib/gpu-cr/run/$UID_VALUE/control"
              ],
              "env": [
                {
                  "name": "UID_VALUE",
                  "valueFrom": {
                    "fieldRef": {
                      "fieldPath": "metadata.uid"
                    }
                  }
                },
                {
                  "name": "NVIDIA_VISIBLE_DEVICES",
                  "value": "void"
                }
              ],
              "volumeMounts": [
                {
                  "name": "data",
                  "mountPath": "/data"
                },
                {
                  "name": "lib",
                  "mountPath": "/opt/gpu-cr"
                },
                {
                  "name": "run",
                  "mountPath": "/var/lib/gpu-cr/run"
                },
                {
                  "name": "blob",
                  "mountPath": "/var/lib/gcr-data"
                },
                {
                  "name": "tmp",
                  "mountPath": "/tmp"
                },
                {
                  "name": "shm",
                  "mountPath": "/dev/shm"
                }
              ]
            }
          ],
          "volumes": [
            {
              "name": "data",
              "hostPath": {
                "path": "/var/lib/qwen-tts-lab",
                "type": "Directory"
              }
            },
            {
              "name": "lib",
              "hostPath": {
                "path": "/var/lib/gpu-cr/lib",
                "type": "Directory"
              }
            },
            {
              "name": "run",
              "hostPath": {
                "path": "/var/lib/gpu-cr/run",
                "type": "Directory"
              }
            },
            {
              "name": "blob",
              "hostPath": {
                "path": "/var/lib/gcr-data",
                "type": "Directory"
              }
            },
            {
              "name": "tmp",
              "emptyDir": {}
            },
            {
              "name": "shm",
              "emptyDir": {
                "medium": "Memory",
                "sizeLimit": "2Gi"
              }
            },
            {
              "name": "fast-model-code",
              "configMap": {
                "name": "voice-fast-model"
              }
            }
          ],
          "tolerations": [
            {
              "key": "node-role.kubernetes.io/control-plane",
              "operator": "Exists",
              "effect": "NoSchedule"
            }
          ]
        }
      }
    }
