apiVersion: v1
data:
  webuicfg.yaml: |
    info:
      version: 1.0.3
      description: WebUI initial local configuration
    configuration:
      mongodb:
        name: free5gc
        url: mongodb://mongodb:27017
      nrfUri: https://nrf-service:8000
      webServer:
        scheme: http
        ipv4Address: 0.0.0.0
        port: 5000
      billingServer:
        enable: true
        hostIPv4: 127.0.0.1
        port: 2122
        scheme: http
        basePath: /
        listenPort: 2122
        portRange:
          start: 2122
          end: 2122
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: webui-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
