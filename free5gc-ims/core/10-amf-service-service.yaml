apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: amf-service
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ports:
    - name: sbi
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: ngap
      port: 38412
      protocol: SCTP
      targetPort: 38412
  selector:
    app: amf
  sessionAffinity: None
  type: ClusterIP
