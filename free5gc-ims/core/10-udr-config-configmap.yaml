apiVersion: v1
data:
  udrcfg.yaml: |
    info:
      version: 1.1.0
      description: UDR initial local configuration
    configuration:
      sbi:
        scheme: https
        registerIPv4: udr-service
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/udr.key
          pem: cert/udr.pem
      dbConnectorType: mongodb
      mongodb:
        name: free5gc
        url: mongodb://mongodb:27017
      nrfUri: https://nrf-service:8000 # kpt-set: ${nrf-service-name}
      serviceNameList:
        - nudr-dr
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: udr-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
