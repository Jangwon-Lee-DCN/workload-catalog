apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nssf
    app.kubernetes.io/instance: core
  name: nssf
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nssf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nssf
    spec:
      containers:
        - command:
            - /free5gc/nssf
            - -c
            - /free5gc/config/nssfcfg.yaml
          image: docker.io/free5gc/nssf@sha256:dfe8c68c04b45cbb79deb2c65296d701b452a5301ff156c50f83078fcbf507c8
          imagePullPolicy: IfNotPresent
          name: nssf
          ports:
            - containerPort: 8000
              name: sbi
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/nssfcfg.yaml
              name: config
              subPath: nssfcfg.yaml
          workingDir: /free5gc
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - |
              until nc -zw3 nrf-service.free5gc.svc.cluster.local 8000; do
                echo waiting for nrf
                sleep 2
              done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-nrf
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: nssf-config
          name: config
