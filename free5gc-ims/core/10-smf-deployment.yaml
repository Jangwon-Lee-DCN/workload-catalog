apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: smf
    app.kubernetes.io/instance: core
    app.kubernetes.io/part-of: free5gc-cp
    app.kubernetes.io/version: v3.4.3
  name: smf
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: smf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: free5gc-smf-n4
      labels:
        app: smf
    spec:
      containers:
        - args:
            - -c
            - /free5gc/config/smfcfg.yaml
            - -u
            - /free5gc/config/uerouting.yaml
          command:
            - ./smf
          image: docker.io/free5gc/smf@sha256:60e38baa4b10d6816cf9fc20ff73199cd96714f8afa98beb508dd3d71f1b4f52
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            tcpSocket:
              port: 8000
            timeoutSeconds: 5
          name: smf
          ports:
            - containerPort: 8000
              name: sbi
              protocol: TCP
            - containerPort: 8805
              name: pfcp
              protocol: UDP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8000
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/smfcfg.yaml
              name: smf-config
              subPath: smfcfg.yaml
            - mountPath: /free5gc/config/uerouting.yaml
              name: uerouting-config
              subPath: uerouting.yaml
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - until nc -zw3 nrf-service.free5gc.svc.cluster.local 8000; do echo waiting for nrf; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-nrf
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        - command:
            - sh
            - -c
            - until nc -zw3 amf-service.free5gc.svc.cluster.local 8000; do echo waiting for amf; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-amf
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      nodeName: '@{core-node-name}'
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: smf-config
          name: smf-config
        - configMap:
            defaultMode: 420
            name: uerouting-config
          name: uerouting-config
