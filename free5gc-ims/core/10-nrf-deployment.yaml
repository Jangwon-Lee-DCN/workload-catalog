apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: nrf
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nrf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nrf
    spec:
      containers:
        - command:
            - ./nrf
            - -c
            - /free5gc/config/nrfcfg.yaml
          image: docker.io/free5gc/nrf@sha256:99e46b860efb4d1d50dbc8d73aa872a03bbfe94a54e126a8cd69d369104c009d
          imagePullPolicy: IfNotPresent
          name: nrf
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 8000
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/nrfcfg.yaml
              name: config
              subPath: nrfcfg.yaml
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - until nc -zw3 mongodb.free5gc.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-mongo
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: nrf-config
          name: config
