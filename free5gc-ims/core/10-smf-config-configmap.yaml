apiVersion: v1
data:
  smfcfg.yaml: |
    info:
      version: 1.0.7
      description: SMF initial local configuration

    configuration:
      smfName: SMF
      sbi:
        scheme: https
        registerIPv4: smf-service
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/smf.key
          pem: cert/smf.pem
      serviceNameList:
        - nsmf-pdusession
        - nsmf-event-exposure
        - nsmf-oam
      snssaiInfos:
        - sNssai:
            sst: 1        # kpt-set: ${sst}
            sd: "010203"  # kpt-set: ${sd}
          dnnInfos:
            - dnn: internet # kpt-set: ${dnn}
              dns:
                ipv4: 8.8.8.8 # kpt-set: ${ue-dns}
              ueSubnets:
                - @{ue-cidr} # kpt-set: ${ue-subnet}
      nrfUri: https://nrf-service:8000 # kpt-set: ${nrf-uri}
      pfcp:
        listenAddr: @{smf-n4-ip}   # kpt-set: ${smf-n4-ip}
        externalAddr: @{smf-n4-ip} # kpt-set: ${smf-n4-ip}
        nodeID: @{smf-n4-ip}       # kpt-set: ${smf-n4-ip}
        assocFailAlertInterval: 10s
        assocFailRetryInterval: 30s
        heartbeatInterval: 10s
      userplaneInformation:
        upNodes:
          gNB:
            type: AN
          UPF:
            type: UPF
            nodeID: @{upf-n4-ip} # kpt-set: ${upf-n4-ip}
            addr: @{upf-n4-ip}   # kpt-set: ${upf-n4-ip}
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1          # kpt-set: ${sst}
                  sd: "010203"    # kpt-set: ${sd}
                dnnUpfInfoList:
                  - dnn: internet # kpt-set: ${dnn}
                    pools:
                      - cidr: @{ue-cidr} # kpt-set: ${ue-subnet}
            interfaces:
              - interfaceType: N3
                endpoints:
                  - @{upf-n3-ip} # kpt-set: ${upf-n3-ip}
                networkInstances:
                  - internet # kpt-set: ${dnn}
        links:
          - A: gNB
            B: UPF
      locality: area1
      t3591:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      t3592:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3

    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app: smf
    app.kubernetes.io/instance: core
    app.kubernetes.io/part-of: free5gc-cp
  name: smf-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
