apiVersion: v1
data:
  nssfcfg.yaml: |
    info:
      version: 1.0.2
      description: NSSF initial local configuration

    configuration:
      nssfName: NSSF
      sbi:
        scheme: https
        registerIPv4: nssf-service
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/nssf.pem
          key: cert/nssf.key
      serviceNameList:
        - nnssf-nsselection
        - nnssf-nssaiavailability
      nrfUri: https://nrf-service:8000 # kpt-set: ${nrf-uri}
      nrfCertPem: cert/nrf.pem

      supportedPlmnList:
        - mcc: "001" # kpt-set: ${plmn-mcc}
          mnc: "01"  # kpt-set: ${plmn-mnc}

      supportedNssaiInPlmnList:
        - plmnId:
            mcc: "001" # kpt-set: ${plmn-mcc}
            mnc: "01"  # kpt-set: ${plmn-mnc}
          supportedSnssaiList:
            - sst: 1        # kpt-set: ${sst}
              sd: "010203"  # kpt-set: ${sd}

      nsiList:
        - snssai:
            sst: 1        # kpt-set: ${sst}
            sd: "010203"  # kpt-set: ${sd}
          nsiInformationList:
            - nrfId: https://nrf-service:8000/nnrf-nfm/v1/nf-instances
              nsiId: 1

      amfSetList:
        - amfSetId: 1
          nrfAmfSet: https://nrf-service:8000/nnrf-nfm/v1/nf-instances
          supportedNssaiAvailabilityData:
            - tai:
                plmnId:
                  mcc: "001" # kpt-set: ${plmn-mcc}
                  mnc: "01"  # kpt-set: ${plmn-mnc}
                tac: "000001" # kpt-set: ${tac}
              supportedSnssaiList:
                - sst: 1        # kpt-set: ${sst}
                  sd: "010203"  # kpt-set: ${sd}

      taList:
        - tai:
            plmnId:
              mcc: "001" # kpt-set: ${plmn-mcc}
              mnc: "01"  # kpt-set: ${plmn-mnc}
            tac: "000001" # kpt-set: ${tac}
          accessType: 3GPP_ACCESS
          supportedSnssaiList:
            - sst: 1        # kpt-set: ${sst}
              sd: "010203"  # kpt-set: ${sd}

      locality: areal
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: nssf-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
