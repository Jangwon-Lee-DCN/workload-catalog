apiVersion: v1
kind: Pod
metadata:
  name: ims-scscf
  namespace: ims-lab
  labels:
    app: ims-scscf
    app.kubernetes.io/part-of: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  nodeSelector:
    kubernetes.io/hostname: '@{core-node-name}'
  hostAliases:
    - ip: '@{core-worker-ip}'
      hostnames:
        - '@{ims-domain}'
        - icscf.@{ims-domain}
        - scscf.@{ims-domain}
        - hss.@{ims-domain}
    - ip: '@{pcscf-ip}'
      hostnames:
        - pcscf.@{ims-domain}
  containers:
    - name: ims-scscf
      image: '@{image-kamailio}'
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - /init/start.sh
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '2'
          memory: 2Gi
      volumeMounts:
        - name: config
          mountPath: /config
        - name: init
          mountPath: /init
      env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: ims-db-auth
              key: root-password
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - '@{core-worker-ip}'
    options:
      - name: ndots
        value: '1'
  volumes:
    - name: config
      secret:
        secretName: ims-scscf-config
    - name: init
      secret:
        secretName: ims-scscf-init
  hostNetwork: true
