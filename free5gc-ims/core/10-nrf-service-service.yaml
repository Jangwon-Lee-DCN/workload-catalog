apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: nrf-service
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ports:
    - name: sbi
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: nrf
  sessionAffinity: None
  type: ClusterIP
