apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: ausf
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ausf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ausf
    spec:
      containers:
        - command:
            - ./ausf
            - -c
            - /free5gc/config/ausfcfg.yaml
          image: docker.io/free5gc/ausf@sha256:687ff4daf5da7f4a364a8ec26089811628f27a3a173f0344a16c69aaaa257821
          imagePullPolicy: IfNotPresent
          name: ausf
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/ausfcfg.yaml
              name: config
              subPath: ausfcfg.yaml
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - until nc -zw3 udm-service.free5gc.svc.cluster.local 8000; do echo waiting for udm; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-udm
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: ausf-config
          name: config
