apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: udm
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: udm
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: udm
    spec:
      containers:
        - command:
            - ./udm
            - -c
            - /free5gc/config/udmcfg.yaml
          image: docker.io/free5gc/udm@sha256:2f68df062a50ebbc168b6fde19881999f12d035e15e6a2cb08bef0152157a40f
          imagePullPolicy: IfNotPresent
          name: udm
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/udmcfg.yaml
              name: config
              subPath: udmcfg.yaml
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - until nc -zw3 udr-service.free5gc.svc.cluster.local 8000; do echo waiting for udr; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-udr
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: udm-config
          name: config
