apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: udr
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: udr
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: udr
    spec:
      containers:
        - command:
            - ./udr
            - -c
            - /free5gc/config/udrcfg.yaml
          image: docker.io/free5gc/udr@sha256:c0783bcdcbdc8af4c69050e6ea9b1004d0fbaef79031fd8c015a4fb4bed9d6a1
          imagePullPolicy: IfNotPresent
          name: udr
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /free5gc/config/udrcfg.yaml
              name: config
              subPath: udrcfg.yaml
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - until nc -zw3 nrf-service.free5gc.svc.cluster.local 8000; do echo waiting for nrf; sleep 2; done
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: wait-nrf
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: udr-config
          name: config
