apiVersion: v1
data:
  amfcfg.yaml: |
    info:
      version: 1.0.9
      description: AMF initial local configuration
    configuration:
      amfName: AMF
      ngapIpList:
        - @{amf-n2-ip} # kpt-set: ${amf-n2-ip}
      ngapPort: 38412
      sbi:
        scheme: https
        registerIPv4: amf-service
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/amf.key
          pem: cert/amf.pem
      serviceNameList:
        - namf-comm
        - namf-evts
        - namf-mt
        - namf-loc
        - namf-oam
      servedGuamiList:
        - plmnId:
            mcc: "001" # kpt-set: ${plmn-mcc}
            mnc: "01"  # kpt-set: ${plmn-mnc}
          amfId: cafe00 # kpt-set: ${amf-id}
      supportTaiList:
        - plmnId:
            mcc: "001" # kpt-set: ${plmn-mcc}
            mnc: "01"  # kpt-set: ${plmn-mnc}
          tac: "000001" # kpt-set: ${tac}
      plmnSupportList:
        - plmnId:
            mcc: "001" # kpt-set: ${plmn-mcc}
            mnc: "01"  # kpt-set: ${plmn-mnc}
          snssaiList:
            - sst: 1   # kpt-set: ${sst}
              sd: "010203" # kpt-set: ${sd}
      supportDnnList:
        - internet # kpt-set: ${dnn}
      nrfUri: https://nrf-service:8000
      security:
        integrityOrder:
          - NIA2
          - NIA1
          - NIA0
        cipheringOrder:
          - NEA0
          - NEA2
          - NEA1
      networkName:
        full: free5GC
        short: free5GC
      locality: area1
      t3502Value: 720
      t3512Value: 3600
      non3gppDeregistrationTimerValue: 3240
      t3513:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3522:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3550:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3555:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3560:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3565:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
      t3570:
        enable: true
        expireTime: 6s
        maxRetryTimes: 4
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: amf-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
