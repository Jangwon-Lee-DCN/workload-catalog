apiVersion: v1
data:
  udmcfg.yaml: |
    info:
      version: 1.0.3
      description: UDM initial local configuration
    configuration:
      serviceNameList:
        - nudm-sdm
        - nudm-uecm
        - nudm-ueau
        - nudm-ee
        - nudm-pp
      sbi:
        scheme: https
        registerIPv4: udm-service
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/udm.key
          pem: cert/udm.pem
      nrfUri: https://nrf-service:8000 # kpt-set: ${nrf-service-name}
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: udm-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
