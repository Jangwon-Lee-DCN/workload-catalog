apiVersion: v1
kind: Secret
metadata:
  name: ims-pyhss-config
  namespace: ims-lab
  labels:
    app.kubernetes.io/part-of: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-11'
stringData:
  config.yaml: |
    hss:
      transport: TCP
      bind_ip:
      - @{core-worker-ip}
      bind_port: 3868
      OriginHost: hss.@{ims-domain}
      OriginRealm: @{ims-domain}
      ProductName: pyHSS
      site_name: Test Site
      MCC: '001'
      MNC: '001'
      SLh_enabled: false
      test_sub_imsi: 001021234567890
      client_socket_timeout: 120
      diameter_request_timeout: 3
      active_diameter_peers_timeout: 10
      lock_provisioning: true
      provisioning_key: @{hss-password}
      CancelLocationRequest_Enabled: false
      Insert_Subscriber_Data_Force: false
      Default_iFC: default_ifc.xml
      Default_Sh_UserData: /pyhss/default_sh_user_data.xml
      scscf_pool:
      - sip:scscf.@{ims-domain}:6060
      roaming:
        outbound:
          allow_undefined_networks: true
      sctp:
        rtoMax: 5000
        rtoMin: 500
        rtoInitial: 1000
    api:
      page_size: 200
      enable_insecure_auc: true
    benchmarking:
      enabled: true
      reporting_interval: 3600
    eir:
      imsi_imei_logging: true
      no_match_response: 2
      store_offnet_imsi: false
      simSwapNotification: false
    logging:
      level: INFO
      logfiles:
        hss_logging_file: INSTALL_PREFIX/log/hss.log
        diameter_logging_file: INSTALL_PREFIX/log/diameter.log
        geored_logging_file: INSTALL_PREFIX/log/geored.log
        metric_logging_file: INSTALL_PREFIX/log/metrics.log
      log_to_terminal: true
      sqlalchemy_sql_echo: true
      sqlalchemy_pool_recycle: 15
      sqlalchemy_pool_size: 30
      sqlalchemy_max_overflow: 0
    database:
      db_type: mysql
      server: @{core-worker-ip}
      username: pyhss
      password: @{hss-password}
      database: ims_hss_db
      readCacheEnabled: false
      readCacheInterval: 60
    webhooks:
      enabled: false
      endpoints:
      - http://127.0.0.1:8181
    geored:
      enabled: false
      sync_actions:
      - HSS
      - IMS
      - PCRF
      - EIR
      sync_endpoints:
      - http://hss01.mnc001.mcc001.3gppnetwork.org:8080
      - http://hss02.mnc001.mcc001.3gppnetwork.org:8080
    redis:
      connectionType: tcp
      unixSocketPath: /var/run/redis/redis-server.sock
      host: 127.0.0.1
      port: 6379
    prometheus:
      enabled: false
      port: 18081
      async_subscriber_count: false
    snmp:
      port: 1161
      listen_address: 127.0.0.1
  default_ifc.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!--This is the default iFC template used by PyHSS, variables come from the Jinja2 template passed inside diameter.py where you can additional variables if required -->
    <IMSSubscription>
        <PrivateID>{{ iFC_vars['imsi'] }}@ims.mnc{{ iFC_vars['mnc'] }}.mcc{{ iFC_vars['mcc'] }}.3gppnetwork.org</PrivateID>
        <ServiceProfile>
            <PublicIdentity>
                <Identity>sip:{{ iFC_vars['msisdn'] }}@ims.mnc{{ iFC_vars['mnc'] }}.mcc{{ iFC_vars['mcc'] }}.3gppnetwork.org</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                    <Extension>
                        <AliasIdentityGroupID>1</AliasIdentityGroupID>
                    </Extension>
                </Extension>
            </PublicIdentity>
            <PublicIdentity>
                <Identity>tel:{{ iFC_vars['msisdn'] }}</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                    <Extension>
                        <AliasIdentityGroupID>1</AliasIdentityGroupID>
                    </Extension>
                </Extension>
            </PublicIdentity>
            <PublicIdentity>
                <Identity>sip:{{ iFC_vars['imsi'] }}@ims.mnc{{ iFC_vars['mnc'] }}.mcc{{ iFC_vars['mcc'] }}.3gppnetwork.org</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                </Extension>
            </PublicIdentity>


            <!-- Copy SIP REGISTER towards Application Server -->
            <!--  -->
            <!-- Copy SIP REGISTER towards SMSc -->
            <!--  -->


            <!-- SIP MESSAGE Traffic -->


            <!-- SIP USSD Traffic to USSD-GW-->
            <!--  -->

            <!-- SIP INVITE Traffic from Registered Sub-->
            <!--  -->


            <!-- SIP INVITE Traffic for calls to Unregistered Sub (TERMINATING_UNREGISTERED) -->
            <!--  -->


        </ServiceProfile>
    </IMSSubscription>
  default_sh_user_data.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <!--This is the default iFC template used by PyHSS, variables come from the Jinja2 template passed inside diameter.py where you can additional variables if required -->
    <Sh-Data>
        <IMSPrivateUserIdentity>{{ Sh_template_vars['imsi'] }}@ims.mnc{{ Sh_template_vars['mnc'] }}.mcc{{ Sh_template_vars['mcc'] }}.3gppnetwork.org</IMSPrivateUserIdentity>
        <!-- This provides the Public Identifiers to the Application Server -->
        <PublicIdentifiers>
            <IMSPublicIdentity>sip:{{ Sh_template_vars['msisdn'] }}@ims.mnc{{ Sh_template_vars['mnc'] }}.mcc{{ Sh_template_vars['mcc'] }}.3gppnetwork.org</IMSPublicIdentity>
            <MSISDN>{{ Sh_template_vars['msisdn'] }}</MSISDN>
        </PublicIdentifiers>

        <!-- This optional extension provides the Location of the serving MME for this subscriber and the TAC for the ULA -->
        <Extension>
            <EPSLocationInformation>{% if Sh_template_vars['serving_mme'] is not none %}
                <E-UTRANCellGlobalId></E-UTRANCellGlobalId>
                <TrackingAreaId></TrackingAreaId>
                <MMEName>{{ Sh_template_vars['serving_mme'] }}</MMEName>
                <AgeOfLocationInformation>0</AgeOfLocationInformation>
                <Extension>
                    <VisitedPLMNID></VisitedPLMNID>
                </Extension>{% endif %}
            </EPSLocationInformation>
        </Extension>

        <Sh-IMS-Data>
            <S-CSCFName>{{ Sh_template_vars['scscf'] }}</S-CSCFName>
            <IMSUserState>{{ Sh_template_vars['imsUserState'] }}</IMSUserState>
        </Sh-IMS-Data>

    </Sh-Data>
  start.sh: |
    #!/bin/bash
    set -e
    until mysqladmin -h @{core-worker-ip} -u root ping --silent; do sleep 2; done
    mysql -h @{core-worker-ip} -u root -e "CREATE USER IF NOT EXISTS 'pyhss'@'%' IDENTIFIED WITH mysql_native_password BY '@{hss-password}'; GRANT ALL ON ims_hss_db.* TO 'pyhss'@'%'; CREATE DATABASE IF NOT EXISTS ims_hss_db;"
    cp /config/config.yaml /pyhss/config.yaml
    cp /config/default_ifc.xml /pyhss/default_ifc.xml
    cp /config/default_sh_user_data.xml /pyhss/default_sh_user_data.xml
    redis-server --daemonize yes --bind 127.0.0.1
    cd /pyhss/services
    python3 apiService.py &
    sleep 5
    python3 diameterService.py &
    sleep 5
    exec python3 hssService.py
