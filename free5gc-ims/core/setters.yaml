  ue-1-opc: ffeeddccbbaa99887766554433221100
  ue-2-key: 102132435465768798a9bacbdcedfe0f
  ue-2-opc: 0ffedccba98765432100123456789abc
  mec-key: 11223344556677889900aabbccddeeff
  mec-opc: ffeeddccbbaa00998877665544332211
