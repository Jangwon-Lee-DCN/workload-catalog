apiVersion: v1
kind: Secret
metadata:
  name: ims-scscf-init
  namespace: ims-lab
  labels:
    app.kubernetes.io/part-of: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-11'
stringData:
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    mkdir -p /etc/kamailio_scscf /var/run/kamailio
    for src in /config/*; do
     rel=${src##*/}; rel=${rel//__/\/}; mkdir -p "/etc/kamailio_scscf/$(dirname "$rel")"; cp "$src" "/etc/kamailio_scscf/$rel"
    done
    until mysqladmin -h @{core-worker-ip} -u root ping --silent; do sleep 2; done
    if ! mysql -h @{core-worker-ip} -u root -N -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='scscf'" | grep -q scscf; then
     mysql -h @{core-worker-ip} -u root -e "CREATE DATABASE scscf"
     mysql -h @{core-worker-ip} -u root scscf < /usr/local/src/kamailio/utils/kamctl/mysql/standard-create.sql
    mysql -h @{core-worker-ip} -u root scscf < /usr/local/src/kamailio/utils/kamctl/mysql/presence-create.sql
    mysql -h @{core-worker-ip} -u root scscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_usrloc_scscf-create.sql
    mysql -h @{core-worker-ip} -u root scscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_dialog-create.sql
    mysql -h @{core-worker-ip} -u root scscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_charging-create.sql
    fi
    mysql -h @{core-worker-ip} -u root -e "CREATE USER IF NOT EXISTS 'scscf'@'%' IDENTIFIED WITH mysql_native_password BY '@{kamailio-password}'; GRANT ALL ON scscf.* TO 'scscf'@'%'"

    exec kamailio -f /etc/kamailio_scscf/kamailio_scscf.cfg -P /run/kamailio_scscf.pid -m 64 -M 16 -DD -E -e
