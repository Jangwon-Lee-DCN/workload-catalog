apiVersion: v1
kind: ServiceAccount
metadata:
  name: ims-observer
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-12'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ims-observer-pods
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - amf
      - smf
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ims-observer-pods
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
subjects:
  - kind: ServiceAccount
    name: ims-observer
    namespace: ims-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ims-observer-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ims-observer-pods
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    resourceNames:
      - ims-provision-5gc
      - ims-provision-hss
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ims-observer-pods
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
subjects:
  - kind: ServiceAccount
    name: ims-observer
    namespace: ims-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ims-observer-pods
---
apiVersion: v1
kind: Secret
metadata:
  name: ims-observer-read-token
  namespace: ims-lab
  annotations:
    kubernetes.io/service-account.name: ims-observer
    argocd.argoproj.io/sync-wave: '-11'
type: kubernetes.io/service-account-token
