apiVersion: v1
kind: Service
metadata:
  labels:
    app: webui
    app.kubernetes.io/instance: core
  name: webui-service
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ports:
    - nodePort: 30500
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    app: webui
  sessionAffinity: None
  type: NodePort
