apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: mongodb
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ports:
    - port: 27017
      protocol: TCP
      targetPort: 27017
  selector:
    app: mongodb
  sessionAffinity: None
  type: ClusterIP
  clusterIP: None
