apiVersion: v1
data:
  nrfcfg.yaml: |
    info:
      version: 1.0.2
      description: NRF initial local configuration
    configuration:
      MongoDBName: free5gc
      MongoDBUrl: mongodb://mongodb:27017 # kpt-set: ${mongodb-uri}
      sbi:
        scheme: https
        registerIPv4: nrf-service # kpt-set: ${nrf-service-name}
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/nrf.key
          pem: cert/nrf.pem
      DefaultPlmnId:
        mcc: "001" # kpt-set: ${plmn-mcc}
        mnc: "01"  # kpt-set: ${plmn-mnc}
      serviceNameList:
        - nnrf-nfm
        - nnrf-disc
    logger:
      enable: true
      level: info
      reportCaller: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: core
  name: nrf-config
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
