apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-phone-gateway
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $ssl_server_name $tls_directory { default /tls; }
    set_real_ip_from 10.244.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    allow 127.0.0.0/8;
    allow 10.244.0.0/16;
    allow 172.31.0.0/16;
    @{public-access-rules}
    deny all;
    server {
     listen 8080;
     server_name @{phone-hostname};
     client_max_body_size 10m;
     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection $connection_upgrade;
     proxy_set_header Host $http_host;
     proxy_read_timeout 3600s;
     proxy_buffering off;
     location = / { return 302 /ims/1001/; }
     location /ims/1001/ { proxy_pass http://ims-ue-1-web:8080/; }
     location /ims/1002/ { proxy_pass http://ims-ue-2-web:8080/; }
     location /ims/observe/ { proxy_pass http://ims-observer:8085/; }
    }
    server {
     listen 8443 ssl;
     server_name @{phone-hostname};
     ssl_certificate $tls_directory/tls.crt;
     ssl_certificate_key $tls_directory/tls.key;
     ssl_certificate_cache max=4 inactive=20s valid=5s;
     client_max_body_size 10m;
     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection $connection_upgrade;
     proxy_set_header Host $http_host;
     proxy_read_timeout 3600s;
     proxy_buffering off;
     location = / { return 302 /ims/1001/; }
     location /ims/1001/ { proxy_pass http://ims-ue-1-web:8080/; }
     location /ims/1002/ { proxy_pass http://ims-ue-2-web:8080/; }
     location /ims/observe/ { proxy_pass http://ims-observer:8085/; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-phone-gateway
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ims-phone-gateway
  template:
    metadata:
      annotations:
        voice.studio/hostname: '@{phone-hostname}'
        voice.studio/allowed-sources: '@{public-source-cidrs}'
      labels:
        app: ims-phone-gateway
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
          ports:
            - containerPort: 8443
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: ims-phone-gateway
        - name: tls
          secret:
            secretName: ims-phone-tls
      nodeSelector:
        kubernetes.io/hostname: '@{edge-node-name}'
---
apiVersion: v1
kind: Service
metadata:
  name: ims-phone-gateway
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  type: NodePort
  selector:
    app: ims-phone-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 31443
    - name: http
      port: 8080
      targetPort: 8080
