apiVersion: v1
kind: Pod
metadata:
  name: ims-rtpengine
  namespace: ims-lab
  labels:
    app: ims-rtpengine
    app.kubernetes.io/part-of: ims-lab
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name": "ims-rtpengine-n6", "interface": "n6"}]'
    argocd.argoproj.io/sync-wave: '0'
spec:
  nodeSelector:
    kubernetes.io/hostname: '@{edge-node-name}'
  hostAliases:
    - ip: '@{core-worker-ip}'
      hostnames:
        - '@{ims-domain}'
        - icscf.@{ims-domain}
        - scscf.@{ims-domain}
        - hss.@{ims-domain}
    - ip: '@{pcscf-ip}'
      hostnames:
        - pcscf.@{ims-domain}
  containers:
    - name: ims-rtpengine
      image: '@{image-tools}'
      imagePullPolicy: IfNotPresent
      command:
        - rtpengine
        - --interface=@{rtpengine-ip}
        - --listen-ng=@{rtpengine-ip}:2223
        - --table=-1
        - --port-min=30000
        - --port-max=30199
        - --foreground
        - --log-stderr
        - --log-level=6
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '2'
          memory: 2Gi
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - '@{core-worker-ip}'
    options:
      - name: ndots
        value: '1'
