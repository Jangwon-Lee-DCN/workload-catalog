    </div></section></section><div class="topology-legend"><span>점선: 제어 연결 · 실선: 음성 기능 연결</span><span id="live">연결 중</span></div>
    <section id="mecBackend" class="mec-zone backend" aria-label="MEC 서비스 백엔드"><header class="backend-heading"><h2>MEC 서비스 백엔드</h2><span class="backend-caption">음성 처리 · 요청 시 판별</span></header>
    <div class="backend-grid"><section id="edgeVoice" class="edge-voice" aria-label="Edge 음성 처리 영역"><h2>Edge 음성 처리</h2><p class="placement">같은 Edge Worker</p><div id="rtpNode" class="component backend-node"><i class="node-dot"></i><strong>RTPengine</strong><small>통화 RTP 중계</small></div><div class="fork-link"><span>상대 음성 복제</span><b aria-hidden="true">↓</b></div><div id="mecNode" class="component backend-node"><i class="node-dot"></i><strong>MEC 음성 검사</strong><small>음성 구간 수집</small></div><div class="signal-return"><b aria-hidden="true">↑</b><span>IMS 신호<br/>요청 UE로 결과 전달</span></div></section>
    <div class="backend-bridge" aria-label="MEC와 별도 GPU 클러스터의 판별 요청과 응답"><span>판별 요청</span><b class="request-arrow" aria-hidden="true">→</b><b class="response-arrow" aria-hidden="true">←</b><span>판정 결과</span></div>
    <section id="gpuInfrastructure" class="gpu-zone"><header class="gpu-heading"><div><h1 id="gpuTitle">FaaS 기반 GPU 인프라</h1><p>별도 GPU 클러스터 · Pod 기동·확장·반환</p></div><aside id="activationCard" class="activation-card" hidden aria-label="판별 서비스 준비 시간"><div class="activation-title"><span>서비스 준비</span><small id="activationMode"></small></div><div class="activation-value"><strong id="activationSeconds">준비 중</strong><span id="activationUnit"></span></div><div id="activationResponse"></div><small id="activationGain" hidden></small><small class="activation-basis">판별 요청 → 처리 시작 · 음성 수집 별도</small></aside><div class="gpu-entry"><span id="apiGateway">API Gateway</span><small class="knative-entry">Knative 진입점</small><strong id="faas">확인 중</strong></div></header>
    <div id="stages" class="scale-stages" aria-label="실제 관측한 GPU 판별 인스턴스 확장 단계"><article class="scale-step"><strong>0</strong><span>유휴</span><small>판별 인스턴스 없음</small></article><i aria-hidden="true">→</i><article class="scale-step"><strong>1</strong><span>기동</span><small>1개 Ready</small></article><i aria-hidden="true">→</i><article class="scale-step"><strong>2</strong><span>확장</span><small>2개 Ready</small></article><i aria-hidden="true">→</i><article class="scale-step"><strong>0</strong><span>반환</span><small>실제 0개 복귀</small></article></div>
    <div id="pods" class="pods" aria-label="현재 존재하는 판별 인스턴스"></div><footer><span id="requests">검사 요청 대기</span><span id="memory">GPU —</span></footer></section></div></section></main><script src="delivery.js"></script><script src="app.js"></script></body></html>
