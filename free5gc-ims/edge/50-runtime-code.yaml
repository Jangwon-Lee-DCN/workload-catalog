apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-observer-code
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  app.js: |
    'use strict';
    const $=id=>document.getElementById(id);let current=null;
    function connectMedia(){
     const base=document.querySelector('main').getBoundingClientRect();
     const box=id=>{const r=$(id).getBoundingClientRect();return {l:r.left-base.left,r:r.right-base.left,t:r.top-base.top,b:r.bottom-base.top,x:r.left-base.left+r.width/2,y:r.top-base.top+r.height/2};};
     const amf=box('amfNode'),smf=box('smfNode'),u1=box('ue1Node'),u2=box('ue2Node'),gnb=box('gnbNode'),upf=box('upfNode'),edge=box('edgeVoice'),rtp=box('rtpNode');
     const control=(id,label,from,to,dy)=>{const mid=from.b+dy;$(id).setAttribute('d',`M${from.x} ${from.b}V${mid}H${to.x}V${to.t}`);$(label).setAttribute('x',to.x+7);$(label).setAttribute('y',to.t-8);};
     control('amfControl','n2Label',amf,gnb,12);control('smfControl','n4Label',smf,upf,23);
     const joint=(u1.r+gnb.l)/2;
     $('ueVoice').setAttribute('d',`M${u1.r} ${u1.y}H${joint}V${gnb.y}H${gnb.l}`);$('ueBranch').setAttribute('d',`M${u2.r} ${u2.y}H${joint}V${gnb.y}`);
     $('n3Voice').setAttribute('d',`M${gnb.r} ${gnb.y}H${upf.l}`);$('n3Label').setAttribute('x',(gnb.r+upf.l)/2-8);$('n3Label').setAttribute('y',gnb.y-7);
     $('mecAccessPath').setAttribute('d',`M${upf.x} ${upf.b}V${edge.t-7}H${edge.l-4}V${rtp.y}H${rtp.l}`);$('rtpLabel').setAttribute('x',upf.x+8);$('rtpLabel').setAttribute('y',upf.b+17);window.InspectionFlow?.connect();
    }
    new ResizeObserver(()=>requestAnimationFrame(connectMedia)).observe(document.querySelector('main'));

    function source(s,k){const x=s.sources[k];return x?.ok&&s.time-x.at<8?x.value:null;}
    function render(s){current=s;const c=source(s,'core'),edge=source(s,'edge'),gpu=source(s,'gpu'),g=gpu?.status==='online'&&s.time-gpu.sampled_at<8?gpu:null,m=g?.models?.find(x=>x.name==='sasv-restored'),upf=edge?.filter(x=>x.name.startsWith('upf'));
    function healthy(rows,prefix){const selected=rows?.filter(p=>(Array.isArray(prefix)?prefix:[prefix]).some(x=>(p.name||'').startsWith(x)));return selected?.length?selected.every(p=>p.ready&&!p.terminating):null;}
    function node(id,value){$(id).classList.toggle('ready',value===true);$(id).classList.toggle('degraded',value===false);}
    node('amfNode',healthy(c,'amf'));node('smfNode',healthy(c,'smf'));node('coreServices',healthy(c,['nrf','udm','udr','ausf','nssf','pcf']));node('imsNode',healthy(c,'ims-'));node('gnbNode',healthy(edge,'gnb'));node('upfNode',upf?.length?upf.every(x=>x.ready&&!x.terminating):null);node('mecNode',healthy(edge,'ims-mec'));node('rtpNode',healthy(edge,'ims-rtpengine'));
    for(const n of [1,2])node('ue'+n+'Node',source(s,'ue'+n)?.registered??null);
    $('core').textContent=c?`${c.filter(p=>p.ready&&!p.terminating).length}/${c.length} Ready`:'확인 중';$('upf').textContent=upf?.length?(upf.every(x=>x.ready&&!x.terminating)?'Ready':'준비 중'):'확인 중';$('faas').textContent=m?`Pod ${m.pods} · Ready ${m.ready}`:'확인 중';$('live').textContent=c&&upf?.length&&m?'● 실시간':'연결 확인 중';
    const h=s.history||[],last2=h.findLastIndex(x=>x.ready>=2);const seen=[h.some(x=>x.pods===0),h.some(x=>x.ready>=1),last2>=0,last2>=0&&h.slice(last2+1).some(x=>x.pods===0)],active=!m?-1:m.pods===0?(seen[3]?3:0):m.ready>=2?2:m.ready>=1?1:-1;[...$('stages').querySelectorAll('.scale-step')].forEach((e,i)=>{e.classList.toggle('seen',seen[i]);e.classList.toggle('active',i===active);if(i===active)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current');});
    const pods=m?.details||[];if(!m||!pods.length){const e=document.createElement('div');e.className='empty';const number=document.createElement('strong'),message=document.createElement('span');number.textContent=m?'0':'—';message.textContent=m?'현재 판별 Pod 없음 · 요청 시 기동':'Pod 상태 확인 중';e.append(number,message);$('pods').replaceChildren(e);}else $('pods').replaceChildren(...pods.map((p,i)=>{const d=document.createElement('article');const ready=(typeof p.ready==='boolean'?p.ready:p.phase==='Running'&&m.ready===pods.length)&&!p.terminating;d.className='pod'+(ready?' ready':'');const title=document.createElement('strong');title.textContent='Fake Voice Detection';const status=document.createElement('span');status.className='pod-status';status.textContent=p.terminating?'종료 중':ready?'Ready':p.phase||'준비 중';const name=document.createElement('code');name.textContent=p.name;name.title=p.name;d.append(title,status,name);return d;}));
    const x=source(s,'mec')?.parallel_copy;$('requests').textContent=x?`병렬 복제 처리 ${x.inflight}건 · 완료 ${x.completed}건${x.failed?' · 실패 '+x.failed+'건':''}`:'검사 요청 대기';$('memory').textContent=g?`GPU ${(g.memory_used/1024).toFixed(1)} / ${(g.memory_total/1024).toFixed(1)} GiB`:'GPU 확인 중';window.InspectionFlow?.render(s);}
    async function poll(){try{const r=await fetch('api/state',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!r.ok||!r.headers.get('content-type')?.includes('application/json'))throw Error('관측 응답 오류');render(await r.json());requestAnimationFrame(connectMedia);}catch(e){$('live').textContent='연결 확인 중';}setTimeout(poll,500);}poll();
  delivery.js: |
    /* Request-correlated observation only; never sends telephony or inference commands. */
    (()=>{
     'use strict';
     const el=id=>document.getElementById(id),TTL=15,firstTimings=new Map();
     let selected=null,lastKey='',timers=[],motionUntil=0,receiver=null,frame=null;
     function source(s,k){const v=s.sources[k];return v?.ok&&s.time-v.at<8?v.value:null;}
     function show(id,visible){el(id).toggleAttribute('hidden',!visible);}
     function clearMotion(){if(frame!==null)clearTimeout(frame);frame=null;timers.forEach(clearTimeout);timers=[];show('resultOverlay',false);show('resultRoute',false);document.querySelectorAll('.message-focus').forEach(e=>e.classList.remove('message-focus'));motionUntil=0;}
     function connect(){
      if(!receiver)return;
      const main=document.querySelector('main').getBoundingClientRect(),box=id=>{const r=el(id).getBoundingClientRect();return {l:r.left-main.left,r:r.right-main.left,t:r.top-main.top,b:r.bottom-main.top,x:r.left-main.left+r.width/2,y:r.top-main.top+r.height/2};};
      const gpu=box('gpuInfrastructure'),mec=box('mecNode'),ims=box('imsNode'),upf=box('upfNode'),gnb=box('gnbNode'),ue=box(receiver),core=document.querySelector('.core-zone').getBoundingClientRect();
      const left=16,right=main.width-16,gap=core.bottom-main.top+16,joint=(ue.r+gnb.l)/2;
      const path=`M${gpu.l} ${mec.y}H${mec.r}H${mec.l}H${left}V${gap}H${right}V${ims.y}H${ims.r}H${ims.x}V${gap+10}H${upf.x+18}V${upf.t}V${upf.y+13}H${gnb.r}H${gnb.l}H${joint}V${ue.y}H${ue.r}`;
      el('resultRoute').setAttribute('d',path);el('packetRoute').setAttribute('d',path);
     }
     function animate(key,target){
      clearMotion();receiver=target;lastKey=key;connect();motionUntil=performance.now()+6000;show('resultOverlay',true);show('resultRoute',true);
      const nodes=['gpuInfrastructure','mecNode','imsNode',receiver];
      const stage=(index,text)=>{document.querySelectorAll('.message-focus').forEach(e=>e.classList.remove('message-focus'));el(nodes[index]).classList.add('message-focus');el('deliveryStatus').textContent=text;};
      stage(0,'수신된 결과 흐름 · GPU 판정');
      const start=performance.now();
      const move=()=>{const progress=Math.min(1,(performance.now()-start)/6000),path=el('packetRoute'),point=path.getPointAtLength(path.getTotalLength()*progress);el('signalPacket').setAttribute('transform',`translate(${point.x} ${point.y})`);if(progress<1)frame=setTimeout(move,40);else frame=null;};move();
      timers.push(setTimeout(()=>stage(1,'수신된 결과 흐름 · MEC 접수'),1000),setTimeout(()=>stage(2,'수신된 결과 흐름 · IMS 결과 신호'),3000),setTimeout(()=>stage(3,`UE ${selected.u.ue} · 결과 수신 확인`),5000),setTimeout(()=>{show('resultOverlay',false);show('resultRoute',false);},6000));
     }
     function render(s){
      const candidates=[];
      for(const n of [1,2]){
       const u=source(s,'ue'+n),i=u?.inspection,c=u?.call;if(!i)continue;
       if(c&&(!c.incoming||c.id!==i.call_id))continue;
       const latest=i.results?.filter(r=>r.display_suppressed!==true&&r.window!==1).at(-1),received=u.result_received_at,age=(Number.isFinite(u.sampled_at)?u.sampled_at:s.time)-received+Math.max(0,s.time-s.sources['ue'+n].at);
       const fresh=!!latest&&['Real','Fake'].includes(latest.prediction)&&latest.request_id===i.request_id&&Number.isFinite(received)&&age>=-1&&age<TTL;
       const active=!!c?.incoming&&c.id===i.call_id&&!['ended','stopped'].includes(i.phase);
       if(active||fresh)candidates.push({u,i,latest,received,fresh,active,n,observedReceived:s.time-age});
      }
      candidates.sort((a,b)=>(b.active-a.active)||((b.observedReceived||b.i.updated||0)-(a.observedReceived||a.i.updated||0)));selected=candidates[0]||null;
      el('activationCard').hidden=!selected;el('verdictCard').hidden=!selected?.fresh;
      if(!selected){clearMotion();return;}
      const {u,i,latest,fresh,n}=selected,sessionKey=u.ue+':'+i.request_id,observedFirst=(i.results||[]).find(r=>r.verification_index===1||r.window===1);
      if(observedFirst&&!firstTimings.has(sessionKey)){firstTimings.set(sessionKey,{timing:observedFirst.timing,seconds:observedFirst.seconds});if(firstTimings.size>32)firstTimings.delete(firstTimings.keys().next().value);}
      const first=firstTimings.get(sessionKey),t=first?.timing;
      const ready=t?.ready_seconds,response=t?.response_seconds??first?.seconds;
      el('activationSeconds').textContent=Number.isFinite(ready)&&ready>=0?ready<.01?'< 0.01':ready.toFixed(2):'준비 중';el('activationUnit').textContent=Number.isFinite(ready)&&ready>=0?'초':'';
      el('activationMode').textContent=t?.activation==='new'?'요청 시 기동':t?.activation==='existing'?'서비스 재사용':'';
      el('activationResponse').textContent=Number.isFinite(response)?`첫 응답 ${response.toFixed(2)}초`:i.phase==='classifying'?'서비스 준비·판정 중':'음성 수집 중';
      const gain=el('activationGain');gain.hidden=!(t?.activation==='new'&&Number.isFinite(response)&&response>0&&response<48);gain.textContent=gain.hidden?'':`과거 약 48초 → ${response.toFixed(2)}초 · 약 ${Math.round((1-response/48)*100)}% 단축`;
      if(!fresh){clearMotion();return;}
      el('verdictCard').dataset.verdict=latest.prediction;el('verdictText').textContent=latest.prediction==='Fake'?'가짜 음성이 의심됩니다':'사람 음성으로 판정되었습니다';el('verdictReceiver').textContent=`UE ${u.ue} · ${latest.window}번째`;
      const scores=el('verdictScores');scores.replaceChildren();
      for(const [k,label] of [['spoof','AI'],['bonafide','사람'],['confidence','confidence']])if(Number.isFinite(latest.scores?.[k])){const span=document.createElement('span');span.textContent=`${label} ${latest.scores[k].toFixed(4)}`;scores.append(span);}
      if(!scores.childElementCount)scores.textContent='상세 점수 없음';
      const key=`${u.ue}:${i.request_id}:${latest.window}`;
      if(key!==lastKey)animate(key,'ue'+n+'Node');else if(performance.now()>=motionUntil)el('deliveryStatus').textContent=`UE ${u.ue} · 결과 수신 확인`;
     }
     window.InspectionFlow={render,connect};
    })();
  index.html: |-
    <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232765a7'/%3E%3C/svg%3E"><title>실시간 인프라</title><link rel="stylesheet" href="style.css"></head><body><main><svg id="mediaConnector" aria-hidden="true"><defs><marker id="backendArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#668cb2"/></marker><marker id="controlArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#98a8bc"/></marker></defs><path id="resultRoute" class="result-route" hidden/><path id="amfControl" class="control"/><text id="n2Label" class="link-label">N2</text><path id="smfControl" class="control"/><text id="n4Label" class="link-label">N4</text><path id="ueVoice" class="voice-path"/><path id="ueBranch" class="voice-branch"/><path id="n3Voice" class="voice-path"/><text id="n3Label" class="link-label">N3</text><path id="mecAccessPath"/><text id="rtpLabel" class="link-label">통화 RTP</text></svg><svg id="resultOverlay" aria-hidden="true" hidden><path id="packetRoute" fill="none" stroke="none"/><g id="signalPacket"><rect x="-12" y="-9" width="24" height="18" rx="5"/><path d="m-8 -5 8 6 8-6 M-8 5l5-4 M8 5  -5 1"/></g></svg><section id="topology" aria-label="Mobile Core와 Edge의 실제 구성과 연결">
    <section class="network-zone core-zone"><header><h2>Mobile Core / IMS</h2><span id="core">확인 중</span></header><div class="core-nodes">
