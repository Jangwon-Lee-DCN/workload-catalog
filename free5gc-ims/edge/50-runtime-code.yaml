apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-generation-code
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  gateway.py: |
    """UE-local synthesis adapter. API credential never reaches UE/browser responses."""
    from hf_public import synthesize as public_synthesize
    from gpu_local import synthesize as gpu_synthesize,prepare as gpu_prepare
    from transport import opener,source_address
    import audioop,base64,hashlib,hmac,http.server,io,json,os,pathlib,threading,time,urllib.request,urllib.error,uuid,wave
    PROVIDER=os.environ.get('GENERATION_PROVIDER','gpu_local')
    if PROVIDER not in ('elevenlabs','hf_public','gpu_local'):raise ValueError('unsupported GENERATION_PROVIDER')
    KEY=pathlib.Path(os.environ.get('ELEVEN_API_KEY_FILE','/secrets/api-key')).read_text().strip() if PROVIDER=='elevenlabs' else ''
    TOKEN=pathlib.Path(os.environ.get('GENERATION_AUTH_FILE','/secrets/auth-token')).read_text().strip();LOCK=threading.Lock()
    MODEL=os.environ.get('ELEVEN_MODEL','eleven_multilingual_v2') if PROVIDER=='elevenlabs' else ('qwen3-tts-base-1.7b' if PROVIDER=='gpu_local' else 'chatterbox-multilingual-v3')
    VOICE_SETTINGS={'stability':1.0,'similarity_boost':1.0}
    if MODEL=='eleven_multilingual_v2':VOICE_SETTINGS.update(speed=.93,style=0,use_speaker_boost=True)
    AUDIO_EFFECTS={'background_noise_id':'call_center','environment_id':'small_room','send_level':0.12,'distance':0.15}
    OUTPUT_FORMAT='wav_24000'
    OUTBOUND=opener()
    def api(path,data=None,content_type='application/json',method=None):
     req=urllib.request.Request('https://api.elevenlabs.io'+path,data=data,headers={'xi-api-key':KEY,'Content-Type':content_type},method=method)
     try:
