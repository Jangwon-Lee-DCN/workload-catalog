       files={'/':('index.html','text/html; charset=utf-8'),'/app.js':('app.js','application/javascript'),'/style.css':('style.css','text/css'),'/call-protection.js':('call-protection.js','application/javascript'),'/call-protection.css':('call-protection.css','text/css'),'/audio-worklet.js':('audio-worklet.js','application/javascript'),'/audio-playback.js':('audio-playback.js','application/javascript'),'/favicon.ico':None}
       if path=='/favicon.ico':return self.output(204,b'')
