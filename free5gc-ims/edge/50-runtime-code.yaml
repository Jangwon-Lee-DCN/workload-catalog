    """Stream the outgoing microphone to its own persistent library asset."""
    import audioop,json,pathlib,queue,threading,time,uuid,wave

    class FullRecording:
     def __init__(self,root,call_id):
      self.root=pathlib.Path(root);self.id=uuid.uuid4().hex;self.call_id=call_id
      self.folder=self.root/('.recording-'+self.id);self.folder.mkdir(mode=0o700)
      self.queue=queue.Queue(maxsize=250);self.rate_state=None;self.finished=False
      self.status={'id':self.id,'state':'recording','seconds':0.,'rate':24000,'error':None,'closed':False}
      self.frames=0;self.started=time.time();self.thread=threading.Thread(target=self._run,daemon=True);self.thread.start()
     def feed(self,telephone,wideband=None,muted=False):
      if self.finished or self.status['state']=='failed':return
      if wideband is None:
       wideband,self.rate_state=audioop.ratecv(telephone,2,1,8000,24000,self.rate_state)
       wideband=wideband.ljust(len(telephone)*3,b'\0')[:len(telephone)*3]
      if muted:wideband=bytes(len(wideband))
      try:self.queue.put_nowait(wideband)
      except queue.Full:
       self.status.update(state='failed',error='전체 녹음 저장이 지연되었습니다.');return
      self.frames+=len(wideband)//2;self.status['seconds']=round(self.frames/24000,2)
     def close(self):
      if self.finished:return
      self.finished=True
      if self.status['state']!='failed':self.status['state']='saving'
      # End of call only; microphone/RTP processing never waits for the disk writer.
      if self.thread.is_alive():
       try:self.queue.put(None,timeout=3)
       except queue.Full:self.status.update(state='failed',error='전체 녹음 저장을 마치지 못했습니다.');return
       self.thread.join(timeout=3)
     def _run(self):
      target=self.folder/'microphone.wav'
      try:
       with wave.open(str(target),'wb') as w:
        target.chmod(0o600);w.setparams((1,2,24000,0,'NONE',''))
        while True:
         data=self.queue.get()
         if data is None:break
         w.writeframesraw(data)
       if self.status['state']=='failed':return
       if not self.frames:self.status['state']='empty';return
       target.rename(self.folder/'generated.wav')
       meta={'id':self.id,'call_id':self.call_id,'state':'ready','origin':'microphone_recording','purpose':'call','source_name':'내 목소리 전체 녹음.wav','text':'내 목소리 전체 녹음','audio_seconds':self.frames/24000,'completed':time.time(),'started':self.started,'rate':24000}
