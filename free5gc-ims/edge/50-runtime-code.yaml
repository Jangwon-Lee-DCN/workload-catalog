    """Bind HTTPS sockets to the UE tunnel; never fall back to the Pod address."""
    import fcntl,http.client,json,os,socket,struct,urllib.request

    def source_address():
     interface=os.environ.get('GENERATION_EGRESS_INTERFACE','')
     if not interface:return None
     if interface!='uesimtun0':raise ValueError('unsupported generation egress interface')
     with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as s:
      address=fcntl.ioctl(s.fileno(),0x8915,struct.pack('256s',interface.encode()[:15]))
     return (socket.inet_ntoa(address[20:24]),0)

    class UEHTTPSConnection(http.client.HTTPSConnection):
     def __init__(self,*args,**kwargs):
      kwargs['source_address']=source_address()
      super().__init__(*args,**kwargs)
     def connect(self):
      super().connect()
      if os.environ.get('GENERATION_EGRESS_INTERFACE'):
       print(json.dumps({'event':'generation_https_connected','interface':'uesimtun0','source':self.sock.getsockname()[0],'destination':self.sock.getpeername()[0]}),flush=True)

    class UEHTTPSHandler(urllib.request.HTTPSHandler):
     def https_open(self,req):
      return self.do_open(UEHTTPSConnection,req,context=self._context)

    def opener(*handlers):
     # Explicitly disable environment proxy routes; TLS certificate checks remain enabled.
     return urllib.request.build_opener(urllib.request.ProxyHandler({}),UEHTTPSHandler(),*handlers)
