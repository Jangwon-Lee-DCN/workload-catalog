    $('newClipStatus').hidden=!(current&&j.state==='ready');$('newClipStatus').textContent=current&&j.state==='ready'?`이번 통화에서 생성 완료 · ${new Date(j.completed*1000).toLocaleTimeString('ko-KR')} · ${j.audio_seconds}초`:'';
    $('clip').disabled=!clips.length;$('previewClip').disabled=!$('clip').value;$('sendClip').disabled=busy||!outgoing||!$('clip').value;$('stopPlayback').disabled=busy||!s.playback;
    const inspection=s.inspection&&(!c||s.inspection.call_id===c.id)?s.inspection:null,activeInspection=inspection&&inspection.call_id===c?.id&&!['stopped','ended'].includes(inspection.phase);
    $('inspectionToggleRow').hidden=!INSPECTION_ENABLED||viewRole!=='receiver';
    $('inspectionToggle').disabled=busy||!!owner?.busy()||!INSPECTION_ENABLED||!connected||!c?.incoming||inspection?.phase==='stopping';
    $('inspectionToggle').setAttribute('aria-checked',String(!!activeInspection));$('inspectionToggle').textContent=inspection?.phase==='stopping'?'종료 중':activeInspection?'ON':'OFF';
    $('inspectionToggle').classList.toggle('enabled',!!activeInspection);
    $('inspectHint').textContent=activeInspection?'상대방의 목소리를 확인하고 있습니다.':connected&&c.incoming?'상대방의 목소리를 확인할 수 있습니다.':'전화를 받은 뒤 사용할 수 있습니다.';
