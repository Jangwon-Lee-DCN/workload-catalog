    """Request-correlated timings; no inferred readiness or cross-clock subtraction."""
    import datetime,math

    def request_timing(metrics,rid,pod,response_seconds):
     if not isinstance(response_seconds,(int,float)) or not math.isfinite(response_seconds) or not 0<=response_seconds<=180:return None
     result={'response_seconds':round(response_seconds,3),'activation':'unknown'}
     traces=[r for r in metrics.get('requests',[]) if r.get('id')==rid and r.get('owner')=='ims-mec']
     if len(traces)!=1:return result
     trace=traces[0];marks=trace.get('marks',[])
     def when(phase):
      values=[m.get('at') for m in marks if m.get('phase')==phase and (phase!='model_started' or m.get('pod')==pod)]
      return min(values) if values and all(type(v) in (int,float) and math.isfinite(v) for v in values) else None
     requested=when('model_requested');started=when('model_started')
     if requested is not None and started is not None and 0<=started-requested<=response_seconds+.05:
      result['ready_seconds']=round(started-requested,3)
      result['basis']='request_to_model_started'
     for model in metrics.get('models',[]):
      if model.get('name')!='sasv-restored':continue
      for detail in model.get('details',[]):
       if detail.get('name')!=pod or requested is None:continue
       try:created=datetime.datetime.fromisoformat(detail['created'].replace('Z','+00:00')).timestamp()
       except (ValueError,KeyError,TypeError):continue
       result['activation']='new' if created>=requested-1 else 'existing'
     return result
