  index.html: |
    <!doctype html>
    <html lang="ko" data-call-protection="on"><head><meta charset="utf-8"><meta name="audio-revision" content="__AUDIO_REVISION__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6G Vision Festa 2026</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232765a7'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="call-protection.css"></head>
    <body><header><div class="brand">6G Vision Festa 2026</div><span id="connection" class="badge">연결 중</span></header>
    <main><section class="intro"><h1>전화 시뮬레이터</h1><button id="openPhoneWindow" type="button">전화기만 열기 ↗</button></section>
    <div class="layout"><section class="phone-area"><div class="phone"><div class="island"></div><div id="screen" class="screen">
    <div class="handset-heading"><span id="localLabel">내 전화</span><span id="reg" class="badge">준비 중</span></div>
    <h2 id="callHeading" class="handset-title">전화 기능</h2>
    <dl class="identity"><div><dt>내 번호</dt><dd id="me">—</dd></div><div><dt>상대 번호</dt><dd id="peer">—</dd></div></dl>
    <div class="call-display"><span id="phoneState" class="phone-state"></span><h2 id="phonePeer"></h2><p id="phoneDetail"></p><strong id="timer"></strong></div>
    <div id="phishingAlert" class="phishing-alert" role="alert" aria-live="assertive" aria-atomic="true" hidden><strong>가짜 음성으로 의심됩니다</strong><p>상대방의 목소리가 AI 음성으로 의심됩니다.</p><small id="alertScores" hidden></small><button id="dismissPhishingAlert" aria-label="가짜 음성 의심 알림 닫기">확인</button></div>
    <div class="handset-actions"><div id="dialOptions" class="dial-options"><label for="callMode">통화 방법</label><select id="callMode"><option value="live">직접 말하기</option><option value="recording">녹음 음성으로 전화</option></select><div class="option-row"><label for="dialTransform">음성 변조</label><button id="dialTransform" type="button" role="switch" aria-checked="false">OFF</button></div></div><div class="actions"><button id="prepare">마이크·스피커 준비</button><span id="audioState">마이크 사용을 허용해 주세요.</span></div>
    <div class="button-grid"><button id="call" class="primary" disabled>전화걸기</button><button id="answer" class="green" disabled>전화 수신</button><button id="reject" disabled>거절 / 발신 취소</button><button id="hangup" class="danger" disabled>통화 종료</button></div>
    <div id="inspectionToggleRow" class="inspection-toggle-row" hidden><label for="inspectionToggle">피싱 의심 검사</label><button id="inspectionToggle" type="button" role="switch" aria-checked="false" disabled>OFF</button><span id="inspectHint" class="inspection-toggle-hint" role="status"></span></div>
    <div class="microphone-controls"><button id="mute" aria-pressed="false" disabled>마이크 음소거</button><span id="muteStatus">통화 중 사용할 수 있습니다.</span></div>
    <div id="status" class="status" role="status">연결 확인 중</div><div id="error" role="alert" hidden></div></div>
    </div><div class="home-line"></div></div></section>
    <div class="controls">
    <section id="idlePanel" class="card idle-panel"><h2 id="setupTitle">통화를 시작해 보세요</h2><p id="setupHint">전화를 걸면 목소리 만들기, 전화를 받으면 음성 판별 기능이 나타납니다.</p><div id="recordingOptions" class="recording-options" hidden><label class="field-label" for="callAudio">통화에 사용할 녹음</label><select id="callAudio"><option value="">보관소에서 선택해 주세요.</option></select><label class="field-label" for="callFile">파일에서 선택</label><input id="callFile" type="file" accept="audio/*"><p id="callFileStatus" class="upload-status" role="status">WAV·MP3·M4A, 3분 이내</p><label class="repeat-option"><input id="callRepeat" type="checkbox">반복 재생</label><fieldset class="file-call-options"><legend>발신 옵션</legend><div class="option-row"><label for="dialClone">파일 목소리 복제</label><button id="dialClone" type="button" role="switch" aria-checked="false" aria-describedby="dialCloneHint">OFF</button></div><p id="dialCloneHint" class="script-note">상대가 전화를 받으면 선택한 옵션으로 시작합니다.</p></fieldset><button id="previewCallAudio" disabled>미리 듣기</button><audio id="callPreview" controls hidden preload="none"></audio></div></section>
    <section class="card scenario" id="scenarioPanel" hidden>
    <div class="card-heading"><h2>목소리 만들기</h2></div><p id="fullRecordingStatus" class="scenario-footnote" role="status" hidden></p>
    <div class="scenario-top-controls"><div class="option-row transform-row"><div><label for="transform">음성 변조</label></div><button id="transform" role="switch" aria-checked="false" disabled>OFF</button></div><p id="transformDetail" class="scenario-footnote">원래 목소리</p><button id="sampleStart" class="primary" disabled>녹음 시작</button><p id="sampleStartHint" class="script-note">녹음을 시작하고 아래 대사를 읽어 주세요.</p></div>
    <div class="scenario-content"><div class="script-card"><div class="script-heading"><span class="step-number">1</span><strong id="callScriptHeading">통화 대사</strong></div><div id="recordingPlayback" class="recording-playback" hidden><p id="callAudioName" class="call-audio-name"></p><div class="call-audio-overview"><span id="callAudioProgress" role="status"></span><span id="callAudioRepeat" class="badge" hidden>반복 재생</span></div><div class="call-audio-timeline"><span><strong id="callAudioElapsed">00:00.0</strong> 재생</span><span>전체 <strong id="callAudioDuration">00:00.0</strong></span></div><progress id="callAudioMeter" max="1" value="0" aria-label="통화 녹음 재생 진행"></progress><div class="call-audio-footer"><span id="callAudioPercent">0%</span><span id="callAudioRemaining"></span></div><div class="button-grid"><button id="replayCallAudio" disabled>다시 재생</button><button id="stopCallAudio" disabled>녹음 중단</button></div></div><blockquote id="roleplayScript" tabindex="0">안녕하세요. 홍길동 어머님 되시죠? 지금 길동이와 함께 있어서 연락드렸습니다. 제 목소리 잘 들리시나요? 제가 먼저 말씀드릴 테니 잠깐만 들어 주세요. 곧 길동이 목소리를 직접 들려드리겠습니다. 지금은 전화기를 바꾸고 있어서 조금 기다려 주셔야 합니다. 주변에서 다른 소리가 들리더라도 제 말에 집중해 주세요. 가족분 목소리인지 직접 확인하시면 됩니다. 이제 길동이에게 전화를 바꿔주겠습니다. 목소리를 듣고 직접 확인해 보세요.</blockquote></div>
    <div class="generation-column"><div class="sampling-card"><div class="script-heading"><span class="step-number">2</span><strong>내 목소리로 음성 만들기</strong></div>
    <p id="generationSourceHint">20초 동안 녹음한 목소리로 새 음성을 만듭니다. 음소거 중에는 녹음이 멈춥니다.</p>
    <div class="auto-trigger">녹음 후 자동 생성</div><div id="scenarioCallState" class="scenario-call-state" role="status">통화 연결 대기 중</div><p id="generationTiming" class="script-note"></p>
    <ol class="generation-flow" aria-label="음성 만들기 순서"><li><b>목소리 녹음</b><span>20초 녹음</span></li><li><b>녹음 저장</b></li><li><b>음성 생성</b></li></ol>
    <label class="field-label" for="script">만들어질 음성의 대사</label><textarea id="script" rows="3" readonly>안녕하세요. 이 음성은 통화에서 추출한 목소리를 바탕으로 AI가 만든 가짜 음성입니다. 지금 음성 판별 기능을 확인하고 있습니다.</textarea></div>
    <div class="result-card"><div class="script-heading"><span class="step-number">3</span><strong>음성 보내기</strong></div>
    <label class="field-label" for="clipFile">파일을 바로 업로드</label><input id="clipFile" type="file" accept="audio/*"><p id="clipUploadStatus" class="upload-status" role="status">만든 음성 파일을 선택해 바로 보낼 수 있습니다.</p><label class="field-label" for="clip">보낼 음성</label><p id="newClipStatus" class="new-clip-status" hidden></p><select id="clip" disabled><option>아직 생성된 음성이 없습니다.</option></select><div class="button-grid"><button id="previewClip" disabled>미리 듣기</button><button id="sendClip" disabled>선택 음성 보내기</button></div><audio id="previewAudio" controls hidden preload="none"></audio><button id="stopPlayback" class="stop-playback" disabled>음성 보내기 중단</button><div id="clipPlayback" class="clip-playback" hidden aria-live="polite"><div class="clip-playback-heading"><strong id="clipPlaybackState"></strong><span id="clipPlaybackPercent"></span></div><p id="clipPlaybackName"></p><div class="clip-playback-time"><span><b id="clipPlaybackElapsed">00:00.0</b> / <span id="clipPlaybackTotal">00:00.0</span></span><span id="clipPlaybackRemaining"></span></div><progress id="clipPlaybackMeter" max="1" value="0" aria-label="선택 음성 전송 진행"></progress><p class="clip-playback-note">통화 경로로 보낸 음성의 진행 상황입니다.</p></div></div>
    </div></div></section>
    <section id="inspectionPanel" class="card inspection-panel" aria-label="음성 검사" hidden><div id="inspectionPhase" hidden></div><div id="inspectionResults" hidden></div></section>
    <details id="libraryPanel" class="card audio-library"><summary>음성 보관소 <span id="libraryCount" class="badge">0개</span></summary><audio id="libraryPlayer" controls hidden preload="none"></audio><div id="audioLibrary" class="library-list"></div></details>
    </div></div></main><dialog id="audioCleanupDialog" aria-labelledby="audioCleanupTitle"><h2 id="audioCleanupTitle">통화 음성을 삭제할까요?</h2><p>이번 통화에 사용한 아래 음성을 보관소에서 삭제합니다.</p><ul id="audioCleanupFiles"></ul><p id="audioCleanupWorking" hidden>만들고 있는 음성도 함께 취소합니다.</p><p id="audioCleanupError" role="alert" hidden></p><div class="cleanup-actions"><button id="audioCleanupKeep" autofocus>아니오, 보관</button><button id="audioCleanupDelete" class="danger">예, 삭제</button></div></dialog><script src="call-protection.js"></script><script src="app.js?rev=__AUDIO_REVISION__"></script></body></html>
