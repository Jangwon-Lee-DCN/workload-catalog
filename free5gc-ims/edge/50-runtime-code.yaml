           else:
            from audio_files import CallAudio
            pcm,name=self.generation.load_audio(c['recorded_audio_id']);self.primary_audio=CallAudio(cid,c['recorded_audio_id'],pcm,name,c['recording_repeat'])
          elif action in ['play','stop_playback']:
           c=self.calls.get(cid)
           if not c or c.get('ended') or not c.get('connected') or c.get('incoming'):raise ValueError('발신 통화 연결 후 사용할 수 있습니다')
           if action=='stop_playback':
            if self.playback:self.playback['state']='stopped'
            self.playback=None
           else:
            data,name=self.generation.load_audio(cmd['audio_id'])
            if cmd['audio_id'] not in c.setdefault('audio_ids',[]):c['audio_ids'].append(cmd['audio_id'])
            if self.playback:self.playback['state']='replaced'
            self.playback={'id':cmd['audio_id'],'name':name,'call_id':cid,'pcm':data,'cursor':0,'sent_cursor':0,'state':'playing'};self.last_playback=self.playback;self.event('playback_started',call_id=cid,audio_id=cmd['audio_id'])
          elif action in ['answer','reject','hangup','cancel']:getattr(self,action)(cid)
          else:raise ValueError('지원하지 않는 명령')
          self.save();result.put({'ok':True})
         except Exception as e:result.put({'ok':False,'error':str(e)})
        now=time.time()
        for c in list(self.calls.values()):
         if not c.get('ended') and c.get('status') in ['dialing','ringback'] and now-c.get('started',now)>60:
          self.cancel(c['id'])
        for key,p in list(self.pending.items()):
         if p.get('provisional'):continue
         if now-p['sent']>min(4,.5*2**p['tries']):
          if p['tries']>=7:
           self.pending.pop(key,None);self.event('transaction_timeout',method=key[1],call_id=key[0])
           if key[1] in ['INVITE','BYE'] and key[0] in self.calls:self.calls[key[0]]['ended']=True
           continue
          self.sip.sendto(p['raw'],self.proxy);p['sent']=now;p['tries']+=1
        for _ in range(len(self.message_outbox)):
         m=self.message_outbox.popleft()
         if any(key[1]=='MESSAGE' for key in self.pending):self.message_outbox.append(m)
         else:self.send(**m)
        if self.registered and now-self.last_keepalive>15:
         self.send('OPTIONS','sip:pcscf.'+self.domain+':5060',routes=[]);self.last_keepalive=now
        if now-self.last_register>300:self.register()
       except Exception as e:self.event('client_error',error=str(e));time.sleep(.2)

    if __name__=='__main__':
     a=argparse.ArgumentParser();a.add_argument('--config',required=True);args=a.parse_args();Client(json.load(open(args.config))).run()
