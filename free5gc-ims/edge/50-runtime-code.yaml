      status.textContent='업로드 중';const r=await fetch('api/audio/upload',{method:'POST',headers:{'Content-Type':'audio/wav','X-Audio-Name':encodeURIComponent(file.name),'X-Audio-Purpose':purpose},body:buffer});if(!r.headers.get('content-type')?.includes('application/json'))throw Error('업로드 응답을 확인할 수 없습니다.');const out=await r.json();if(!r.ok||!out.ok)throw Error(out.error||'업로드에 실패했습니다.');
      const stateResponse=await fetch('api/state',{cache:'no-store'});if(!stateResponse.ok||!stateResponse.headers.get('content-type')?.includes('application/json'))throw Error('목록을 갱신할 수 없습니다.');render(await stateResponse.json());
