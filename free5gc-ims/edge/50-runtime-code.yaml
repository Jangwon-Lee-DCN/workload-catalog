    """Bounded PCM WAV import and independent prerecorded-call playback."""
    import audioop,io,math,wave
    from telephony_resample import to_telephone

    MAX_SECONDS=180
    MAX_UPLOAD_BYTES=44+48000*MAX_SECONDS+4096

    def uploaded_pcm(data):
     if not isinstance(data,bytes) or not 44<=len(data)<=MAX_UPLOAD_BYTES:raise ValueError('3분 이내의 음성 파일을 선택해 주세요.')
     try:
      with wave.open(io.BytesIO(data)) as f:
       rate=f.getframerate()
       if f.getnchannels()!=1 or f.getsampwidth()!=2 or rate not in (8000,24000) or f.getcomptype()!='NONE':raise ValueError('음성 파일을 다시 선택해 주세요.')
       frames=f.getnframes();pcm=f.readframes(frames)
       if not rate*.2<=frames<=rate*MAX_SECONDS or len(pcm)!=frames*2:raise ValueError('음성 길이를 확인해 주세요. 최대 3분까지 사용할 수 있습니다.')
     except (wave.Error,EOFError) as e:raise ValueError('읽을 수 없는 음성 파일입니다.') from e
     return to_telephone(pcm,rate)

    def stored_audio(path):
     with wave.open(str(path)) as f:
      channels,width,rate,frames=f.getnchannels(),f.getsampwidth(),f.getframerate(),f.getnframes()
      if channels not in (1,2) or width not in (1,2,3,4) or not 8000<=rate<=192000 or not 0<frames/rate<=MAX_SECONDS or f.getcomptype()!='NONE':raise ValueError('재생할 수 없는 음성 파일입니다.')
      pcm=f.readframes(frames)
      if len(pcm)!=frames*channels*width:raise ValueError('음성 파일이 완전하지 않습니다.')
     if width==1:pcm=audioop.bias(pcm,1,-128)
     if channels==2:pcm=audioop.tomono(pcm,width,.5,.5)
     if width!=2:pcm=audioop.lin2lin(pcm,width,2)
     return pcm,rate

    def stored_pcm(path):
     pcm,rate=stored_audio(path)
     return to_telephone(pcm,rate)

    class CallAudio:
     def __init__(self,call_id,audio_id,pcm,name,repeat=False):
      if not pcm or len(pcm)%2:raise ValueError('빈 음성은 재생할 수 없습니다.')
      self.call_id=call_id;self.id=audio_id;self.pcm=pcm;self.name=name;self.repeat=repeat;self.cursor=0;self.stopped=False
     def frame(self):
      if self.stopped:return None
      if self.cursor>=len(self.pcm):
       if not self.repeat:return None
       self.cursor=0
      chunk=self.pcm[self.cursor:self.cursor+320];self.cursor=min(self.cursor+320,len(self.pcm));return chunk.ljust(320,b'\0')
     def stop(self):self.stopped=True
     def snapshot(self):
      return {'id':self.id,'name':self.name,'call_id':self.call_id,'position_seconds':round(self.cursor/16000,2),'seconds':round(len(self.pcm)/16000,2),'repeat':self.repeat,'active':not self.stopped and (self.repeat or self.cursor<len(self.pcm))}
