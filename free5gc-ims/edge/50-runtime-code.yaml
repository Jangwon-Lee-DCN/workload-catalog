     <g class="cp-core"><rect x="218" y="52" width="39" height="65" rx="6"/><rect x="272" y="52" width="39" height="65" rx="6"/>
     <path d="M225 64h24 M225 75h24 M225 86h24 M225 97h24 M279 64h24 M279 75h24 M279 86h24 M279 97h24"/><circle class="cp-port cp-port-a" cx="250" cy="109" r="2"/><circle class="cp-port cp-port-b" cx="304" cy="109" r="2"/></g>
