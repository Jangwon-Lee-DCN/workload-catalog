    """Automatic per-outgoing-call sampling and bounded background synthesis."""
    import os,audioop,base64,http.client,io,json,pathlib,threading,time,uuid,wave,hashlib,shutil
    from audio_files import uploaded_pcm,stored_pcm,stored_audio
    CAPTURE_SECONDS=20
    TEXT='안녕하세요. 이 음성은 통화에서 추출한 목소리를 바탕으로 AI가 만든 가짜 음성입니다. 지금 음성 판별 기능을 확인하고 있습니다.'
    class AutomaticGeneration:
     target_seconds=CAPTURE_SECONDS
     def __init__(self,ue_ip,event):
      self.ue_ip=ue_ip;self.event=event;self.root=pathlib.Path('/data/jobs');self.root.mkdir(parents=True,exist_ok=True);self.job=None;self.lock=threading.Lock()
     def begin(self,call_id,reference_source='microphone_before_transform'):
      with self.lock:
       if self.job and self.job['state'] in ['generating','queued']:return
       self.job={'id':uuid.uuid4().hex,'call_id':call_id,'state':'sampling','started':time.time(),'sample_seconds':0.,'sample_target_seconds':self.target_seconds,'voiced_seconds':0.,'text':TEXT,'provider':'pending','reference_source':reference_source,'detail':'발신 음성 샘플링 중'}
       self.raw=bytearray();self.sent=bytearray();self.wideband=bytearray();self.wideband_frames=0;self.samples=0;self.voice=0
      self.event('sample_started',call_id=call_id)
      threading.Thread(target=self.prepare,args=(self.job,),daemon=True).start()
     def prepare(self,job):
      started=time.monotonic();conn=http.client.HTTPConnection('127.0.0.1',8082,timeout=130)
      try:
       token=pathlib.Path('/generation/auth-token').read_text().strip()
       conn.request('POST','/prepare',body=b'',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
       r=conn.getresponse();data=json.loads(r.read(10000))
       ready=r.status==200 and data.get('ready') is True
       with self.lock:
        if self.job is job and not self.deleted_call(job['call_id']):job.update(preparation_state='ready' if ready else 'unavailable',preparation_seconds=round(time.monotonic()-started,3),preparation_provider=data.get('provider'))
      except Exception:
       with self.lock:
        if self.job is job and not self.deleted_call(job['call_id']):job['preparation_state']='unavailable'
      finally:conn.close()
     def file_reference(self,audio_id):
      # Read the unmodified source, independently of playback cursor or effects.
      pcm,rate=stored_audio(self.audio_path(audio_id))
      samples=len(pcm)//2
      if samples<10*rate:raise ValueError('목소리 복제에는 10초 이상의 녹음 파일을 선택해 주세요.')
      if audioop.rms(pcm,2)<60:raise ValueError('선택한 파일에서 목소리가 들리지 않습니다.')
      return pcm,rate,samples
     def begin_file(self,call_id,audio_id):
      pcm,rate,samples=self.file_reference(audio_id)
      with self.lock:
       if self.job and self.job['state'] in ['sampling','queued','generating']:raise ValueError('이미 음성을 만들고 있습니다.')
       self.job={'id':uuid.uuid4().hex,'call_id':call_id,'state':'queued','started':time.time(),'sample_seconds':round(samples/rate,3),'sample_target_seconds':round(samples/rate,3),'text':TEXT,'provider':'pending','reference_source':'call_file','reference_audio_id':audio_id,'reference_rate':rate,'wideband_fraction':1. if rate>=24000 else 0.,'detail':'통화 파일의 원음으로 생성 요청 중'}
       j=self.job
      self.event('file_sample_ready',call_id=call_id,job_id=j['id'],audio_id=audio_id)
      threading.Thread(target=self.generate,args=(j,(pcm,)),daemon=True).start()
     def feed(self,call_id,raw,sent,reference_pcm=None):
      with self.lock:
       j=self.job
       if not j or j['call_id']!=call_id or j['state']!='sampling':return
       remaining=max(0,self.target_seconds*8000-self.samples)*2
       raw=raw[:remaining];sent=sent[:remaining]
       if reference_pcm is not None:
        if len(reference_pcm)!=len(raw)*3:raise ValueError('reference frame length mismatch')
        self.wideband.extend(reference_pcm);self.wideband_frames+=len(raw)//2
       else:
        self.wideband.extend(bytes(len(raw)*3))
       self.raw.extend(raw);self.sent.extend(sent);self.samples+=len(raw)//2
       if audioop.rms(raw,2)>=180:self.voice+=len(raw)//2
       j.update(sample_seconds=round(self.samples/8000,2),voiced_seconds=round(self.voice/8000,2))
       if self.samples>=self.target_seconds*8000:
        if audioop.rms(bytes(self.raw),2)<60:
         j.update(state='failed',detail='20초 녹음에서 목소리가 들리지 않습니다. 마이크 입력을 확인해 주세요.');return
        wide=self.wideband_frames>=self.samples*.95
        j.update(reference_rate=24000 if wide else 8000,wideband_fraction=round(self.wideband_frames/self.samples,3))
        j['state']='queued';j['detail']='20초 녹음 저장 후 생성 요청 중';data=(bytes(self.wideband) if wide else bytes(self.raw),bytes(self.sent));threading.Thread(target=self.generate,args=(j,data),daemon=True).start()
     def end(self,call_id,reason='음성 수집 완료 전에 통화가 종료됐습니다'):
      with self.lock:
       if self.job and self.job['call_id']==call_id and self.job['state']=='sampling':self.job.update(state='stopped',detail=reason)
     def snapshot(self):
      with self.lock:return dict(self.job) if self.job else None
     def deleted_call(self,call_id):
      return (self.root/('.deleted-call-'+hashlib.sha256(call_id.encode()).hexdigest())).exists()
     def generate(self,j,data):
      folder=self.root/j['id']
      try:
       with self.lock:
        if self.deleted_call(j['call_id']):return
        folder.mkdir(mode=0o700,exist_ok=True)
        for name,pcm in zip(['reference.wav','transmitted.wav'],data):
         with wave.open(str(folder/name),'wb') as f:f.setparams((1,2,j.get('reference_rate',8000) if name=='reference.wav' else 8000,0,'NONE','not compressed'));f.writeframes(pcm)
         (folder/name).chmod(0o600)
        sample=(folder/'reference.wav').read_bytes()
        j.update(state='generating',saved=time.time(),detail='참고 음성 기반 음성 생성 중')
       self.event('generation_started',call_id=j['call_id'],job_id=j['id'],sample_seconds=j['sample_seconds'])
       conn=http.client.HTTPConnection('127.0.0.1',8082,timeout=int(os.environ.get('GENERATION_TIMEOUT_SECONDS','180')))
       token=pathlib.Path('/generation/auth-token').read_text().strip();body=json.dumps({'job_id':j['id'],'ue_id':self.ue_ip,'text':j['text'],'reference_wav_b64':base64.b64encode(sample).decode()})
       try:
        conn.request('POST','/synthesize',body,headers={'Content-Type':'application/json','Authorization':'Bearer '+token});r=conn.getresponse();audio=r.read();headers=dict(r.getheaders())
       finally:conn.close()
       if r.status!=200:
        with self.lock:j.update(provider=headers.get('X-Provider','unknown'),model=headers.get('X-Model','unknown'))
        try:error=json.loads(audio).get('error','생성 요청 실패')
        except Exception:error='생성 요청 실패'
        raise RuntimeError(error)
       with wave.open(io.BytesIO(audio)) as f:
        pcm=f.readframes(f.getnframes());seconds=f.getnframes()/f.getframerate()
        if audioop.rms(pcm,f.getsampwidth())<20:raise RuntimeError('생성 음성이 무음입니다')
       with self.lock:
        if self.deleted_call(j['call_id']):return
        (folder/'generated.wav').write_bytes(audio);(folder/'generated.wav').chmod(0o600)
        j.update(provider=headers.get('X-Provider','unknown'),model=headers.get('X-Model','unknown'),generation_request_id=headers.get('X-Generation-Request-ID'),generation_pod=headers.get('X-Generation-Pod'),audio_effects=json.loads(headers.get('X-Audio-Effects','{}')),provider_output_format=headers.get('X-Provider-Output-Format'),state='ready',detail='합성 음성 준비 완료',audio_seconds=round(seconds,2),completed=time.time(),clone_seconds=float(headers.get('X-Clone-Seconds','0')),synthesis_seconds=float(headers.get('X-Synthesis-Seconds','0')),generation_seconds=float(headers.get('X-Total-Seconds','0')),pitch_semitones=float(headers.get('X-Pitch-Semitones','0')),tone_seconds=float(headers.get('X-Tone-Seconds','0')))
        (folder/'result.json').write_text(json.dumps(j,ensure_ascii=False,indent=2));(folder/'result.json').chmod(0o600)
       self.event('generation_ready',call_id=j['call_id'],job_id=j['id'])
      except Exception as e:
       with self.lock:
        if self.deleted_call(j['call_id']):return
        j.update(state='failed',detail=str(e)[:160])
        folder.mkdir(mode=0o700,exist_ok=True);(folder/'result.json').write_text(json.dumps(j,ensure_ascii=False,indent=2));(folder/'result.json').chmod(0o600)
       self.event('generation_failed',call_id=j['call_id'],error=str(e)[:160])
     def clips(self):
      out=[]
      for p in self.root.glob('*/result.json'):
       try:
        j=json.loads(p.read_text())
        if j['state']=='ready' and (p.parent/'generated.wav').exists():out.append({k:j.get(k) for k in ['id','text','audio_seconds','completed','origin','purpose','source_name']})
       except (OSError,ValueError,KeyError):pass
      out.sort(key=lambda j:j.get('completed') or 0,reverse=True);out=out[:30]
      return out
     def audio_path(self,audio_id):
      parts=audio_id.split('.')
      job=parts[0];kind=parts[1] if len(parts)==2 else 'generated'
      if len(parts)>2 or len(job)!=32 or any(c not in '0123456789abcdef' for c in job) or kind not in ['generated','reference','transmitted']:raise ValueError('invalid audio id')
      p=self.root/job/(kind+'.wav')
      if not p.exists():raise ValueError('음성 파일이 없습니다')
      return p
     def assets(self):
      out=[]
      for folder in self.root.iterdir():
       if not folder.is_dir() or len(folder.name)!=32:continue
       try:meta=json.loads((folder/'result.json').read_text())
       except (OSError,ValueError):meta={}
       for kind,label in [('generated','합성 음성'),('reference','복제용 샘플'),('transmitted','복제 구간 송출 음성')]:
        p=folder/(kind+'.wav')
        if not p.exists():continue
        try:
         with wave.open(str(p)) as f:seconds=f.getnframes()/f.getframerate()
         out.append({'id':folder.name if kind=='generated' else folder.name+'.'+kind,'job_id':folder.name,'kind':kind,'label':'내 목소리 전체 녹음' if kind=='generated' and meta.get('origin')=='microphone_recording' else ('통화용 녹음' if meta.get('purpose')=='call' else '업로드 음성') if kind=='generated' and meta.get('origin')=='upload' else label,'text':meta.get('text','') if kind=='generated' else '목소리 복제에 사용한 샘플 구간','created':p.stat().st_mtime,'seconds':round(seconds,2),'bytes':p.stat().st_size,'call_id':meta.get('call_id'),'origin':meta.get('origin')})
        except (OSError,wave.Error):continue
      return sorted(out,key=lambda a:a['created'],reverse=True)
     def delete_audio(self,audio_id):
      p=self.audio_path(audio_id);p.unlink()
      with self.lock:
       if self.job and audio_id==self.job['id']:self.job.update(state='deleted',detail='생성 음성을 보관소에서 삭제했습니다')
     def import_audio(self,data,name,purpose,call_id=None):
      with self.lock:
       if call_id and self.deleted_call(call_id):raise ValueError('종료된 통화의 음성을 이미 삭제했습니다.')
       return self._import_audio(data,name,purpose,call_id)
     def _import_audio(self,data,name,purpose,call_id=None):
      if purpose not in ['call','send']:raise ValueError('업로드 용도를 확인해 주세요.')
      pcm=uploaded_pcm(data);name=''.join(c for c in str(name).replace('\\','/').rsplit('/',1)[-1] if c.isprintable())[:120] or '업로드 음성.wav'
      aid=uuid.uuid4().hex;staging=self.root/('.upload-'+aid);staging.mkdir(mode=0o700)
      meta={'id':aid,'state':'ready','origin':'upload','purpose':purpose,'call_id':call_id,'source_name':name,'text':name,'audio_seconds':round(len(pcm)/16000,2),'completed':time.time(),'sha256':hashlib.sha256(data).hexdigest()}
      try:
       target=staging/'generated.wav';target.write_bytes(data);target.chmod(0o600);(staging/'result.json').write_text(json.dumps(meta,ensure_ascii=False));staging.rename(self.root/aid)
      except Exception:
       shutil.rmtree(staging);raise
      return meta
     def load_audio(self,audio_id):
      p=self.audio_path(audio_id);pcm=stored_pcm(p)
      try:meta=json.loads((p.parent/'result.json').read_text())
      except (OSError,ValueError):meta={}
      return pcm,meta.get('source_name') or ('보관 음성 · '+audio_id[:6])
