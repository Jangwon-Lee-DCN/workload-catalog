    """Explicit caller-confirmed deletion of one ended call's local audio."""
    import hashlib,re,shutil

    def pending(client):
     if any(not c.get('ended') for c in list(client.calls.values())):return None
     for c in reversed(list(client.calls.values())):
      if c.get('incoming') or not c.get('ended') or not c.get('audio_cleanup_ready') or c.get('cleanup_choice'):continue
      if not c.get('recording',{}).get('closed',True):continue
      files=manifest(client,c)
      job=client.generation.snapshot();working=bool(job and job['call_id']==c['id'] and job['state'] in ['queued','generating'])
      if files or working:return {'call_id':c['id'],'files':files,'generating':working}
     return None

    def manifest(client,c):
     used={x.removesuffix('.generated') for x in c.get('audio_ids',[])}
     job=client.generation.snapshot();job_id=job['id'] if job and job['call_id']==c['id'] else None
     return [{**a,'reused':a.get('call_id')!=c['id']} for a in client.generation.assets() if a.get('call_id')==c['id'] or a['job_id']==job_id or a['id'] in used]

    def decide(client,cid,delete):
     c=client.calls.get(cid)
     if not isinstance(delete,bool) or not c or c.get('incoming') or not c.get('ended') or not c.get('audio_cleanup_ready') or not c.get('recording',{}).get('closed',True):raise ValueError('통화 녹음 저장이 끝난 뒤 선택해 주세요.')
     choice='deleted' if delete else 'kept'
     if c.get('cleanup_choice'):
      if c['cleanup_choice']!=choice:raise ValueError('이미 처리한 통화입니다.')
      return
     if not delete:c['cleanup_choice']=choice;return
     g=client.generation
     with g.lock:
      # snapshot() also takes the generator lock: use the held job directly below.
      job=g.job;used={x.removesuffix('.generated') for x in c.get('audio_ids',[])}
      files=[a for a in g.assets() if a.get('call_id')==cid or (job and job['call_id']==cid and a['job_id']==job['id']) or a['id'] in used]
      targets={a['id'] for a in files}
      for other in list(client.calls.values()):
       if not other.get('ended') and targets.intersection(x.removesuffix('.generated') for x in other.get('audio_ids',[])):raise ValueError('다른 통화에서 사용 중인 음성이 있습니다.')
      marker=g.root/('.deleted-call-'+hashlib.sha256(cid.encode()).hexdigest());marker.touch(mode=0o600,exist_ok=True)
      for a in files:
       try:g.audio_path(a['id']).unlink()
       except (ValueError,FileNotFoundError):pass
      if job and job['call_id']==cid:
       job.update(state='deleted',detail='통화 음성을 삭제했습니다')
       if re.fullmatch('[0-9a-f]{32}',job['id']):shutil.rmtree(g.root/job['id'],ignore_errors=True)
       for name in ['raw','sent','wideband']:setattr(g,name,bytearray())
      rid=c.get('recording',{}).get('id','')
      if re.fullmatch('[0-9a-f]{32}',rid):shutil.rmtree(g.root/('.recording-'+rid),ignore_errors=True)
      for folder in {g.root/a['job_id'] for a in files}:
       if not folder.is_dir():continue
       if not any(folder.glob('*.wav')):shutil.rmtree(folder)
      if getattr(client,'last_playback',None) and client.last_playback['call_id']==cid:client.last_playback=None
      (client.callsdir/(cid+'-received.wav')).unlink(missing_ok=True)
      c['cleanup_choice']=choice;c['deleted_audio_count']=len(files)
     client.event('call_audio_deleted',call_id=cid,count=len(files))
