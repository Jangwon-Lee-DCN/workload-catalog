      def do_GET(self):
       path=self.path.split('?')[0]
       if path=='/api/state':return self.output(200,self.state())
       if path.startswith('/api/audio/'):
        try:return self.output(200,client.generation.audio_path(path.rsplit('/',1)[-1]).read_bytes(),'audio/wav',headers={'Content-Disposition':('attachment' if 'download=1' in self.path else 'inline')+'; filename=ue-'+client.c['msisdn']+'-'+path.rsplit('/',1)[-1]+'.wav'})
