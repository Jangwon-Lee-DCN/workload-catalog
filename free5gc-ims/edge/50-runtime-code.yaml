apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-dashboard-web
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  app.js: |
    'use strict';
    const INSPECTION_ENABLED=@{inspection-enabled};
    const GENERATION_ENABLED=@{generation-enabled};
    const PHONE_ONLY=new URLSearchParams(location.search).get('view')==='phone';
    document.documentElement.classList.toggle('generation-disabled',!GENERATION_ENABLED);
    if(PHONE_ONLY)document.documentElement.classList.add('phone-only');
    let phoneWindow=null;
    function phoneOwner(){try{return PHONE_ONLY&&window.opener&&!window.opener.closed&&window.opener.location.origin===location.origin&&window.opener.location.pathname===location.pathname?window.opener.PhoneController:null;}catch{return null;}}

    let infrastructureSnapshot=null;
    const AUDIO_REVISION=document.querySelector('meta[name="audio-revision"]')?.content||'';
    const $=id=>document.getElementById(id);let state=null,audioReady=false,ctx,ws,stream,node,source,pcmPlayer,playbackCallId=null,busy=false,lastIncoming=null,autoSelectedJob=null,viewRole='idle',errorOrigin=null,selectedCallAudio='',uploadingCall=false,uploadingClip=false,dialTransformEnabled=false,dialCloneEnabled=false;
    const labels={ending:'통화 종료 중',dialing:'전화 연결 중',ringback:'상대 호출 중',incoming:'전화가 왔습니다',connecting:'통화 연결 중',connected:'통화 중',cancelling:'발신 취소 중'};
    function error(e,origin='action'){errorOrigin=origin;$('error').hidden=false;$('error').textContent=e.message||String(e);}
    function bytes(n){return n<1024?`${n} B`:`${(n/1024).toFixed(1)} KiB`;}
    function render(s){if(/^[a-f0-9]{12}$/.test(AUDIO_REVISION)&&s.audio_revision&&s.audio_revision!==AUDIO_REVISION&&!s.call&&!busy&&[...document.querySelectorAll('audio')].every(a=>a.paused)){const refreshUrl=new URL(location.href);refreshUrl.searchParams.set('audio',s.audio_revision);location.replace(refreshUrl.href);return;}state=s;const c=s.call;const status=c?.status;const connected=status==='connected';if(pcmPlayer&&playbackCallId&&playbackCallId!==(c?.id||null))pcmPlayer.port.postMessage({type:'reset'});playbackCallId=c?.id||null;$('me').textContent=s.ue;$('peer').textContent=s.peer;$('localLabel').textContent=`내 전화 · ${s.ue}`;$('callHeading').textContent='전화 기능';$('connection').textContent='연결됨';$('connection').className='badge good';$('reg').textContent=s.registered?'전화 사용 가능':'연결 중';$('reg').className=`badge ${s.registered?'good':''}`;
    const owner=phoneOwner(),mediaReady=audioReady||!!owner?.audioReady();
    const recordedDial=$('callMode').value==='recording';
    $('call').disabled=busy||!s.registered||!!c||uploadingCall||(recordedDial?!$('callAudio').value:!mediaReady);$('answer').disabled=busy||status!=='incoming';$('reject').disabled=busy||!['incoming','dialing','ringback'].includes(status);$('hangup').disabled=busy||!connected;
    const muted=!!s.media.mic_muted,autoMuted=!!s.media.mic_auto_muted;
    $('mute').disabled=busy||!connected||autoMuted;$('mute').textContent=autoMuted?'자동 음소거':muted?'음소거 해제':'마이크 음소거';$('mute').setAttribute('aria-pressed',String(muted));$('mute').classList.toggle('muted-on',muted);$('muteStatus').textContent=autoMuted?'음성 파일을 보내는 동안 마이크를 끕니다.':muted?'내 마이크는 꺼져 있습니다.':connected?'마이크 켜짐':'통화 중 사용할 수 있습니다.';
    stream?.getAudioTracks().forEach(t=>{if(t.enabled===muted)t.enabled=!muted;});
    $('screen').className='screen'+(c?' on':'')+(status==='incoming'?' incoming':'');$('phoneState').textContent=labels[status]||'';$('phonePeer').textContent=c?`${s.peer}`:'';$('phoneDetail').textContent=status==='incoming'?`${s.peer}에서 전화가 왔습니다.`:connected?(muted?'마이크 음소거 중':'상대방과 통화 중입니다.'):c?'전화를 연결하고 있습니다.':'';
    const sec=c?.connected?Math.max(0,Math.floor(s.time-c.connected)):0;$('timer').textContent=connected?`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:'';$('status').textContent=c?(labels[status]||'통화 상태 확인 중'):'전화를 걸거나 받을 수 있습니다.';
    if(c)viewRole=c.incoming?'receiver':'caller';
    $('libraryPanel').hidden=viewRole==='receiver';
    const preparingRecording=!c&&recordedDial;
    $('scenarioPanel').hidden=viewRole!=='caller'||preparingRecording;$('idlePanel').hidden=viewRole!=='idle'&&!preparingRecording;
    $('dialOptions').hidden=!!c;$('recordingOptions').hidden=!preparingRecording;$('idlePanel').classList.toggle('recording-setup',preparingRecording);
    $('setupTitle').textContent=preparingRecording?'녹음 음성으로 전화':'통화를 시작해 보세요';$('setupHint').textContent=preparingRecording?'상대방이 전화를 받으면 선택한 녹음을 재생합니다.':'전화를 걸면 목소리 만들기, 전화를 받으면 음성 판별 기능이 나타납니다.';
    $('answer').hidden=status!=='incoming';$('call').hidden=!!c;$('reject').hidden=!['incoming','dialing','ringback'].includes(status);$('hangup').hidden=!connected&&status!=='ending';$('mute').hidden=!connected;
    $('prepare').closest('.actions').hidden=mediaReady;
    $('prepare').textContent=recordedDial&&!c?'스피커 연결':mediaReady?'마이크·스피커 준비 완료':'마이크·스피커 준비';
    if(!mediaReady)$('audioState').textContent=recordedDial?'마이크 없이 녹음을 보낼 수 있습니다.':'마이크 사용을 허용해 주세요.';
    $('phoneDetail').hidden=!c;$('status').hidden=!!c;
    const outgoing=connected&&!c.incoming;const tr=s.transform||{};
    const recording=c?.recording;$('fullRecordingStatus').hidden=!recording;$('fullRecordingStatus').textContent=recording?.state==='failed'?recording.error:recording?`내 목소리 전체 녹음 중 · ${recording.seconds.toFixed(1)}초 · 통화 종료 후 보관소에 저장`:'';
    $('transform').disabled=busy||!outgoing;$('transform').textContent=tr.enabled?'ON':'OFF';$('transform').setAttribute('aria-checked',String(!!tr.enabled));$('transform').classList.toggle('enabled',!!tr.enabled);
    $('transformDetail').textContent=tr.enabled?'마이크와 통화 파일을 변조합니다. 생성 음성에는 적용하지 않습니다.':c?.recorded_audio_id?'통화 파일의 원래 목소리':'원래 목소리';
    const primary=s.call_audio;
    $('recordingPlayback').hidden=!primary||!c||!!c.incoming;$('roleplayScript').hidden=!!primary&&!!c&&!c.incoming;$('callScriptHeading').textContent=primary&&c&&!c.incoming?'통화 녹음':'통화 대사';
    renderCallRecording(primary,s.playback,connected);renderClipPlayback(s.playback_status,connected);
    $('replayCallAudio').disabled=busy||!outgoing||!primary;$('stopCallAudio').disabled=busy||!outgoing||!primary?.active;
    if(connected&&s.playback)$('phoneDetail').textContent='선택한 음성을 보내고 있습니다.';else if(primary?.active&&connected)$('phoneDetail').textContent='통화 녹음 재생 중';
    if(c?.file_clone_error&&errorOrigin!=='action')error(new Error(c.file_clone_error));
    const j=s.generation;const current=j&&j.call_id===c?.id;
    const samplingBusy=j&&['sampling','queued','generating'].includes(j.state);
    const fileClone=!!c?.recorded_audio_id;
    $('sampleStart').disabled=busy||!outgoing||!!samplingBusy;$('sampleStart').textContent=current&&samplingBusy?(j.state==='sampling'?'녹음 중':'음성 생성 중'):fileClone?'통화 파일로 복제':current?'다시 녹음':'녹음 시작';
    $('sampleStartHint').textContent=fileClone?'선택한 파일 전체로 만듭니다. 음성 변조 여부와 관계없이 원음을 사용합니다.':current&&j.state==='sampling'&&muted?'음소거를 해제하면 녹음을 이어갑니다.':'녹음을 시작하고 아래 대사를 읽어 주세요.';
    $('generationSourceHint').textContent=fileClone?'10초 이상의 통화 파일을 사용합니다. 재생이 끝나도 만들 수 있습니다.':'20초 동안 녹음한 목소리로 새 음성을 만듭니다. 음소거 중에는 녹음이 멈춥니다.';
    const generationStates={sampling:'녹음 중',queued:'녹음 저장 중',generating:'음성을 만들고 있습니다.',ready:'합성 음성 준비 완료',failed:'음성을 만들지 못했습니다. 다시 녹음해 주세요.',stopped:'녹음이 종료되었습니다.'};
    $('scenarioCallState').textContent=current?(j.state==='sampling'&&muted&&!['call_recording','call_file'].includes(j.reference_source)?'음소거 중 · 녹음 일시 정지':generationStates[j.state]||'음성 준비 중'):outgoing?(fileClone?'통화 파일로 복제를 눌러 주세요.':'녹음 시작을 눌러 주세요.'):'통화 연결 대기 중';
    $('scenarioCallState').classList.toggle('generation-error',!!current&&j.state==='failed');
    $('generationTiming').textContent=current?`녹음 ${(j.sample_seconds??0).toFixed(1)} / ${(j.sample_target_seconds??20).toFixed(1)}초`+(j.state==='ready'?` · 생성 음성 ${j.audio_seconds}초`:''):'';
    document.querySelector('.generation-flow li:first-child b').textContent=fileClone?'파일 원음 선택':'목소리 녹음';document.querySelector('.generation-flow li:first-child span').textContent=fileClone?'파일 전체':'20초 녹음';
    document.querySelectorAll('.generation-flow li').forEach((e,i)=>{e.classList.toggle('done',!!current&&(i===0?['queued','generating','ready'].includes(j.state):i===1?['generating','ready'].includes(j.state):j.state==='ready'));});
    const clips=s.clips||[],key=clips.map(v=>v.id).join(',')+'|'+(current?j.id:'');
    if($('clip').dataset.key!==key){const selected=$('clip').value;$('clip').replaceChildren(...(clips.length?clips.map(v=>new Option(`${v.id===j?.id&&current?'★ 이번 통화 · 새로 생성':v.origin==='upload'?'업로드 · '+v.source_name:'보관 음성'} · ${new Date(v.completed*1000).toLocaleTimeString('ko-KR')} · ${v.audio_seconds}초`,v.id)):[new Option('아직 생성된 음성이 없습니다.','')]));if(clips.some(v=>v.id===selected))$('clip').value=selected;$('clip').dataset.key=key;}
