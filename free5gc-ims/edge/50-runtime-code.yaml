    </div></section>
    <section class="network-zone edge-zone"><header><h2>Edge / MEC</h2><article id="verdictCard" class="verdict-card" role="status" aria-live="polite" hidden><div class="verdict-summary"><strong id="verdictText"></strong><span id="verdictReceiver"></span></div><div id="verdictScores" class="verdict-scores"></div><small id="deliveryStatus"></small></article></header><div class="edge-nodes"><div class="ue-pair">
