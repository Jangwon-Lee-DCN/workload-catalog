     const meter=$('callAudioMeter');meter.max=total||1;meter.value=elapsed;meter.setAttribute('aria-valuetext',`${recordingTime(elapsed)} / ${recordingTime(total)} · ${percent}%`);
     $('callAudioPercent').textContent=`${percent}%`;$('callAudioRemaining').textContent=`${primary?.repeat?'이번 재생 ':''}남은 시간 ${recordingTime(Math.max(0,total-elapsed))}`;
