apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-n6-egress
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu
    previous_gpu=''
    while :; do
     if ip -4 addr show net3 2>/dev/null | grep -q inet; then
      for dst in @{pcscf-ip} @{rtpengine-ip} @{mec-ip}; do
       iptables -t nat -C POSTROUTING -s @{ue-cidr} -d "$dst/32" -o net3 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s @{ue-cidr} -d "$dst/32" -o net3 -j MASQUERADE
      done
      ip route replace default via @{n6-gateway} dev net3 table 1083
      if [ -s /gpu/gpu-ip ]; then
       gpu_ip=$(cat /gpu/gpu-ip)
       case "$gpu_ip" in *[!0-9.]*|'') sleep 3; continue;; esac
       if [ "$previous_gpu" != "$gpu_ip" ]; then
        while ip rule del priority 1083 from @{ue-cidr} 2>/dev/null; do :; done
        if [ -n "$previous_gpu" ]; then
         iptables -t nat -D POSTROUTING -s @{ue-cidr} -d "$previous_gpu/32" -o net3 -j MASQUERADE 2>/dev/null || true
        fi
        ip rule add priority 1083 from @{ue-cidr} to "$gpu_ip/32" table 1083
        previous_gpu=$gpu_ip
       fi
       iptables -t nat -C POSTROUTING -s @{ue-cidr} -d "$gpu_ip/32" -o net3 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s @{ue-cidr} -d "$gpu_ip/32" -o net3 -j MASQUERADE
      fi
     fi
     sleep 3
    done
