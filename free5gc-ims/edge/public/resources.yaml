metadata:
  name: ims-public-gateway
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
rules:
- apiGroups: ['']
  resources: [services, endpoints, secrets, pods]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
