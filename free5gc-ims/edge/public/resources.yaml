---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ims-public-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
rules:
- apiGroups: ['']
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
