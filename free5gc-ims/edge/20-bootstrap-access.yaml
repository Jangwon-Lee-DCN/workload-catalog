apiVersion: v1
kind: ServiceAccount
metadata:
  name: ims-bootstrap
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-12'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ims-bootstrap
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - gnb
      - upf
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ims-bootstrap
  namespace: free5gc
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
subjects:
  - kind: ServiceAccount
    name: ims-bootstrap
    namespace: ims-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ims-bootstrap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-bootstrap-code
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
data:
  wait_dependencies.py: |
    """Read-only startup checks across Core and Edge Kubernetes APIs."""
    import argparse,json,os,pathlib,socket,ssl,time,urllib.request

    def pod_ready(obj):
     return not obj.get('metadata',{}).get('deletionTimestamp') and obj.get('status',{}).get('phase')=='Running' and any(x['type']=='Ready' and x['status']=='True' for x in obj.get('status',{}).get('conditions',[]))
    def deployment_ready(obj):
     s=obj.get('status',{});n=obj.get('spec',{}).get('replicas',1)
     return n>0 and s.get('observedGeneration',0)>=obj.get('metadata',{}).get('generation',1) and s.get('availableReplicas',0)>=n and s.get('updatedReplicas',0)>=n
    def job_complete(obj):
     c={x['type']:x['status'] for x in obj.get('status',{}).get('conditions',[])}
     return c.get('Complete')=='True' and c.get('Failed')!='True'
    def reachable(host,port,protocol=socket.IPPROTO_TCP):
     try:
      with socket.socket(socket.AF_INET,socket.SOCK_STREAM,protocol) as s:s.settimeout(2);s.connect((host,port))
      return True
     except OSError:return False

    def checks(mode,core,edge,probe):
     result={}
     if mode in ['gnb','ue']:
      result['Core AMF']=deployment_ready(core('/apis/apps/v1/namespaces/free5gc/deployments/amf'))
      if mode=='gnb':result['AMF SCTP']=probe(os.environ['AMF_IP'],38412,socket.IPPROTO_SCTP)
     if mode=='ue':
      result['Core SMF']=deployment_ready(core('/apis/apps/v1/namespaces/free5gc/deployments/smf'))
      result['5GC subscribers']=job_complete(core('/apis/batch/v1/namespaces/ims-lab/jobs/ims-provision-5gc'))
      for name in ['gnb','upf']:result['Edge '+name]=deployment_ready(edge('/apis/apps/v1/namespaces/free5gc/deployments/'+name))
     if mode in ['ue','mec']:
      result['IMS subscribers']=job_complete(core('/apis/batch/v1/namespaces/ims-lab/jobs/ims-provision-hss'))
      for name in ['ims-icscf','ims-scscf','ims-pyhss']:result[name]=pod_ready(core('/api/v1/namespaces/ims-lab/pods/'+name))
      if mode=='mec':result['P-CSCF SIP TCP']=probe(os.environ['PCSCF_IP'],5060,socket.IPPROTO_TCP)
      else:
       for name in ['ims-pcscf','ims-rtpengine']:result['Edge '+name]=pod_ready(edge('/api/v1/namespaces/ims-lab/pods/'+name))
     return result

    def reader(root,token,ca):
     context=ssl.create_default_context(cafile=ca)
     def get(path):
      req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+pathlib.Path(token).read_text().strip()})
      with urllib.request.urlopen(req,context=context,timeout=3) as response:
       if response.status!=200 or response.headers.get_content_type()!='application/json':raise ValueError('Expected Kubernetes JSON')
       return json.load(response)
     return get

    def main():
     p=argparse.ArgumentParser();p.add_argument('mode',choices=['gnb','ue','mec']);a=p.parse_args()
     core=reader(os.environ['CORE_API'],'/core/token','/core/ca.crt');edge=reader('https://'+os.environ['KUBERNETES_SERVICE_HOST']+':'+os.environ.get('KUBERNETES_SERVICE_PORT','443'),'/var/run/secrets/kubernetes.io/serviceaccount/token','/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
     deadline=time.monotonic()+int(os.environ.get('WAIT_TIMEOUT_SECONDS','900'));last=None
     while time.monotonic()<deadline:
      try:
       values=checks(a.mode,core,edge,reachable)
       if all(values.values()):print('Dependencies ready: '+a.mode,flush=True);return
       detail=', '.join(k for k,v in values.items() if not v)
      except Exception as e:detail=type(e).__name__
      if detail!=last:print('Waiting for '+detail,flush=True);last=detail
      time.sleep(2)
     raise SystemExit('Dependency deadline exceeded: '+a.mode)
    if __name__=='__main__':main()
