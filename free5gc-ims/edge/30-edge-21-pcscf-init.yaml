apiVersion: v1
kind: Secret
metadata:
  name: ims-pcscf-init
  namespace: ims-lab
  labels:
    app.kubernetes.io/part-of: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-11'
stringData:
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    mkdir -p /etc/kamailio_pcscf /var/run/kamailio
    for src in /config/*; do
     rel=${src##*/}; rel=${rel//__/\/}; mkdir -p "/etc/kamailio_pcscf/$(dirname "$rel")"; cp "$src" "/etc/kamailio_pcscf/$rel"
    done
    until mysqladmin -h @{core-worker-ip} -u root ping --silent; do sleep 2; done
    if ! mysql -h @{core-worker-ip} -u root -N -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='pcscf'" | grep -q pcscf; then
     mysql -h @{core-worker-ip} -u root -e "CREATE DATABASE pcscf"
     mysql -h @{core-worker-ip} -u root pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/standard-create.sql
    mysql -h @{core-worker-ip} -u root pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/presence-create.sql
    mysql -h @{core-worker-ip} -u root pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_usrloc_pcscf-create.sql
    mysql -h @{core-worker-ip} -u root pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_dialog-create.sql
    fi
    mysql -h @{core-worker-ip} -u root -e "CREATE USER IF NOT EXISTS 'pcscf'@'%' IDENTIFIED WITH mysql_native_password BY '@{kamailio-password}'; GRANT ALL ON pcscf.* TO 'pcscf'@'%'"

    exec kamailio -f /etc/kamailio_pcscf/kamailio_pcscf.cfg -P /run/kamailio_pcscf.pid -m 64 -M 16 -DD -E -e
