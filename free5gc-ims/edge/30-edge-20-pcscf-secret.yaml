    # Logical OR of following flags:
    # - IPSEC_SEND_FORCE_SOCKET 1
    # - IPSEC_SETDSTURI_FULL 128
    # - IPSEC_FORWARD_USEVIA 256
    # - IPSEC_FORWARD_TRYTCP 512
    #!define IPSEC_FORWARD_FLAGS 897

    #!define RX_IMS_REG_DIALOG_DIRECTION 3

    # IP used in Rx_AAR_Register - IP of this P-CSCF, to be used in the flow for the AF-signaling
    #!define RX_AF_SIGNALING_IP "@{pcscf-ip}"
    # Uncomment the below line only when UE is behind double NAT (e.g. VoIP calling over WiFi/ CN behind a NAT)
    ##!define RX_AF_SIGNALING_IP "@{pcscf-ip}"


    # IP and Port for incoming requests over N5 from 5G Core
    #!substdef "/N5_BIND_IP/@{pcscf-ip}/g"
    #!substdef "/N5_BIND_PORT/7777/g"

    # SCP IP and Port for NF registration and heartbeat
    #!substdef "/SCP_BIND_IP/127.0.0.1/g"
    #!substdef "/SCP_BIND_PORT/7777/g"

    alias=pcscf.@{ims-domain}

    #!define MY_WS_PORT 80
    #!define MY_WSS_PORT 443

    #!define PCSCF_URL "sip:pcscf.@{ims-domain}:5060"

    #!define TCP_PROCESSES 8

    # Maximum lifetime of a UE registration in seconds (same is advertised to UE)
    #!substdef "/UE_REGISTRATION_EXPIRES/3600/g"

    #!subst "/NETWORKNAME/@{ims-domain}/g"
    #!subst "/HOSTNAME/pcscf.@{ims-domain}/g"
    #!subst "/PCRF_REALM/epc.mnc001.mcc001.3gppnetwork.org/g"

    # SIP-Address of capturing node, if not set, capturing is disabled.
    ##!define CAPTURE_NODE "sip:127.0.0.1:9060"

    # Allowed IPs for XML-RPC-Queries
    ##!define XMLRPC_WHITELIST_1 "127.0.0.1"
    ##!define XMLRPC_WHITELIST_2 "127.0.0.1"
    ##!define XMLRPC_WHITELIST_3 "127.0.0.1"

    # Databases:
    #!define DB_URL "mysql://pcscf:@{kamailio-password}@@{core-worker-ip}/pcscf"
    ##!define DB_URL2 "con2=>mysql://pcscf:@{kamailio-password}@@{core-worker-ip}/pcscf"

    #!define SQLOPS_DBURL "pcscf=>mysql://pcscf:@{kamailio-password}@@{core-worker-ip}/pcscf"

    #! Optional: Server-URL for Websocket-Requests
    ##!define WEBSOCKET_WEBSERVER "phone.ng-voice.com"

    ##!define TRF_FUNCTION "trf.@{ims-domain}"

    #
    # Several features can be enabled using '#!define WITH_FEATURE' directives:
    #
    # *** To run in debug mode:
    #     - define WITH_DEBUG
    #
    # *** To enable nat traversal execute:
    #     - define WITH_NAT
    #     - define the connection to the RTP-Proxy: RTPPROXY_ADDRESS
    #
    # *** To force alls calls through the RTP-Proxy
    #     - this will automagically enable NAT-Traversal
    #     - define FORCE_RTPRELAY
    #
    # *** To enable IPv4/IPv6 Translation (RTPProxy)
    #     - this will automagically enable NAT-Traversal
    #     - define WITH_RTPIPV4
    #
    # *** To enable TCP support execute:
    #     - define WITH_TCP
    #
    # *** To enable TLS support execute:
    #     - adjust CFGDIR/tls.cfg as needed
    #     - define WITH_TLS
    #     - this will automagically enable TCP
    #
    # *** To enable XMLRPC support execute:
    #     - define WITH_XMLRPC
    #     - this will automagically enable TCP
    #
    # *** To enable anti-flood detection execute:
    #     - adjust pike and htable=>ipban settings as needed (default is
    #       block if more than 16 requests in 2 seconds and ban for 300 seconds)
    #     - define WITH_ANTIFLOOD
    #
    # *** To enable the Rx-Interface:
    #     - Configure Rx-Diameter-Interface in pcscf.xml
    #     - define WITH_RX
    #
    # *** To enable a Homer SIP-Capter-Node:
    #     - define CAPTURE_NODE with a proper address
    #
    # *** To enable support for the SEMS-SBC
    #     - define WITH_SBC
    #     - configure dispatcher-list with a set of SBC's

    #
    # Enabled Features for this host:
    ##!define WITH_DEBUG
    ##!define WITH_DEBUG_TRACE
    #!define WITH_NAT
    ##!define WITH_NATPING
    #!define FORCE_RTPRELAY
    ##!define WITH_TLS
    ##!define WITH_XMLRPC
    ##!define WITH_IPBLOCK
    ##!define WITH_ANTIFLOOD
    ##!define WITH_RX
    ##!define WITH_N5
    #!define WITH_TCP
    ##!define WITH_RTPIPV4
    ##!define WITH_SBC
    ##!define WITH_SBC_CALL
    ##!define WITH_REGINFO
    ##!define WITH_RTPPING
    ##!define WITH_WEBSOCKET
    ##!define WITH_IPSEC
    #!define WITH_IMS_HDR_CACHE
    ##!define WITH_PING_UDP
    ##!define WITH_PING_TCP
  dispatcher.list: |
    # SBC's
  sems__sems.conf: |+
    # $Id$
    #
    # sems.conf.sample
    #
    # Sip Express Media Server (sems)
    #
    # sample configuration file
    #
    #
    # whitespaces (spaces and tabs) are ignored
    # comments start with a "#" and may be used inline
    #
    # example: option=value # i like this option
    #
    # @filename includes mod_config_path/filename
    # @/absolute/path/to/file includes file

    ############################################################
    # Network configuration

    # optional parameter: media_ip=<ip_address>|<device>
    #
    # - this informs SEMS about the IP address or interface that
    #   SEMS uses to send and receive media.
    # - If neither 'media_ip' nor 'sip_ip' are set, defaults
    #   to first non-loopback interface. If 'sip_ip' is set,
    #   'media_ip' defaults to 'sip_ip.
    #
    # Examples:
    #  media_ip=10.0.0.34
    #  media_ip=eth0

    #media_ip=eth0
    media_ip=109.239.57.200

    # optional parameter: sip_ip=<ip_address>|<device>
    #
    # - this informs SEMS about the SIP IP where its SIP stack is
    #   bound to or should be bound to. This also sets
    #   the value used for contact header in outgoing calls and
    #   registrations.
    # - If neither 'media_ip' nor 'sip_ip' are set, defaults
    #   to first non-loopback interface. If 'media_ip' is set,
    #   'sip_ip' defaults to 'media_ip.
    #
    # Example:
    #  sip_ip=10.0.0.34
    #  sip_ip=en0
    #

    sip_ip=127.0.0.1

    # optional parameter: public_ip=<ip_address>
    #
    # - when running SEMS behind certain simple NAT configurations,
    #   you can use this parameter to inform SEMS of its public IP
    #   address. If this parameter is set, SEMS will write this value
    #   into SDP bodies.
    #   If this parameter is not set, the local IP address is used.
    #   N.B., there is no support for port translation; the local
    #   RTP port is advertised in SDP in either case.
    #
    # Example:
    #  public_ip=75.101.219.48
    #

    # optional parameter: sip_port=<port_number>
    #
    # - this informs SEMS about the port where its SIP stack is
    #   bound to or should be bound to. SEMS needs this information
    #   to correctly set the contact header in outgoing calls
    #   and registrations. Should be set to equal the 'port'
    #   configuration option in ser_sems.cfg.
    #
    #   default: 5060
    #
    sip_port=5080

    # optional parameter: outbound_proxy=uri
    #
    # - this sets an outbound proxy for calls and registrations initiated
    #   by SEMS. This does not apply to requests in a dialog that
    #   is initiated by someone else and incoming to SEMS.
    #   If this is not set (default setting), then for dialogs
    #   initiated by SEMS the r-uri is resolved and the request
    #   is sent there directly.
    #   This is resolved by the SIP stack with DNS if a name is given.
    #   Warning: If the value set here can not be resolved, no
    #            requests will be sent out at all!
    #
    #   default: empty
    #
    # Example:
    #   outbound_proxy=sip:proxy.mydomain.net

    # optional parameter: force_outbound_proxy={yes|no}
    #
    # - forces SEMS to send any request to the outbound proxy in any
    #   situation, by adding an extra first Route to the outbound_proxy.
    #   This option will only have an effect if the outbound_proxy
    #   option has been set, and it will break 3261 compatibility
    #   in some cases; better use next_hop_ip/next_hop_port.
    #
    #   default: no
    #
    # Example:
    #   force_outbound_proxy=yes

    # optional parameter: next_hop_ip
    # - if this is set, all outgoing requests will be sent to
    #   this IP, regardless of R-URI etc.
    #

    # optional parameter: next_hop_port
    # defaults to 5060
    #next_hop_port=5060

    # optional parameter:next_hop_for_replies
    # - use next_hop for replies, too?
    #
    #next_hop_for_replies=yes

    # optional parameter: rtp_low_port=<port>
    #
    # - sets lowest for RTP used port
    rtp_low_port=10000

    # optional parameter: rtp_high_port=<port>
    #
    # - sets highest for RTP used port
    rtp_high_port=19999

    # Additional IFs (optional):
    #   additional_interfaces = <list of interfaces>
    #
    # additional_interfaces must be set if more than one
    # interface is to be used for the same purpose (e.g.
    # more than one interface for SIP). Configure additional
    # interfaces if networks should be bridged or separate
    # networks should be served.
    #
    # For each additional interface, a set of parameters
    # suffixed with the interface name should be listed
    # with the 'additional_interfaces' parameter.
    #
    # Please note that for each additional interface,
    # 'sip_ip_[if_name]' is mandatory. The other
    # parameters are optional. 'media_ip_[if_name]'
    # is derived from 'sip_ip_[if_name]' if not set.
    # 'public_ip_[ip_name]' is also based on 'sip_ip_[if_name]'
    # if not set explicitly.
    #
    # Example:
    #  additional_interfaces=intern,extern
    #
    #  sip_port_intern=5060
    #  rtp_low_port_intern=2000
    #  rtp_high_port_intern=5000
    #
    #  sip_ip_extern=213.192.59.73
    #  sip_port_extern=5060
    #  media_ip_extern=213.192.59.73
    #  rtp_low_port_extern=2000
    #  rtp_high_port_extern=5000
    #  public_ip_extern=213.192.35.73
    #

    ############################################################
    # modules and application configuration
    #
    # Configuration of plugin (module) loading:
    # - if load_plugins is set, only those are loaded.
    # - if load_plugins is not set, all modules in the plugin_path
    #   directory are loaded, except those which are listed
    #   in exclude_plugins.
    #

    # optional parameter: plugin_path=<path>
    #
    # - sets the path to the plug-ins' binaries
    # - may be absolute or relative to CWD
    plugin_path=/usr/lib/sems/plug-in/

    # optional parameter: load_plugins=<modules list>
    #
    # semicolon-separated list of modules to load.
    # If empty, all modules in plugin_path are loaded.
    #
    # example for announcement with only g711 and ilbc codecs
    # load_plugins=wav;ilbc;announcement
    load_plugins=wav;gsm;isac;ilbc;xmlrpc2di;monitoring;stats;uac_auth;session_timer;sbc

    # optional parameter: exclude_plugins=<modules list>
    #
    # semicolon-separated list of modules to exclude from loading
    # ('blacklist'). If empty, all modules in plugin_path are loaded.
    # This has only effect it load_plugins is not set.
    #
    # o precoded_announce: no precoded sample files present
    # o py_sems: conflicts with ivr (in some cases)
    exclude_plugins=precoded_announce;py_sems

    # optional parameter: application
    #
    # This controls which application is to be executed if there
    # is no explicit application requested from the SIP stack
    # (i.e. unixsockctrl and second parameter of t_write_unix).
    #
    # This can be one of
    #    $(ruri.user)       - user part of ruri is taken as application,
    #                         e.g. sip:announcement@host
    #    $(ruri.param)      - uri parameter "app", e.g.
    #                         sip:joe@host.net;app=announcement
    #    $(apphdr)          - the value of the P-App-Name header is used
    #
    #    $(mapping)         - regex=>application mapping is read from
    #                         app_mapping.conf (see app_mapping.conf)
    #    <application name> - application name configured here, e.g.
    #                         application=announcement
    #
    # examples:
    # application = conference
    # application = $(mapping)
    # application = $(ruri.user)
    # application = $(ruri.param)
    application = sbc

    # parameter: plugin_config_path=<path>
    #
    # - in this path configuration files of the applications
    #   (e.g. announcement.conf) are searched
    plugin_config_path=/etc/sems/etc/

    # optional parameter: exclude_payloads=<payload list>
    #
    # semicolon-separated list of payloads to exclude from loading
    # ('blacklist').
    #
    # For example, to only use low bandwidth codecs:
    #  exclude_payloads=PCMU;PCMA;G726-40;G726-32;G721;L16
    # or, to use only codecs which are not CPU-intensive:
    #  exclude_payloads=iLBC;speex;
    # only use G711 (exclude everything else):
    #  exclude_payloads=iLBC;speex;G726-40;G726-32;G721;G726-24;G726-16;GSM;L16

    ############################################################
    # logging and running

    # optional parameter: fork={yes|no}
    #
    # - specifies if sems should run in daemon mode (background)
    #   (fork=no is the same as -E)
    fork=yes

    # optional parameter: stderr={yes|no}
    #
    # - debug mode: do not fork and log to stderr
    #   (stderr=yes is the same as -E)
    stderr=no

    # optional parameter: loglevel={0|1|2|3}
    #
    # - sets log level (error=0, warning=1, info=2, debug=3)
    #   (same as -D)
    loglevel=1

    # optional parameter: syslog_facility={DAEMON|USER|LOCAL[0-7]}
    #
    # - sets the log facility that is used for syslog. Using this,
    #   the log can for example be filtered into a special file
    #   by the syslog daemon.
    #
    # Default: DAEMON
    #
    # Example:
    # syslog_facility=LOCAL0

    # optional parameter: log_sessions=[yes|no]
    #
    # Default: no
    #
    # If log_sessions=yes is set, INFO level log messages are generated
    # for each session when it is started and stopped.
    #
    # log_sessions=yes

    # optional parameter: log_events=[yes|no]
    #
    # Default: no
    #
    # If log_eventy=yes is set, generic DBG level log messages are
    # generated for each event that is posted into an event queue.
    #
    # log_events=yes

    # optional parameter: max_shutdown_time=<time in seconds>
    #
    # Limit on server shutdown time (time to send/resend BYE
    # to active calls). 0 to disable (infinite).
    #
    # Default: 10
    #
    max_shutdown_time = 60

    # optional parameter: shutdown_mode_reply="<code> <reason>"
    #
    # Error reply that is used as reply to INVITE and OPTION
    # when SEMS is shutting down.
    #
    # Default: shutdown_mode_reply="503 Server shutting down"


    ############################################################
    # tuning

    # optional parameter: session_processor_threads=<num_value>
    #
    # - controls how many threads should be created that
    #   process the application logic and in-dialog signaling.
    #   This is only available if compiled with threadpool support!
    #   (set USE_THREADPOOL in Makefile.defs)
    #   Defaults to 10
    #
    # session_processor_threads=50

    # optional parameter: media_processor_threads=<num_value>
    #
    # - controls how many threads should be created that
    #   process media - on single-processor systems set this
    #   parameter to 1 (default), on MP systems to a higher
    #   value
    #
    # media_processor_threads=1


    # optional parameter: session_limit=<limit>;<err code>;<err reason>
    #
    # - this sets a maximum active session limit. If that limit is
    #   reached, no further calls are accepted, but the error reply
    #   with err code/err reason is sent out.
    #
    # Default: 0 (None)
    #
    # Example:
    #  session_limit="1000;503;Server overload"

    # optional parameter: options_session_limit=<limit>;<err code>;<err reason>
    #
    # - this sets a custom response to OPTIONS, if the session count reaches
    #   a certain limit. This way health monitor could raise an alarm to syste
    #   administrator.
    #
    # Default: 0 (None)
    #
    # Example:
    #  options_session_limit="900;503;Warning, server soon overloaded"


    # optional parameter: dead_rtp_time=<unsigned int>
    #
    # - if != 0, after this time (in seconds) of no RTP
    #   a session is considered dead and stopped. If set
    #   to 0 no check is done for rtp timeout.
    #
    #   default=300 (5 minutes)
    #
    # Examples:
    #    # disable RTP timeout
    #    dead_rtp_time=0
    #    # RTP timeout after 10 seconds
    #    dead_rtp_time=10

    # optional parameter: use_default_signature={yes|no}
    #
    # - use a Server/User-Agent header with the SEMS server
    #   signature and version.
    #   Set server_signature=0 in ser_sems.cfg if you use SER
    #   as SIP stack.
    #
    #   default=no
    #
    use_default_signature=yes

    # optional parameter: signature=<signature string>
    #
    # - use a Server/User-Agent header with a custom user agent
    #   signature.
    #   Overridden by default signature if
    #   use_default_signature is set.
    #   Set server_signature=0 in ser_sems.cfg if you use it.
    #
    #
    # signature="SEMS media server 1.0"

    # optional parameter: single_codec_in_ok={yes|no}
    #
    # - use single codec in 200 OK response
    #
    #   default=no
    #
    # single_codec_in_ok=no

    # optional parameter: codec_order=codec_name_1,codec_name2,...
    #
    # - Codec order used when sending INVITE requests.  Codecs in codec_order
    #   will be on the top of the list followed by other supported codecs
    #   (if any).
    #
    #   default=empty
    #
    # codec_order=iLBC,GSM

    # optional parameter: ignore_rtpxheaders={yes|no}
    #
    # - if this is set to yes, RTP extension headers (e.g. when using ZRTP)
    #   are ignored. If set to no, the whole RTP packets with extension
    #   headers will be ignored and a debug message is printed on every
    #   received packet.
    #
    #   default=no
    #
    # ignore_rtpxheaders=yes

    # optional parameter: dtmf_detector={spandsp|internal}
    #
    # sets inband DTMF detector to use. spandsp support must be compiled in
    # for this to have effect if dtmf_detector=spandsp.
    #
    # default: internal
    #
    # dtmf_detector=spandsp

    # optional parameter: wait_for_bye_transaction={yes|no}
    #
    # when SEMS stops a call sending BYE as UAC, this option sets whether
    # SEMS waits for the BYE transaction to finish before forgetting the call.
    # This may be necessary e.g. to authenticate the BYE request.
    #
    # default: no
    #
    # wait_for_bye_transaction=yes

    # optional parameter: unhandled_reply_loglevel={error|warn|info|debug|no}
    #
    # the default application logic implemented in the applications is to stop
    # the session right after sending BYE, without waiting for a reply. this
    # leads to many log entries of the form
    # ERROR: [b6fa6bb0] handleSipMsg (AmSipDispatcher.cpp:48): unhandled
    #    reply:  [code:200;phrase:[OK];... ]
    #
    # This parameter sets the log lovel of unhandled positive (200 class) replies.
    #
    # default: error
    #
    # unhandled_reply_loglevel=info

    ############################################################
    # SIP stack settings
    #   default settings (i.e. leave out) for these should be OK
    #   for most applications

    # skip DNS SRV lookup? [yes, no]
    #
    # according to RFC, if no port is specified, destination IP address
    # should be resolved with a DNS SRV lookup. If SEMS should not do that
    # (only an A record lookup), set disable_dns_srv=yes.
    #
    # Default: no
    #
    #disable_dns_srv=yes

    # support 100rel (PRACK) extension (RFC3262)? [disabled|supported|require]
    #
    # disabled - disable support for 100rel
    # supported - support it if remote end does, default
    # require - required
    #
    # Default: supported
    #
    #100rel=require

    # Make SIP authenticated requests sticky to the proxy? [yes | no]
    #
    # If enabled, host of request-URI of out-of-dialog requests that are
    # authenticated with SIP auth is changed to the previously resolved
    # next-hop IP:port.
    #
    # default: no
    #
    # proxy_sticky_auth=yes

    #
    # Accept final replies without To-tag? [yes|no]
    #
    #accept_fr_without_totag=yes

    #
    # Log raw messages?  [no|debug|info|warn|error]
    #
    # Default: debug
    #
    #log_raw_messages=no

    #
    # Log parsed received messages?  [yes|no]
    #
    # Default: yes
    #
    #log_parsed_messages=no

    # SIP UDP socket receive buffer size (in bytes)
    #
    # if not set, system default is used (which usually
    # is modest). set sytem wide upper limit with
    # e.g. sysctl -w net.core.rmem_max=8388608
    #
    # udp_rcvbuf = <value>

    # Number of SIP UDP receiver threads
    #
    # Default: 4
    #
    # sip_server_threads=8

    #
    # accept forked dialogs on UAS side? [yes|no]
    #
    #  no - INVITE with existing callid+remote_tag is replied with 482.
    # yes - INVITE with existing callid+remote_tag+via_branch is replied with 482.
    #       Forked INVITEs (!= via-branch) are accepted.
    #
    # Default: yes
    #
    accept_forked_dialogs=yes

  route__mt.cfg: |
    ######################################################################
    # Terminating, Initial requests
    ######################################################################
    route[MT] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");
        xnotice("Term UE connection information : IP is $dd and Port is $rp \n");
        xnotice("Term P-CSCF connection information : IP is $RAi and Port is $RAp \n");
        set_dlg_profile("term");

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
        t_on_reply("MT_reply");
    }

    ######################################################################
    # Replies to Originating Initial Requests
    ######################################################################
    onreply_route[MT_reply] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");
        if (!strempty($(ct{tobody.params}))) {
                append_hf("C-Params: $(ct{tobody.params})\r\n");
        }

    #!ifdef WITH_N5
        # Terminating N5 AppSession after error response.
        if (status=~"[45][0-9][0-9]") {
                xnotice("Received error response for the call. Going to terminate N5 Session\n");
                route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

        # In case of 1xx and 2xx do NAT
        if(status=~"[12][0-9][0-9]")
                route(NATMANAGE);

        if (t_check_status("180|183|200") && sdp_content()){
                if (t_is_retr_async_reply()) {
                        xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
                        drop();
                }
                $avp(FTAG_CUSTOM_AVP)=$ft;
                $avp(TTAG_CUSTOM_AVP)=$tt;
                $avp(CALLID_CUSTOM_AVP)=$ci;

    #!ifdef WITH_RX
                xlog("L_DBG", "IMS: Received 183 inside term_initial_reply\n");
                xlog("L_DBG","Diameter: Term authorizing media via Rx\n");
                if (Rx_AAR("MT_aar_reply","term","",-1) == 0) {
                        exit;
                }
    #!endif
    #!ifdef WITH_N5
                route(MT_N5_CALL_PCF_POLICY_AUTH);
    #!endif
        }
    }

    #!ifdef WITH_RX
    route[MT_aar_reply]
    {
        xlog("L_DBG", "IMS: TERM_SESSION_AAR_REPLY\n");

        # Check reply AVP since the operation is async
        switch ($avp(s:aar_return_code)) {
                case 1:
                        xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
                        break;
                default:
                        xlog("L_ERR", "IMS: AAR failed Orig\n");
                        xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                        # Comment this if you want to allow even if Rx fails
                        if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                dlg_terminate("all", "Sorry no QoS available");
                                exit;
                        }
        }
    }
    #!endif

    ######################################################################
    # In-Dialog-MT-Requests
    ######################################################################
    route[MT_indialog] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");

    #!ifdef WITH_N5
        # Terminating N5 AppSession after BYE/CANCEL.
        if (is_method("BYE|CANCEL")) {
                xnotice("InDialog Call End/Cancel/Error. Terminating N5 QoS Session\n");
                route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

        t_on_reply("MT_indialog_reply");

        # Append rport only if its a request coming from UE
        if (is_request() && ($hdrc(Via) == 1)) {
                force_rport();
        }

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
    }

    onreply_route[MT_indialog_reply] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");

    #!ifdef WITH_N5
        # Terminating N5 AppSession after error response.
        if (status=~"[45][0-9][0-9]") {
                xnotice("Received error response for the call. Going to terminate N5 Session\n");
                route(MT_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
        # In case of 1xx and 2xx do NAT
        if(status=~"[12][0-9][0-9]")
                route(NATMANAGE);

        if ((t_check_status("180|183|200") && sdp_content() && !is_method("PRACK")) || (is_method("UPDATE"))) {
                if (t_is_retr_async_reply()) {
                        xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
                        drop();
                }
                $avp(FTAG_CUSTOM_AVP)=$ft;
                $avp(TTAG_CUSTOM_AVP)=$tt;
                $avp(CALLID_CUSTOM_AVP)=$ci;

    #!ifdef WITH_RX
                # Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
                xlog("L_DBG", "IMS: TERM_SUBSEQUENT reply. This is a 200 OK to a re-INVITE\n");
                xlog("L_DBG","Diameter: Term authorizing media via Rx\n");
                if (Rx_AAR("MT_indialog_aar_reply","term","",-1) == 0) {
                        exit;
                }
    #!endif
    #!ifdef WITH_N5
                route(MT_N5_CALL_PCF_POLICY_AUTH);
    #!endif
        }
    }

    #!ifdef WITH_RX
    route[MT_indialog_aar_reply]
    {
        # Check reply AVP since the operation is async
        switch ($avp(s:aar_return_code)) {
                case 1:
                        xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
                        break;
                default:
                        xlog("L_ERR", "IMS: AAR failed Orig\n");
                        xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                        # Comment this if you want to allow even if Rx fails
                        if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                dlg_terminate("all", "Sorry no QoS available");
                                exit;
                        }
                }
    }
    #!endif

    #!ifdef WITH_N5
    route[MT_N5_CALL_PCF_POLICY_AUTH] {
        # Send N5 PCF policy authorization only on replies.
        if (!is_reply()) {
                return;
        }
        $var(contact_uri) = $(ct{nameaddr.uri});
        # Callee → Caller.
        if (($fU != $null && is_in_profile("callee", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                $var(contact_uri) = $T_req($(ct{nameaddr.uri}));
        }
        $var(ue_ip) = $(var(contact_uri){uri.host});
        $var(app_session) = 0;
        sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        if ($sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) != $null) {
                $var(app_session) = $sht(ue_ip_to_call_app_session_map=>$var(ue_ip));
                # Update again so that Hash table does not remove the entry upon session timer expiry.
                $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
                sht_lock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
                $sht(mt_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
                sht_unlock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
        }
        sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        # Send N5 PCF policy authorization if SDP body is present.
        if (!sdp_content()) {
                return;
        }
        $var(req_sdp) = $T_req($sdp(body));
        $var(rep_sdp) = $sdp(body);
        xlog("L_INFO","Req SDP: $var(req_sdp)\n");
        xlog("L_INFO","Rep SDP: $var(rep_sdp)\n");

        $var(current_media) = "";
        $var(req_audio_rtp_port) = 0;
        $var(req_audio_rtcp_port) = 0;
        $var(req_video_rtp_port) = 0;
        $var(req_video_rtcp_port) = 0;
        $var(req_audio_rtcp_explicit) = 0;
        $var(req_video_rtcp_explicit) = 0;
        $var(audio_bw_as) = 0;
        $var(video_bw_as) = 0;

        # Split SDP into lines and iterate.
        $var(req_sdp_lines_count) = $(var(req_sdp){line.count});
        $var(req_sdp_line_num) = 0;
        while ($var(req_sdp_line_num) < $var(req_sdp_lines_count)) {
                $var(sdp_line) = $(var(req_sdp){line.at,$var(req_sdp_line_num)});
                # Check for audio media line: "m=audio <port>".
                if ($var(sdp_line) =~ "^m=audio") {
                        $var(current_media) = "audio";
                        $var(req_audio_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for video media line: "m=video <port>".
                else if ($var(sdp_line) =~ "^m=video") {
                        $var(current_media) = "video";
                        $var(req_video_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for explicit RTCP attribute: "a=rtcp:<port>".
                else if ($var(sdp_line) =~ "^a=rtcp:") {
                        if ($var(current_media) == "audio") {
                                $var(req_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(req_audio_rtcp_explicit) = 1;
                        } else if ($var(current_media) == "video") {
                                $var(req_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(req_video_rtcp_explicit) = 1;
                        }
                }
                # Check for bandwidth information.
                else if ($var(sdp_line) =~ "^b=AS:") {
                        if ($var(current_media) == "audio") {
                                $var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
                        } else if ($var(current_media) == "video") {
                                $var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
                        }
                }
                $var(req_sdp_line_num) = $var(req_sdp_line_num) + 1;
        }

        # Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
        if ($var(req_audio_rtcp_explicit) != 1 && $var(req_audio_rtp_port) > 0) {
                $var(req_audio_rtcp_port) = $(var(req_audio_rtp_port){s.int}) + 1;
        }
        if ($var(req_video_rtcp_explicit) != 1 && $var(req_video_rtp_port) > 0) {
                $var(req_video_rtcp_port) = $(var(req_video_rtp_port){s.int}) + 1;
        }

        $var(current_media) = "";
        $var(rep_audio_rtp_port) = 0;
        $var(rep_audio_rtcp_port) = 0;
        $var(rep_video_rtp_port) = 0;
        $var(rep_video_rtcp_port) = 0;
        $var(rep_audio_rtcp_explicit) = 0;
        $var(rep_video_rtcp_explicit) = 0;
        # Split SDP into lines and iterate.
        $var(rep_sdp_lines_count) = $(var(rep_sdp){line.count});
        $var(rep_sdp_line_num) = 0;
        while ($var(rep_sdp_line_num) < $var(rep_sdp_lines_count)) {
                $var(sdp_line) = $(var(rep_sdp){line.at,$var(rep_sdp_line_num)});
                # Check for audio media line: "m=audio <port>".
                if ($var(sdp_line) =~ "^m=audio") {
                        $var(current_media) = "audio";
                        $var(rep_audio_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for video media line: "m=video <port>".
                else if ($var(sdp_line) =~ "^m=video") {
                        $var(current_media) = "video";
                        $var(rep_video_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for explicit RTCP attribute: "a=rtcp:<port>".
                else if ($var(sdp_line) =~ "^a=rtcp:") {
                        if ($var(current_media) == "audio") {
                                $var(rep_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(rep_audio_rtcp_explicit) = 1;
                        } else if ($var(current_media) == "video") {
                                $var(rep_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(rep_video_rtcp_explicit) = 1;
                        }
                }
                # Check for bandwidth information.
                else if ($var(sdp_line) =~ "^b=AS:") {
                        if ($var(current_media) == "audio") {
                                $var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
                        } else if ($var(current_media) == "video") {
                                $var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
                        }
                }
                $var(rep_sdp_line_num) = $var(rep_sdp_line_num) + 1;
        }

        # Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
        if ($var(rep_audio_rtcp_explicit) != 1 && $var(rep_audio_rtp_port) > 0) {
                $var(rep_audio_rtcp_port) = $(var(rep_audio_rtp_port){s.int}) + 1;
        }
        if ($var(rep_video_rtcp_explicit) != 1 && $var(rep_video_rtp_port) > 0) {
                $var(rep_video_rtcp_port) = $(var(rep_video_rtp_port){s.int}) + 1;
        }

        $var(req_sdp_ip) = $(var(req_sdp){line.sw,c=IN}{s.select,2, });
        $var(rep_sdp_ip) = $sdp(c:ip);

        xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio RTP: $var(req_audio_rtp_port), RTCP: $var(req_audio_rtcp_port)\n");
        xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio RTP: $var(rep_audio_rtp_port), RTCP: $var(rep_audio_rtcp_port)\n");
        if ($var(req_video_rtp_port) > 0) {
                xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Video RTP: $var(req_video_rtp_port), RTCP: $var(req_video_rtcp_port)\n");
        } else {
                xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio only (no video)\n");
        }
        if ($var(rep_video_rtp_port) > 0) {
                xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Video RTP: $var(rep_video_rtp_port), RTCP: $var(rep_video_rtcp_port)\n");
        } else {
                xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio only (no video)\n");
        }

        $var(audio_media_component_body) = '"0": {
                "medCompN": 1,
                "medType": "AUDIO",
                "codecs": [
                        "downlink\n0\n",
                        "uplink\n0\n"
                ],
                "medSubComps": {
                        "0": {
                                "fNum": 1,
                                "fDescs": [
                                        "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
                                        "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
                                        "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '",
                                        "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '"
                                ],
                                "fStatus": "ENABLED",
                                "marBwDl": "' + $var(audio_bw_as) + ' Kbps",
                                "marBwUl": "' + $var(audio_bw_as) + ' Kbps",
                                "flowUsage": "NO_INFO"
                        }
                }
        }';
        # Callee → Caller.
        if (($fU != $null && is_in_profile("callee", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                $var(audio_media_component_body) = '"0": {
                        "medCompN": 1,
                        "medType": "AUDIO",
                        "codecs": [
                                "downlink\n0\n",
                                "uplink\n0\n"
                        ],
                        "medSubComps": {
                                "0": {
                                        "fNum": 1,
                                        "fDescs": [
                                                "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
                                                "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
                                                "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '",
                                                "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '"
                                        ],
                                        "fStatus": "ENABLED",
                                        "marBwDl": "' + $var(audio_bw_as) + ' Kbps",
                                        "marBwUl": "' + $var(audio_bw_as) + ' Kbps",
                                        "flowUsage": "NO_INFO"
                                }
                        }
                }';
        }

        $var(video_media_component_body) = "";
        # NOTE: Only if both request and reply SDPs have video media, we consider video for policy authorization and include it in the media components. This is to handle the case where one side doesn't support video and hence doesn't include it in the SDP at all.
        if ($var(req_video_rtp_port) > 0 && $var(rep_video_rtp_port) > 0) {
                $var(video_media_component_body) = '"1": {
                        "medCompN": 2,
                        "medType": "VIDEO",
                        "codecs": [
                                "downlink\n0\n",
                                "uplink\n0\n"
                        ],
                        "medSubComps": {
                                "0": {
                                        "fNum": 2,
                                        "fDescs": [
                                                "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
                                                "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
                                                "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '",
                                                "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '"
                                        ],
                                        "fStatus": "ENABLED",
                                        "marBwDl": "' + $var(video_bw_as) + ' Kbps",
                                        "marBwUl": "' + $var(video_bw_as) + ' Kbps",
                                        "flowUsage": "NO_INFO"
                                }
                        }
                }';
                # Callee → Caller.
                if (($fU != $null && is_in_profile("callee", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                        $var(video_media_component_body) = '"1": {
                                "medCompN": 2,
                                "medType": "VIDEO",
                                "codecs": [
                                        "downlink\n0\n",
                                        "uplink\n0\n"
                                ],
                                "medSubComps": {
                                        "0": {
                                                "fNum": 2,
                                                "fDescs": [
                                                        "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
                                                        "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
                                                        "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '",
                                                        "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '"
                                                ],
                                                "fStatus": "ENABLED",
                                                "marBwDl": "' + $var(video_bw_as) + ' Kbps",
                                                "marBwUl": "' + $var(video_bw_as) + ' Kbps",
                                                "flowUsage": "NO_INFO"
                                        }
                                }
                        }';
                }
        }

        $var(media_components_body) = "";
        if ($var(video_media_component_body) != "") {
                $var(media_components_body) = $var(audio_media_component_body) + "," + $var(video_media_component_body);
        } else {
                $var(media_components_body) = $var(audio_media_component_body);
        }

        $var(ue_policy_authorization_body) = '{
                "ascReqData": {
                        "afAppId": "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
                        "dnn": "ims",
                        "medComponents": { ' + $var(media_components_body) + ' },
                        "evSubsc": {
                                "events": [
                                        {
                                                "event": "QOS_NOTIF",
                                                "notifMethod": "PERIODIC"
                                        },
                                        {
                                                "event": "ANI_REPORT",
                                                "notifMethod": "ONE_TIME"
                                        }
                                ]
                        },
                        "notifUri": "http://N5_BIND_IP:N5_BIND_PORT",
                        "sponStatus": "SPONSOR_DISABLED",
                        "gpsi": "msisdn-' + $fU + '",
                        "suppFeat": "2",
                        "ueIpv4": "' + $var(ue_ip) + '"
                }
        }';
        jansson_append("obj", "", "$var(ue_policy_authorization_body)", "$var(ue_policy_authorization_json_body)");

        xlog("L_DBG", "Constructed UE policy authorization body: $var(ue_policy_authorization_json_body)\n");

        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        if ($var(app_session) > 0) {
                xnotice("MT - N5 QoS Auth session already exists for UE with IP $var(ue_ip) so sending a patch request\n");

                # Set HTTP2 request headers.
                $var(headers) = "Content-Type: application/merge-patch+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");
                switch ($rc) {
                        # Success case.
                        case 200:
                                xlog("L_INFO", "N5 QoS Session modification successfully updated. Reason code: $rc\n");
                                xlog("L_INFO", "HTTP results: $var(result)\n");
                                xlog("L_INFO", "HTTP response: $rc\n");
                                xlog("L_INFO", "cURL Response: $curlerror(error)\n");
                                xlog("L_INFO", "Location Header header: $httprhdr(location)\n");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session modification failed for UE with IP $var(ue_ip). Reason code: $rc\n");
                                xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                                # Comment this if you want to allow even if authorization fails.
                                if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                        dlg_terminate("all", "N5 QoS authorization (modification) failed for call");
                                } else {
                                        send_reply("412", "N5 QoS authorization (modification) failed for call");
                                }
                                exit;
                }
        } else {
                xlog("L_INFO","MT - Creating N5 QoS Auth session for UE with IP $var(ue_ip)\n");

                $var(headers) = "Content-Type: application/json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                xlog("L_INFO","SIP Call. Sending N5 QoS Auth for $fu to PCF\n");
                # Send the request to PCF.
                http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)" );

                switch ($rc) {
                        # Success case.
                        case 201:
                                xlog("L_INFO", "N5 QoS Session successfully created $rc\n");
                                xlog("L_INFO", "HTTP results: [$var(result)]\n");
                                xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
                                xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

                                # Retrieve the AppSession Id out of the location Header if the resopnse is 201.
                                # Example URL: "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/(someSessionID)"

                                # Extract the AppSession Id.
                                $var(response_url) = $httprhdr(location);
                                $var(response_url) = $(var(response_url){s.trim});
                                $var(app_session) = $(var(response_url){s.select,-1,/});

                                # Store the AppSession Id in the hash table associated with the IP address in the last Via SIP header.
                                sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
                                $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
                                sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
                                # Store the AppSession Id in the hash table associated with the dialog Call-Id.
                                sht_lock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
                                $sht(mt_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
                                sht_unlock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
                                xlog("L_INFO", "Stored call AppSession Id for IP $var(ue_ip) is $var(app_session)\n");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session authorization failed for UE with IP $var(ue_ip). Reason code: $rc\n");
                                xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                                # Comment this if you want to allow even if authorization fails.
                                if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                        dlg_terminate("all", "N5 QoS authorization failed for call");
                                } else {
                                        send_reply("412", "N5 QoS authorization failed for call");
                                }
                                exit;
                }
        }
    }

    route[MT_N5_CALL_PCF_POLICY_AUTH_DELETE] {
        # Retrieve the AppSession Id from the hash table.
        sht_lock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
        if ($sht(mt_call_id_to_call_app_session_and_ue_ip_map=>$ci) == $null) {
                xlog("L_WARN", "No call AppSession found for Call-Id $ci\n");
                sht_unlock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
                return;
        }
        $var(app_session_and_ue_ip) = $sht(mt_call_id_to_call_app_session_and_ue_ip_map=>$ci);
        sht_unlock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
        $var(app_session) = $(var(app_session_and_ue_ip){s.select,0,;});
        $var(ue_ip) = $(var(app_session_and_ue_ip){s.select,1,;});

        xlog("L_INFO", "Terminating AppSession with Id $var(app_session) for UE with IP $var(ue_ip) due to call end\n");

        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        $var(headers) = "X-SIP-Status: Call-End-MT\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
        $var(headers) = $var(headers) + "accept: application/json\r\n";
        $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

        $var(json_request) = "";

        http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)/delete", "$var(json_request)", "$var(headers)", "$var(result)");
        xlog("L_INFO", "CURL error: [$curlerror(error)]\n");
        xlog("L_INFO", "HTTP results: [$var(result)]\n");
        xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
        xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

        # Clear hashtable content irrespective of the response from PCF/IMS as the call has ended.
        sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $null;
        sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        sht_lock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
        $sht(mt_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $null;
        sht_unlock("mt_call_id_to_call_app_session_and_ue_ip_map=>mt_call_id_to_call_app_session_and_ue_ip_map_lock");
    }
    #!endif
  route__rtp.cfg: |+
    # RTPProxy control
    route[ENC_SRTP] {
        add_rr_param(";rm=1");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=force SRTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
    }

    route[DEC_SRTP] {
        add_rr_param(";rm=2");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=force SRTP AVP";
    }

    route[ENC_WS_RTP] {
        add_rr_param(";rm=3");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=force RTP AVPF";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
    }

    route[DEC_WS_RTP] {
        add_rr_param(";rm=4");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=force RTP AVPF";
    }

    route[ENC_WSS_RTP] {
        add_rr_param(";rm=5");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=force SRTP AVPF DTLS=passive";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
    }

    route[DEC_WSS_RTP] {
        add_rr_param(";rm=6");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=force SRTP AVPF DTLS=passive";
    }

    route[ENC_RTP] {
        add_rr_param(";rm=7");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=force RTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
    }

    route[DEC_RTP] {
        add_rr_param(";rm=8");
        $avp(rtpproxy_offer_flags) = "replace-origin replace-session-connection ICE=remove RTP AVP";
        $avp(rtpproxy_answer_flags) = "replace-origin replace-session-connection ICE=force RTP AVP";
    }

    # RTPProxy control
    route[NATMANAGE] {
        if (is_request())
                xnotice("REQUEST: $rm $ru ($si:$sp, $ci)\n");
        else
                xnotice("REPLY: $rs $rr ($rm, $si:$sp, $ci)\n");

        if (is_direction("downstream"))
                xnotice("    downstream\n");
        else
                xnotice("    upstream\n");

        xnotice("    Offer: $avp(rtpproxy_offer_flags)\n");
        xnotice("    Answer: $avp(rtpproxy_answer_flags)\n");
        if (isflagset(FLT_MOBILE_ORIG)) {
                xnotice("    mo\n");
        } else {
                xnotice("    mt\n");
        }
        if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
                #if((is_request() && !check_route_param("rm=")) || (is_reply() && !isflagset(FLT_RTP))) {
                if(!check_route_param("rm=") && !isflagset(FLT_RTP)) {
                        xnotice("No RM Param\n");
                        return;
                }
                if (($fU != $null && is_in_profile("caller", "$fU")) ||
                        ($tU != $null && is_in_profile("callee", "$tU"))) {
                        # In-Dialog Request from MO side
                        if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
                                add_contact_alias();
                        } else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
                                add_contact_alias();
                        }
                } else if (($fU != $null && is_in_profile("callee", "$fU")) ||
                        ($tU != $null && is_in_profile("caller", "$tU"))) {
                        # In-Dialog Request from MT side
                        if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
                                add_contact_alias();
                        } else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
                                add_contact_alias();
                        }
                }
        } else {
                if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
                        xlog("L_DBG", "3) ADD_contact_alias();");
                        add_contact_alias();
                }
        }

        if (isflagset(FLT_MOBILE_ORIG)) {
                $avp(setid) = 1;
                $avp(extra_id) = "mo";
        } else {
                $avp(setid) = 1;
    #		$avp(setid) = 2;
                $avp(extra_id) = "mt";
        }

        if(!t_is_set("onreply_route")) t_on_reply("NAT_REPLY");
        if(!t_is_set("failure_route")) t_on_failure("NATMANAGE");

        if (is_method("BYE") || t_is_failure_route()) {
                rtpengine_manage();
                return;
        }

        setflag(FLT_RTP);

        if (!sdp_content()) {
                xnotice("No SDP body, skipping RTP handling\n");
                return;
        }

    #!ifdef REMOVE_BITALIGNED_AMR
        route(REMOVE_BITALIGNED);
    #!endif

    #!ifndef FORCE_RTPRELAY
        if (!isflagset(FLT_NAT) || !check_route_param("rm="))
                return;
    #!endif

        # Fix for calling between UEs not supporting preconditioning
        if(sdp_get_line_startswith("$avp(mline)", "a=inactive")) {
                xnotice("m-line: $avp(mline)\n");
                sdp_iterator_start("mlineit");
                while(sdp_iterator_next("mlineit")) {
                        if($sdpitval(mlineit) =~ "a=inactive") {
                                sdp_iterator_rm("mlineit");
                                sdp_iterator_append("mlineit", "a=sendrecv\r\n");
                                break;
                        }
                }
                sdp_iterator_end("mlineit");
                msg_apply_changes();
        }

        if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
                if (($fU != $null && is_in_profile("caller", "$fU")) ||
                        ($tU != $null && is_in_profile("callee", "$tU"))) {
                        # In-Dialog Request from MO side
                        if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
                                rtpengine_manage();
                        } else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
                                rtpengine_manage();
                        }
                } else if (($fU != $null && is_in_profile("callee", "$fU")) ||
                        ($tU != $null && is_in_profile("caller", "$tU"))) {
                        # In-Dialog Request from MT side
                        if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
                                rtpengine_manage();
                        } else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
                                rtpengine_manage();
                        }
                }
        } else {
                # Initial Requests
                if ($avp(rtpproxy_offer_flags) == $null)
                        return;
                if ($avp(rtpproxy_answer_flags) == $null)
                        return;

                if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
                        xnotice("Handling RTP for initial request from $fU on mo side\n");
                        set_dlg_profile("caller", "$fU");
                        rtpengine_manage($avp(rtpproxy_offer_flags));
                } else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
                        xnotice("Handling RTP for initial reply from $tU on mt side\n");
                        set_dlg_profile("callee", "$tU");
                        rtpengine_manage($avp(rtpproxy_answer_flags));
                } else if (is_reply() && isflagset(FLT_MOBILE_ORIG) && ($sdp(c:ip) != "@{rtpengine-ip}") && !($ct =~ ".*g.3gpp.*")) {
                        # TODO: Handle calling between a SIP client and VoLTE/VoNR UE
                        xlog("L_INFO", "RTPEngine engaged for Application Server\n");
                        set_dlg_profile("as", "$fU");
                        rtpengine_manage($avp(rtpproxy_offer_flags));
                        msg_apply_changes();
                }
        }
    }

    # manage incoming replies
    onreply_route[NAT_REPLY] {
        # In case of 1xx and 2xx do NAT
        if(status=~"[12][0-9][0-9]")
                route(NATMANAGE);
    }

    route[REMOVE_BITALIGNED] {
        if (sdp_get_line_startswith("$avp(mline)", "m=")) {
                # xlog("m-line: $avp(mline)\n");
                sdp_get("$avp(sdp)");
                # xlog("\n$avp(sdp)\n");
                $var(x) = -1;
                $var(remove) = "";
                $var(codec) = $(avp(mline){s.select,$var(x), });
                # xlog("$$var(codec) => $var(codec)\n");
                while ($(var(codec){s.int}) > 0) {
                        # xlog("$var(x)) $$var(codec) => $var(codec)\n");
                        $var(s) = "a=fmtp:"+$var(codec);
                        # xlog("$$var(s) => $var(s)\n");
                        $var(fmtp) = $(avp(sdp){line.sw,$var(s)});
                        # xlog("$$var(fmtp) => $var(fmtp)\n");
                        if ($var(fmtp) =~ "a=fmtp:"+$var(codec)+" mode-change-capability.*") {
                                # xlog("Match: $var(codec)\n");
                                if ($var(remove) == "") {
                                        $var(remove) = $var(codec);
                                } else {
                                        $var(remove) = $var(remove)+","+$var(codec);
                                }
                        }
                        $var(codec) = $(avp(mline){s.select,$var(x), });
                        $var(x) = $var(x) - 1;
                }
                # xlog("$$var(remove) => $var(remove)\n");
                if ($var(remove) != "") {
                        sdp_remove_codecs_by_id($var(remove), "audio");
                        msg_apply_changes();
                }
        }
    }

  route__xmlrpc.cfg: |+
    # XMLRPC routing
    route[XMLRPC] {
        # allow XMLRPC from localhost
        if ((method=="POST" || method=="GET")
    #!ifdef XMLRPC_WHITELIST_1
    && ((src_ip == XMLRPC_WHITELIST_1)
    #!ifdef XMLRPC_WHITELIST_2
     || (src_ip == XMLRPC_WHITELIST_2)
    #!endif
    #!ifdef XMLRPC_WHITELIST_3
     || (src_ip == XMLRPC_WHITELIST_3)
    #!endif
    )
    #!endif
    ) {
                # close connection only for xmlrpclib user agents (there is a bug in
                # xmlrpclib: it waits for EOF before interpreting the response).
                if ($hdr(User-Agent) =~ "xmlrpclib")
                        set_reply_close();
                set_reply_no_connect();
                dispatch_rpc();
                exit;
        }
        send_reply("403", "Forbidden");
        exit;
    }

  route__register.cfg: |
    ######################################################################
    # Route for handling Registrations:
    ######################################################################
    route[REGISTER] {
        # Provide some statistics
        if ($sht(a=>$ci::start_time) == $null || $sht(a=>$ci::start_time) == 0) {
                $sht(a=>$ci::start_time) = $TV(Sn);
        }
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Contact header: $ct\n");

        # Strip Transport from RURI:
        $ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});

        if (is_present_hf("Contact")) {
                pcscf_save_pending("pcscf_location");
        } else {
                send_reply("403", "No contact header");
                exit;
        }

    #!ifdef WITH_N5
        $var(reg_exp) = $expires(min);
        xlog("L_INFO","Expires for $fu is $var(reg_exp)\n");
        if ($expires(min) == 0) {
                xlog("L_INFO","Delete N5 App session for $fu due to de-register from UE\n");
                route(N5_REG_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

        # Strip additional Tags from RURI:
        if ($rU == $null)
                $ru = "sip:"+$rd;
        else
                $ru = "sip:"+$rU+"@"+$rd;

    #!ifdef WITH_RX
        if ($expires(min) != 0) {
                xlog("L_DBG","Subscribing to signalling bearer status\n");

                Rx_AAR_Register("REG_AAR_REPLY", "pcscf_location");
                switch ($retcode) {
                        case -1:
                                # There was an error sending the AAR-Request:
                                xlog("L_ERR", "Diameter: AAR failed on subscription to signalling\n");
                                send_reply("403", "Can't register to QoS for signalling");
                                exit;
                                break;
                        case 0:
                                # We are waiting for an async reply, just exit here.
                                exit;
                                break;
                        case 1:
                                # We did not need to send AAR, so just continue as normal
                                route(REGISTER_CONTINUE);
                                break;
                }
        } else {
                # Proceed with Registering:
                route(REGISTER_CONTINUE);
        }
        exit;
    }

    route[REG_AAR_REPLY] {
        switch ($avp(s:aar_return_code)) {
                case 1:
                        xlog("L_DBG", "Diameter: AAR success on subscription to signalling\n");
                        break;
                default:
                        xlog("L_ERR", "Diameter: AAR failed on subscription to signalling\n");
                        send_reply("403", "Can't register to QoS for signalling");
                        exit;
        }
        # Proceed with Registering:
        route(REGISTER_CONTINUE);
    }

    route[REGISTER_CONTINUE] {
    #!endif
        append_hf("Path: <sip:term@HOSTNAME;lr>\r\n");

        remove_hf("Supported");
        append_hf("Supported: path\r\n");
        remove_hf("Require");
        append_hf("Require: path\r\n");

        # Add a visited Network-ID-Header:
        if (is_present_hf("P-Visited-Network-ID")) {
                $var(new_hdr) = "NETWORKNAME, "+$hdr(P-Visited-Network-ID);
                append_hf("P-Visited-Network-ID: $var(new_hdr)\r\n");
        } else {
                append_hf("P-Visited-Network-ID: NETWORKNAME\r\n");
        }
    #!ifdef WITH_SBC
    #!ifndef WITH_SBC_CALL
        t_on_failure("SBC_failure");
        # Choose an SBC to send the call to:
        if (!ds_select_dst(DISPATCHER_LIST_SBC, "4")) {
                send_reply("503", "Service Unavailable (SBC failure)");
                exit;
        }
    #!else
        t_on_failure("REGISTER_failure");
    #!endif
    #!else
        t_on_failure("REGISTER_failure");
    #!endif
        t_on_reply("REGISTER_reply");
        # Forward request:
        route(RELAY);
        exit;
    }

    # Replies for REGISTER requests:
    ######################################################################
    onreply_route[REGISTER_reply]
    {
    #!ifdef WITH_IMS_HDR_CACHE
        if (is_present_hf("Service-Route")) {
                $sht(serviceroutes=>$ci) = $hdr(Service-Route);
        } else {
                if ($sht(serviceroutes=>$ci) != $null) {
                        append_hf("Service-Route: $sht(serviceroutes=>$ci)\r\n");
                        msg_apply_changes();
                }
        }
        if (is_present_hf("P-Associated-URI")) {
                $sht(associateduris=>$ci) = $hdr(P-Associated-URI);
        } else {
                if ($sht(associateduris=>$ci) != $null) {
                        append_hf("P-Associated-URI: $sht(associateduris=>$ci)\r\n");
                        msg_apply_changes();
                }
        }
    #!endif

        if (t_check_status("200")) {
    #!ifdef WITH_IPBLOCK
                $sht(failedauth=>$T_req($si)) = $null;
    #!endif
                pcscf_save("pcscf_location");

    #!ifdef WITH_NATPING
                if ($(T_req($hdr(Security-Client))) =~ ".*ipsec-3gpp.*") {
                        $var(sec_client) = $(T_req($hdr(Security-Client)));
                        xnotice("Security-Client=$var(sec_client)\n");
                        $var(sc_port_c) = $(var(sec_client){re.subst,/.*port-c=([0-9]*).*$/\1/s});
                        xnotice("port-c=$var(sc_port_c)\n");
                        $var(sc_port_s) = $(var(sec_client){re.subst,/.*port-s=([0-9]*).*$/\1/s});
                        xnotice("port-s=$var(sc_port_s)\n");
                }
                if ($(T_req($hdr(Security-Verify))) =~ ".*ipsec-3gpp.*") {
                        $var(sec_verify) = $(T_req($hdr(Security-Verify)));
                        xnotice("Security-Verify=$var(sec_verify)\n");
                        $var(sv_port_c) = $(var(sec_verify){re.subst,/.*port-c=([0-9]*).*$/\1/s});
                        xnotice("port-c=$var(sv_port_c)\n");
                        $var(sv_port_s) = $(var(sec_verify){re.subst,/.*port-s=([0-9]*).*$/\1/s});
                        xnotice("port-s=$var(sv_port_s)\n");
                }
    #!ifdef WITH_PING_UDP
                if ($pr == "udp") {
                        sht_lock("natping=>natpinglock");
                        if ($(T_req($hdr(Security-Client))) =~ ".*ipsec-3gpp.*") {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$var(sc_port_s);
                        } else {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$T_req($sp);
                        }
                        $sht(natping=>$var(ouri)) = $(T_req($ct){nameaddr.uri});
                        sht_unlock("natping=>natpinglock");

                        sht_lock("natpingfrom=>natpingfromlock");
                        if ($(T_req($hdr(Security-Verify))) =~ ".*ipsec-3gpp.*") {
                                $sht(natpingfrom=>$var(ouri)) = "udp:"+$T_req($Ri)+":"+$var(sv_port_c);
                        } else {
                                $sht(natpingfrom=>$var(ouri)) = "udp:"+$T_req($Ri)+":"+$T_req($Rp);
                        }
                        sht_unlock("natpingfrom=>natpingfromlock");
                }
    #!endif
    #!ifdef WITH_PING_TCP
                if ($pr == "tcp") {
                        sht_lock("natping=>natpinglock");
                        if ($(T_req($hdr(Security-Client))) =~ ".*ipsec-3gpp.*") {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$var(sc_port_s)+";transport=tcp";
                        } else {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$T_req($sp)+";transport=tcp";
                        }
                        $sht(natping=>$var(ouri)) = $(T_req($ct){nameaddr.uri});
                        sht_unlock("natping=>natpinglock");

                        sht_lock("natpingfrom=>natpingfromlock");
                        if ($(T_req($hdr(Security-Verify))) =~ ".*ipsec-3gpp.*") {
                                $sht(natpingfrom=>$var(ouri)) = "tcp:"+$T_req($Ri)+":"+$var(sv_port_c);
                        } else {
                                $sht(natpingfrom=>$var(ouri)) = "tcp:"+$T_req($Ri)+":"+$T_req($Rp);
                        }
                        sht_unlock("natpingfrom=>natpingfromlock");
                }
    #!endif
    #!ifdef WITH_PING_TLS
                if ($pr == "tls") {
                        sht_lock("natping=>natpinglock");
                        if ($(T_req($hdr(Security-Client))) =~ ".*ipsec-3gpp.*") {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$var(sc_port_s)+";transport=tls";
                        } else {
                                $var(ouri) = "sip:"+$T_req($si)+":"+$T_req($sp)+";transport=tls";
                        }
                        $sht(natping=>$var(ouri)) = $(T_req($ct){nameaddr.uri});
                        sht_unlock("natping=>natpinglock");

                        sht_lock("natpingfrom=>natpingfromlock");
                        if ($(T_req($hdr(Security-Verify))) =~ ".*ipsec-3gpp.*") {
                                $sht(natpingfrom=>$var(ouri)) = "tls:"+$T_req($Ri)+":"+$var(sv_port_c);
                        } else {
                                $sht(natpingfrom=>$var(ouri)) = "tls:"+$T_req($Ri)+":"+$T_req($Rp);
                        }
                        sht_unlock("natpingfrom=>natpingfromlock");
                }
    #!endif
    #!endif
                #update stats for register reply on success
                $var(start_secs) = $(sht(a=>$ci::start_time){s.select,0,.});
                $var(start_usecs) = $(sht(a=>$ci::start_time){s.select,1,.});
                $var(diff_secs) = $TV(s) - $var(start_secs);
                $var(diff_usecs) = $TV(u) - $var(start_usecs);
                $var(diff_ms) = $var(diff_secs)*1000 + ($var(diff_usecs)/1000);
                $sht(a=>$ci::start_time)=0;
                $var(stat_add) = "+" + $var(diff_ms);
                xlog("L_DBG", "REGISTER SUCCESS[$ci] took $var(stat_add)ms\n");
                update_stat("register_success", "+1");
                update_stat("register_time", "$var(stat_add)");
    #!ifdef WITH_IPSEC
                sht_lock("ipsec_clients=>ipsec_clients_lock");
                if ($sht(ipsec_clients=>$T_req($si)) != $null) {
                        # IPSec forward only if its an IPsec client
                        ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
                }
                if ($T_req($expires(min)) == 0) {
                        $sht(ipsec_clients=>$T_req($si)) = $null;
                }
                sht_unlock("ipsec_clients=>ipsec_clients_lock");

    #!ifdef WITH_N5
                $var(reg_exp) = $expires(min);
                xlog("L_INFO","Expires for $fu is $var(reg_exp)\n");
                # Create App session only upon receiving 200 OK for SIP REGISTER and is not a deregistration scenario.
                if ($expires(min) > 0) {
                        route(N5_REG_PCF_POLICY_AUTH);
                }
    #!endif
        }
        else {
                if (t_check_status("401")) {
                        if($(T_req($hdr(Security-Client))) != $null && ipsec_create("pcscf_location", IPSEC_DELETE_UNUSED_TUNNELS)!=1) {
                                send_reply("503", "Service Unavailable (Create ipsec failed)");
                        }
                        sht_lock("ipsec_clients=>ipsec_clients_lock");
                        if ($sht(ipsec_clients=>$T_req($si)) != $null) {
                                $var(sec_client) = $(T_req($hdr(Security-Client)));
                                xnotice("Security-Client=$var(sec_client)\n");
                                $var(sc_port_c) = $(var(sec_client){re.subst,/.*port-c=([0-9]*).*$/\1/s});
                                xnotice("port-c=$var(sc_port_c)\n");
                                $var(sc_port_s) = $(var(sec_client){re.subst,/.*port-s=([0-9]*).*$/\1/s});
                                xnotice("port-s=$var(sc_port_s)\n");
                        }
                        sht_unlock("ipsec_clients=>ipsec_clients_lock");
                        xnotice("Expires=$(T_req($expires(min)))\n");
                        if (is_present_hf("WWW-Authenticate")) {
                                # Remove ck and ik.
                                $var(old_hdr) = $hdr(WWW-Authenticate);
                                xnotice("Old header - WWW-Authenticate=$var(old_hdr)\n");
                                remove_hf("WWW-Authenticate");
                                $var(new_hdr) = $(hdr(WWW-Authenticate){re.subst,/(, *)?(ck|ik)=\"\w+\"//gi});
                                if ($(var(new_hdr){s.len}) > 0) {
                                        append_hf("WWW-Authenticate: $var(new_hdr)\r\n");
                                }
                                xnotice("New header - WWW-Authenticate=$var(new_hdr)\n");
                        }
                }
    #!endif
        }
        exit;
    }

    # Negative replies to REGISTER requests:
    ######################################################################
    failure_route[REGISTER_failure]
    {

    #!ifdef WITH_N5
        # Terminate N5 Session on Reg Failure.
        if (t_check_status("403|408|[5-6][0-9][0-9]")) {
                route(N5_REG_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

    #!ifdef WITH_IPBLOCK
        if (t_check_status("403|[5-6][0-9][0-9]")) {
                if ($sht(failedauth=>$si) != $null)
                        $sht(failedauth=>$si) = $sht(failedauth=>$si) + 1;
                else
                        $sht(failedauth=>$si) = 1;
                if ($sht(failedauth=>$si) > 10) {
                        xlog("L_ALERT","ALERT: blocking $rm from $fu (IP:$si:$sp), more than 5 failed auth requests!\n");
                        xlog("Blocking traffic from $si\n");
                        $sht(ipban=>$si) = 1;
                }
                update_stat("register_failed", "+1");
        }
    #!endif
        if (t_check_status("408")) {
                send_reply("504","Server Time-Out");
                update_stat("register_failed", "+1");
                exit;
        }

    }

    #!ifdef WITH_N5

    # N5 Policy Authorization - Create Application session context for SIP Registration.
    route[N5_REG_PCF_POLICY_AUTH]
    {
        # Send N5 PCF policy authorization only on successful replies to REGISTER requests.
        if (!is_method("REGISTER") || !is_reply()) {
                return;
        }

        $var(ue_policy_authorization_body) = '{
                "ascReqData": {
                        "afAppId": "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
                        "dnn": "ims",
                        "medComponents": {
                                "0": {
                                        "medCompN": 0,
                                        "medType": "CONTROL",
                                        "medSubComps": {
                                                "0": {
                                                        "fNum": 0,
                                                        "fDescs": [
                                                                "permit out ip from PCSCF_REG_IP PCSCF_REG_PORT to UE_REG_IP UE_REG_PORT",
                                                                "permit in ip from UE_REG_IP UE_REG_PORT to PCSCF_REG_IP PCSCF_REG_PORT"
                                                        ],
                                                        "fStatus": "ENABLED",
                                                        "flowUsage": "AF_SIGNALLING"
                                                }
                                        }
                                }
                        },
                        "evSubsc": {
                                "events": [
                                        {
                                                "event": "QOS_NOTIF",
                                                "notifMethod": "PERIODIC"
                                        },
                                        {
                                                "event": "ANI_REPORT",
                                                "notifMethod": "ONE_TIME"
                                        }
                                ]
                        },
                        "notifUri": "http://N5_BIND_IP:N5_BIND_PORT",
                        "sponStatus": "SPONSOR_DISABLED",
                        "supi": "imsi-UE_IMSI",
                        "suppFeat": "2",
                        "ueIpv4": "UE_REG_IP"
                }
        }';
        $var(ue_policy_authorization_body) = $(var(ue_policy_authorization_body){re.subst,/PCSCF_REG_IP/$T_req($Ri)/g});
        $var(ue_policy_authorization_body) = $(var(ue_policy_authorization_body){re.subst,/PCSCF_REG_PORT/$T_req($Rp)/g});
        $var(ue_policy_authorization_body) = $(var(ue_policy_authorization_body){re.subst,/UE_REG_IP/$viaZ(host)/g});
        $var(ue_policy_authorization_body) = $(var(ue_policy_authorization_body){re.subst,/UE_REG_PORT/$viaZ(port)/g});
        $var(ue_policy_authorization_body) = $(var(ue_policy_authorization_body){re.subst,/UE_IMSI/$T_req($au)/g});
        jansson_append("obj", "", "$var(ue_policy_authorization_body)", "$var(ue_policy_authorization_json_body)");

        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));

        $var(app_session) = 0;
        sht_lock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
        if ($sht(ue_ip_to_reg_app_session_map=>$viaZ(host)) != $null) {
                $var(app_session) = $sht(ue_ip_to_reg_app_session_map=>$viaZ(host));
        }
        sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
        if ($var(app_session) > 0) {
                xnotice("AppSession Id $var(app_session) for IP $viaZ(host) already exists so send a patch request\n");

                # Set HTTP2 request headers.
                $var(headers) = "Content-Type: application/merge-patch+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");
                switch ($rc) {
                        # Success case.
                        case 200:
                                xlog("L_INFO", "N5 QoS Session modification successfully updated. Reason code: $rc\n");
                                xlog("L_INFO", "HTTP results: $var(result)\n");
                                xlog("L_INFO", "HTTP response: $rc\n");
                                xlog("L_INFO", "cURL Response: $curlerror(error)\n");
                                xlog("L_INFO", "Location Header header: $httprhdr(location)\n");
                                # Update again so that Hash table does not remove the entry upon timer expiry.
                                sht_lock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
                                $sht(ue_ip_to_reg_app_session_map=>$viaZ(host)) = $var(app_session);
                                sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session modification failed for UE with IMSI $T_req($au). Reason code: $rc\n");
                                send_reply("412", "Register N5 QoS authorization (modification) failed");
                                exit;
                }
        } else {
                xlog("L_INFO","SIP Registration - Creating N5 QoS Auth session for $fu\n");

                # Set HTTP2 request headers.
                $var(headers) = "Content-Type: application/json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                xlog("L_INFO","SIP Registration. Sending N5 QoS Auth for $fu to PCF\n");
                # Send the request to PCF.
                http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");

                switch ($rc) {
                        # Success case.
                        case 201:
                                xlog("L_INFO", "N5 QoS Session successfully created $rc\n");
                                xlog("L_INFO", "HTTP results: [$var(result)]\n");
                                xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
                                xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

                                # Retrieve the AppSession Id out of the location Header if the resopnse is 201.
                                # Example URL: "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/(someSessionID)"

                                # Extract the AppSession Id.
                                $var(response_url) = $httprhdr(location);
                                $var(response_url) = $(var(response_url){s.trim});
                                $var(app_session) = $(var(response_url){s.select,-1,/});

                                # Store the AppSession Id in the hash table associated with the IP address in the last Via SIP header.
                                sht_lock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
                                $sht(ue_ip_to_reg_app_session_map=>$viaZ(host)) = $var(app_session);
                                sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
                                xlog("L_INFO", "Stored registration AppSession Id for IP $viaZ(host) is $var(app_session)\n");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session authorization failed for UE with IMSI $T_req($au). Reason code: $rc\n");
                                send_reply("412", "Register N5 QoS authorization failed");
                                exit;
                }
        }
    }

    # N5 Policy Authorization - Application session deletion upon UE De-registration.
    route[N5_REG_PCF_POLICY_AUTH_DELETE]
    {
        if (!is_method("REGISTER")) {
                return;
        }
        if (!is_reply()) {
                # In case of request take the first Via header.
                $var(ue_ip) = $via0(host);
        } else {
                # In case of reply take the first Via header from the corresponding request.
                $var(ue_ip) = $T_req($via0(host));
        }
        # Retrieve the AppSession Id from the hash table.
        sht_lock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
        if ($sht(ue_ip_to_reg_app_session_map=>$var(ue_ip)) == $null) {
                xlog("L_WARN", "No AppSession found for UE with IP $var(ue_ip)\n");
                sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
                return;
        }
        $var(ue_appsess_dereg) = $sht(ue_ip_to_reg_app_session_map=>$var(ue_ip));
        sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
        xlog("L_INFO", "Terminating AppSession with Id $var(ue_appsess_dereg) for user with IP $var(ue_ip)\n");

        # Set HTTP2 request headers.
        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        $var(headers) = "Content-Type: application/json\r\n";
        $var(headers) = $var(headers) + "X-SIP-Status: De-Registration\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
        $var(headers) = $var(headers) + "accept: application/json\r\n";
        $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

        $var(json_request) = "";

        http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(ue_appsess_dereg)/delete", "$var(json_request)", "$var(headers)", "$var(result)");
        xlog("L_INFO", "CURL error: [$curlerror(error)]\n");
        xlog("L_INFO", "HTTP results: [$var(result)]\n");
        xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
        xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

        # Clear hashtable content irrespective of the response from PCF/IMS as the UE has de-registered and the session context needs to be cleared locally.
        sht_lock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
        $sht(ue_ip_to_reg_app_session_map=>$var(ue_ip)) = $null;
        sht_unlock("ue_ip_to_reg_app_session_map=>ue_ip_to_reg_app_session_map_lock");
    }

    #!endif
  route__websocket.cfg: |
    event_route[xhttp:request] {
        set_reply_close();
        set_reply_no_connect();

    #!ifdef WITH_XMLRPC
        if ($hu =~ "^/RPC") {
                route(XMLRPC);
                exit;
        }
    #!endif

        if ($Rp != MY_WS_PORT
    #!ifdef WITH_TLS
                && $Rp != MY_WSS_PORT
    #!endif
        ) {
                xlog("L_WARN", "HTTP request received on $Rp\n");
                xhttp_reply("403", "Forbidden - HTTP request received on $Rp", "", "");
                exit;
        }

        if ($hdr(Upgrade)=~"websocket"
                &&  in_list("Upgrade", $hdr(Connection), ",")
                && $rm=~"GET") {

                # Validate Host - make sure the client is using the correct
                # alias for WebSockets
                if ($hdr(Host) == $null || !is_myself("sip:" + $hdr(Host))) {
                        xlog("L_WARN", "Bad host $hdr(Host)\n");
                        xhttp_reply("403", "Forbidden - invalid host", "", "");
                        exit;
                }

    #!ifdef WEBSOCKET_WEBSERVER
                # Validate Origin - make sure the client is from the authorised website
                if ($hdr(Origin) != "http://"+WEBSOCKET_WEBSERVER
    #!ifdef WITH_TLS
                        && $hdr(Origin) != "https://"+WEBSOCKET_WEBSERVER
    #!endif
                ) {
                        xlog("L_WARN", "Unauthorised client $hdr(Origin)\n");
                        xhttp_reply("403", "Forbidden - invalid website", "", "");
                        exit;
                }
    #!endif

                # ws_handle_handshake() exits (no further configuration file
                # processing of the request) when complete.
                if (ws_handle_handshake()) {
                        # Optional... cache some information about the
                        # successful connection
                        exit;
                }
        }

        # xhttp_reply("200", "OK", "text/html", "<html><body>Wrong URL $hu</body></html>");
        xhttp_reply("404", "Not Found", "", "");
    }

    event_route[websocket:closed] {
        xlog("L_DBG", "WebSocket connection from $si:$sp has closed\n");
    }
  route__mo.cfg: |
    ######################################################################
    # Originating, Intial Requests
    ######################################################################
    route[MO]
    {
        # Strip Transport from RURI:
        $ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");

        # Process route headers, if any:
        loose_route();
        if (!pcscf_is_registered("pcscf_location")) {
                send_reply("403","Forbidden - You must register first with a S-CSCF");
                exit;
        }

        # We do not trust the user, let's remove the P-Asserted-Identity, if any:
        remove_hf("P-Asserted-Identity");
        remove_hf("P-Preferred-Identity");

        # Add P-Charging-Vector
        sip_p_charging_vector("g");

        if (is_present_hf("P-Preferred-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Preferred-Identity)") && $hdr(P-Preferred-Identity) =~ "sip:.*") {
                append_hf("P-Asserted-Identity: $hdr(P-Preferred-Identity)\r\n");
        } else if (is_present_hf("P-Asserted-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Asserted-Identity)") && $hdr(P-Asserted-Identity) =~ "sip:.*") {
                append_hf("P-Asserted-Identity: $hdr(P-Asserted-Identity)\r\n");
        } else if (pcscf_assert_identity("pcscf_location", "$(fu{tobody.uri})")) {
                # For broken SIP implementation in Samsung devices
                if ($fu =~ "tel:.*") {
                        $var(new_hdr) = $(fu{tobody.uri}) + "@NETWORKNAME";
                        $var(new_hdr) = $(var(new_hdr){re.subst,/tel:/sip:/g});
                        append_hf("P-Asserted-Identity: <$var(new_hdr)>\r\n");
                        $fu = $var(new_hdr);
                } else {
                        append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
                }
        } else {
                append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
        }

        if (!pcscf_follows_service_routes("pcscf_location")){
                #Variant 1 - deny access to the network
                #send_reply("400","Bad Request - Not following indicated service routes");
                #break;

                #Variant 2 - enforce routes and let the dialog continue
                pcscf_force_service_routes("pcscf_location");
        }

        # add IBCF/THIG route here if required
        # Check for "sec-agree" in the Require header:
        if (is_present_hf("Require") && $hdr(Require) =~ ".*sec-agree.*") {
                # Remove the old Require-Header:
                remove_hf("Require");
                # Replace ", sec-agree" with ""
                $var(new_hdr) = $(hdr(Require){re.subst,/[, ]*sec-agree//gi});
                if ($(var(new_hdr){s.len}) > 0) {
                        append_hf("Require: $var(new_hdr)\r\n");
                }
        }

        # Check for "sec-agree" in the Proxy-Require header:
        if (is_present_hf("Proxy-Require") && $hdr(Proxy-Require) =~ ".*sec-agree.*") {
                # Remove the old Proxy-Require-Header:
                remove_hf("Proxy-Require");
                # Replace ", sec-agree" with ""
                $var(new_hdr) = $(hdr(Proxy-Require){re.subst,/[, ]*sec-agree//gi});
                if ($(var(new_hdr){s.len}) > 0) {
                        append_hf("Proxy-Require: $var(new_hdr)\r\n");
                }
        }
        remove_hf("Security-Verify");

    #!ifdef TRF_FUNCTION
        $var(trf) = TRF_FUNCTION;
        # Check for "sec-agree" in the Proxy-Require header:
        if (is_present_hf("Feature-Caps")) {
                # Remove the old Proxy-Require-Header:
                remove_hf("Feature-Caps");
                append_hf("Feature-Caps: $hdr(Feature-Caps);+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
        } else {
                append_hf("Feature-Caps: *;+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
        }
    #!endif
        # Add a visited Network-ID-Header:
        if (is_present_hf("P-Visited-Network-ID")) {
                $var(new_hdr) = "NETWORKNAME, "+$hdr(P-Visited-Network-ID);
                append_hf("P-Visited-Network-ID: $var(new_hdr)\r\n");
        } else {
                append_hf("P-Visited-Network-ID: NETWORKNAME\r\n");
        }
        set_dlg_profile("orig");
        t_on_reply("MO_reply");
    }

    ######################################################################
    # Replies to Originating Initial Requests
    ######################################################################
    onreply_route[MO_reply] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");
        if (is_present_hf("C-Params")) {
                remove_hf("Contact");
                remove_hf("C-Params");
                append_hf("Contact: $ct;$hdr(C-Params)\r\n");
        }

    #!ifdef WITH_N5
        # Terminating N5 AppSession after error response.
        if (status=~"[45][0-9][0-9]") {
                xnotice("Received error response for the call. Going to terminate N5 Session\n");
                route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
        # In case of 1xx and 2xx do NAT
        if(status=~"[12][0-9][0-9]")
                route(NATMANAGE);

        if (t_check_status("180|183|200") && sdp_content()) {
                if (t_is_retr_async_reply()) {
                        xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
                        drop();
                }
                $avp(FTAG_CUSTOM_AVP)=$ft;
                $avp(TTAG_CUSTOM_AVP)=$tt;
                $avp(CALLID_CUSTOM_AVP)=$ci;

    #!ifdef WITH_RX
                xlog("L_DBG", "IMS: Received 183/200 inside orig_initial_reply\n");
                xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
                if (Rx_AAR("MO_aar_reply","orig","",-1) == 0) {
                        exit;
                }
    #!endif
    #!ifdef WITH_N5
                route(MO_N5_CALL_PCF_POLICY_AUTH);
    #!endif
        }
    }

    #!ifdef WITH_RX
    route[MO_aar_reply]
    {
        # Check reply AVP since the operation is async
        switch ($avp(s:aar_return_code)) {
                case 1:
                        xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
                        break;
                default:
                        xlog("L_ERR", "IMS: AAR failed Orig\n");
                        xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                        xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                        # Comment this if you want to allow even if Rx fails
                        if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                dlg_terminate("all", "Sorry no QoS available");
                                exit;
                        }
        }
    }
    #!endif

    ######################################################################
    # In-Dialog-Mo-Requests
    ######################################################################
    route[MO_indialog] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");

    #!ifdef WITH_N5
        # Terminating N5 AppSession after BYE/CANCEL.
        if (is_method("BYE|CANCEL")) {
                xnotice("InDialog Call End/Cancel/Error. Terminating N5 QoS Session\n");
                route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

        setflag(FLT_MOBILE_ORIG);
        t_on_reply("MO_indialog_reply");

        # Append rport only if its a request coming from UE
        if (is_request() && ($hdrc(Via) == 1)) {
                force_rport();
        }

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
    }

    onreply_route[MO_indialog_reply] {
        xnotice("Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Next hop domain: ($nh(d))\n");
        xnotice("Contact header: $ct\n");

    #!ifdef WITH_N5
        # Terminating N5 AppSession after error response.
        if (status=~"[45][0-9][0-9]") {
                xnotice("Received error response for the call. Going to terminate N5 Session\n");
                route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
        }
    #!endif

    #!ifdef WITH_IPSEC
        sht_lock("ipsec_clients=>ipsec_clients_lock");
        if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
                # IPSec forward only if its an IPsec client
                ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
        }
        sht_unlock("ipsec_clients=>ipsec_clients_lock");
    #!endif
        # In case of 1xx and 2xx do NAT
        if(status=~"[12][0-9][0-9]")
                route(NATMANAGE);

        if ((t_check_status("180|183|200") && sdp_content() && !is_method("PRACK")) || (is_method("UPDATE"))) {
                if (t_is_retr_async_reply()) {
                        xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
                        drop();
                }
                $avp(FTAG_CUSTOM_AVP)=$ft;
                $avp(TTAG_CUSTOM_AVP)=$tt;
                $avp(CALLID_CUSTOM_AVP)=$ci;

    #!ifdef WITH_RX
                xlog("L_DBG", "IMS: ORIG_SUBSEQUENT reply. This is a 200 OK to a re-INVITE\n");
                xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
                # Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
                if (Rx_AAR("MO_indialog_aar_reply","orig","",-1) == 0) {
                        exit;
                }
    #!endif
    #!ifdef WITH_N5
                route(MO_N5_CALL_PCF_POLICY_AUTH);
    #!endif
        }
    }

    #!ifdef WITH_RX
    route[MO_indialog_aar_reply]
    {
        # Check reply AVP since the operation is async
        switch ($avp(s:aar_return_code)) {
        case 1:
                xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
                break;
        default:
                xlog("L_ERR", "IMS: AAR failed Orig\n");
                xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                # Comment this if you want to allow even if Rx fails
                if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                        dlg_terminate("all", "Sorry no QoS available");
                        exit;
                }
        }
    }
    #!endif

    #!ifdef WITH_N5
    route[MO_N5_CALL_PCF_POLICY_AUTH] {
        # Send N5 PCF policy authorization only on replies.
        if (!is_reply()) {
                return;
        }
        $var(contact_uri) = $T_req($(ct{nameaddr.uri}));
        # Callee → Caller.
        # TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
        if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                $var(contact_uri) = $(ct{nameaddr.uri});
        }
        $var(ue_ip) = $(var(contact_uri){uri.host});
        $var(app_session) = 0;
        sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        if ($sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) != $null) {
                $var(app_session) = $sht(ue_ip_to_call_app_session_map=>$var(ue_ip));
                # Update again so that Hash table does not remove the entry upon session timer expiry.
                $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
                sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
                $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
                sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
        }
        sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        # Send N5 PCF policy authorization if SDP body is present.
        if (!sdp_content()) {
                return;
        }
        $var(req_sdp) = $T_req($sdp(body));
        $var(rep_sdp) = $sdp(body);
        xlog("L_INFO","Req SDP: $var(req_sdp)\n");
        xlog("L_INFO","Rep SDP: $var(rep_sdp)\n");

        $var(current_media) = "";
        $var(req_audio_rtp_port) = 0;
        $var(req_audio_rtcp_port) = 0;
        $var(req_video_rtp_port) = 0;
        $var(req_video_rtcp_port) = 0;
        $var(req_audio_rtcp_explicit) = 0;
        $var(req_video_rtcp_explicit) = 0;
        $var(audio_bw_as) = 0;
        $var(video_bw_as) = 0;

        # Split SDP into lines and iterate.
        $var(req_sdp_lines_count) = $(var(req_sdp){line.count});
        $var(req_sdp_line_num) = 0;
        while ($var(req_sdp_line_num) < $var(req_sdp_lines_count)) {
                $var(sdp_line) = $(var(req_sdp){line.at,$var(req_sdp_line_num)});
                # Check for audio media line: "m=audio <port>".
                if ($var(sdp_line) =~ "^m=audio ") {
                        $var(current_media) = "audio";
                        $var(req_audio_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for video media line: "m=video <port>".
                else if ($var(sdp_line) =~ "^m=video ") {
                        $var(current_media) = "video";
                        $var(req_video_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for explicit RTCP attribute: "a=rtcp:<port>".
                else if ($var(sdp_line) =~ "^a=rtcp:") {
                        if ($var(current_media) == "audio") {
                                $var(req_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(req_audio_rtcp_explicit) = 1;
                        } else if ($var(current_media) == "video") {
                                $var(req_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(req_video_rtcp_explicit) = 1;
                        }
                }
                # Check for bandwidth information.
                else if ($var(sdp_line) =~ "^b=AS:") {
                        if ($var(current_media) == "audio") {
                                $var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
                        } else if ($var(current_media) == "video") {
                                $var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
                        }
                }
                $var(req_sdp_line_num) = $var(req_sdp_line_num) + 1;
        }

        # Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
        if ($var(req_audio_rtcp_explicit) != 1 && $var(req_audio_rtp_port) > 0) {
                $var(req_audio_rtcp_port) = $(var(req_audio_rtp_port){s.int}) + 1;
        }
        if ($var(req_video_rtcp_explicit) != 1 && $var(req_video_rtp_port) > 0) {
                $var(req_video_rtcp_port) = $(var(req_video_rtp_port){s.int}) + 1;
        }

        $var(current_media) = "";
        $var(rep_audio_rtp_port) = 0;
        $var(rep_audio_rtcp_port) = 0;
        $var(rep_video_rtp_port) = 0;
        $var(rep_video_rtcp_port) = 0;
        $var(rep_audio_rtcp_explicit) = 0;
        $var(rep_video_rtcp_explicit) = 0;
        # Split SDP into lines and iterate.
        $var(rep_sdp_lines_count) = $(var(rep_sdp){line.count});
        $var(rep_sdp_line_num) = 0;
        while ($var(rep_sdp_line_num) < $var(rep_sdp_lines_count)) {
                $var(sdp_line) = $(var(rep_sdp){line.at,$var(rep_sdp_line_num)});
                # Check for audio media line: "m=audio <port>".
                if ($var(sdp_line) =~ "^m=audio ") {
                        $var(current_media) = "audio";
                        $var(rep_audio_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for video media line: "m=video <port>".
                else if ($var(sdp_line) =~ "^m=video ") {
                        $var(current_media) = "video";
                        $var(rep_video_rtp_port) = $(var(sdp_line){s.select,1, });
                }
                # Check for explicit RTCP attribute: "a=rtcp:<port>".
                else if ($var(sdp_line) =~ "^a=rtcp:") {
                        if ($var(current_media) == "audio") {
                                $var(rep_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(rep_audio_rtcp_explicit) = 1;
                        } else if ($var(current_media) == "video") {
                                $var(rep_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
                                $var(rep_video_rtcp_explicit) = 1;
                        }
                }
                # Check for bandwidth information.
                else if ($var(sdp_line) =~ "^b=AS:") {
                        if ($var(current_media) == "audio") {
                                $var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
                        } else if ($var(current_media) == "video") {
                                $var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
                        }
                }
                $var(rep_sdp_line_num) = $var(rep_sdp_line_num) + 1;
        }

        # Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
        if ($var(rep_audio_rtcp_explicit) != 1 && $var(rep_audio_rtp_port) > 0) {
                $var(rep_audio_rtcp_port) = $(var(rep_audio_rtp_port){s.int}) + 1;
        }
        if ($var(rep_video_rtcp_explicit) != 1 && $var(rep_video_rtp_port) > 0) {
                $var(rep_video_rtcp_port) = $(var(rep_video_rtp_port){s.int}) + 1;
        }

        $var(req_sdp_ip) = $(var(req_sdp){line.sw,c=IN}{s.select,2, });
        $var(rep_sdp_ip) = $sdp(c:ip);

        xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio RTP: $var(req_audio_rtp_port), RTCP: $var(req_audio_rtcp_port)\n");
        xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio RTP: $var(rep_audio_rtp_port), RTCP: $var(rep_audio_rtcp_port)\n");
        if ($var(req_video_rtp_port) > 0) {
                xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Video RTP: $var(req_video_rtp_port), RTCP: $var(req_video_rtcp_port)\n");
        } else {
                xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio only (no video)\n");
        }
        if ($var(rep_video_rtp_port) > 0) {
                xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Video RTP: $var(rep_video_rtp_port), RTCP: $var(rep_video_rtcp_port)\n");
        } else {
                xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio only (no video)\n");
        }

        $var(audio_media_component_body) = '"0": {
                "medCompN": 1,
                "medType": "AUDIO",
                "codecs": [
                        "downlink\n0\n",
                        "uplink\n0\n"
                ],
                "medSubComps": {
                        "0": {
                                "fNum": 1,
                                "fDescs": [
                                        "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
                                        "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
                                        "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '",
                                        "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '"
                                ],
                                "fStatus": "ENABLED",
                                "marBwDl": "' + $var(audio_bw_as) + ' Kbps",
                                "marBwUl": "' + $var(audio_bw_as) + ' Kbps",
                                "flowUsage": "NO_INFO"
                        }
                }
        }';
        # Callee → Caller.
        # TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
        if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                $var(audio_media_component_body) = '"0": {
                        "medCompN": 1,
                        "medType": "AUDIO",
                        "codecs": [
                                "downlink\n0\n",
                                "uplink\n0\n"
                        ],
                        "medSubComps": {
                                "0": {
                                        "fNum": 1,
                                        "fDescs": [
                                                "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
                                                "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
                                                "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '",
                                                "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '"
                                        ],
                                        "fStatus": "ENABLED",
                                        "marBwDl": "' + $var(audio_bw_as) + ' Kbps",
                                        "marBwUl": "' + $var(audio_bw_as) + ' Kbps",
                                        "flowUsage": "NO_INFO"
                                }
                        }
                }';
        }

        $var(video_media_component_body) = "";
        # NOTE: Only if both request and reply SDPs have video media, we consider video for policy authorization and include it in the media components. This is to handle the case where one side doesn't support video and hence doesn't include it in the SDP at all.
        if ($var(req_video_rtp_port) > 0 && $var(rep_video_rtp_port) > 0) {
                $var(video_media_component_body) = '"1": {
                        "medCompN": 2,
                        "medType": "VIDEO",
                        "codecs": [
                                "downlink\n0\n",
                                "uplink\n0\n"
                        ],
                        "medSubComps": {
                                "0": {
                                        "fNum": 2,
                                        "fDescs": [
                                                "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
                                                "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
                                                "permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '",
                                                "permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '"
                                        ],
                                        "fStatus": "ENABLED",
                                        "marBwDl": "' + $var(video_bw_as) + ' Kbps",
                                        "marBwUl": "' + $var(video_bw_as) + ' Kbps",
                                        "flowUsage": "NO_INFO"
                                }
                        }
                }';
                # Callee → Caller.
                # TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
                if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
                        $var(video_media_component_body) = '"1": {
                                "medCompN": 2,
                                "medType": "VIDEO",
                                "codecs": [
                                        "downlink\n0\n",
                                        "uplink\n0\n"
                                ],
                                "medSubComps": {
                                        "0": {
                                                "fNum": 2,
                                                "fDescs": [
                                                        "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
                                                        "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
                                                        "permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '",
                                                        "permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '"
                                                ],
                                                "fStatus": "ENABLED",
                                                "marBwDl": "' + $var(video_bw_as) + ' Kbps",
                                                "marBwUl": "' + $var(video_bw_as) + ' Kbps",
                                                "flowUsage": "NO_INFO"
                                        }
                                }
                        }';
                }
        }

        $var(media_components_body) = "";
        if ($var(video_media_component_body) != "") {
                $var(media_components_body) = $var(audio_media_component_body) + "," + $var(video_media_component_body);
        } else {
                $var(media_components_body) = $var(audio_media_component_body);
        }

        $var(ue_policy_authorization_body) = '{
                "ascReqData": {
                        "afAppId": "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
                        "dnn": "ims",
                        "medComponents": { ' + $var(media_components_body) + ' },
                        "evSubsc": {
                                "events": [
                                        {
                                                "event": "QOS_NOTIF",
                                                "notifMethod": "PERIODIC"
                                        },
                                        {
                                                "event": "ANI_REPORT",
                                                "notifMethod": "ONE_TIME"
                                        }
                                ]
                        },
                        "notifUri": "http://N5_BIND_IP:N5_BIND_PORT",
                        "sponStatus": "SPONSOR_DISABLED",
                        "gpsi": "msisdn-' + $fU + '",
                        "suppFeat": "2",
                        "ueIpv4": "' + $var(ue_ip) + '"
                }
        }';
        jansson_append("obj", "", "$var(ue_policy_authorization_body)", "$var(ue_policy_authorization_json_body)");

        xlog("L_DBG", "Constructed UE policy authorization body: $var(ue_policy_authorization_json_body)\n");

        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        if ($var(app_session) > 0) {
                xnotice("MO - N5 QoS Auth session already exists for UE with IP $var(ue_ip) so sending a patch request\n");

                # Set HTTP2 request headers.
                $var(headers) = "Content-Type: application/merge-patch+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");
                switch ($rc) {
                        # Success case.
                        case 200:
                                xlog("L_INFO", "N5 QoS Session modification successfully updated. Reason code: $rc\n");
                                xlog("L_INFO", "HTTP results: $var(result)\n");
                                xlog("L_INFO", "HTTP response: $rc\n");
                                xlog("L_INFO", "cURL Response: $curlerror(error)\n");
                                xlog("L_INFO", "Location Header header: $httprhdr(location)\n");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session modification failed for UE with IP $var(ue_ip). Reason code: $rc\n");
                                xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                                # Comment this if you want to allow even if authorization fails.
                                if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                        dlg_terminate("all", "N5 QoS authorization (modification) failed for call");
                                } else {
                                        send_reply("412", "N5 QoS authorization (modification) failed for call");
                                }
                                exit;
                }
        } else {
                xlog("L_INFO","MO - Creating N5 QoS Auth session for UE with IP $var(ue_ip)\n");

                $var(headers) = "Content-Type: application/json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
                $var(headers) = $var(headers) + "accept: application/json\r\n";
                $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
                $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

                xlog("L_INFO","SIP Call. Sending N5 QoS Auth for $fu to PCF\n");
                # Send the request to PCF.
                http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)" );

                switch ($rc) {
                        # Success case.
                        case 201:
                                xlog("L_INFO", "N5 QoS Session successfully created $rc\n");
                                xlog("L_INFO", "HTTP results: [$var(result)]\n");
                                xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
                                xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

                                # Retrieve the AppSession Id out of the location Header if the resopnse is 201.
                                # Example URL: "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/(someSessionID)"

                                # Extract the AppSession Id.
                                $var(response_url) = $httprhdr(location);
                                $var(response_url) = $(var(response_url){s.trim});
                                $var(app_session) = $(var(response_url){s.select,-1,/});

                                # Store the AppSession Id in the hash table associated with the IP address in the last Via SIP header.
                                sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
                                $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
                                sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
                                # Store the AppSession Id in the hash table associated with the dialog Call-Id.
                                sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
                                $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
                                sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
                                xlog("L_INFO", "Stored call AppSession Id for IP $var(ue_ip) is $var(app_session)\n");
                                break;
                        # Failure case.
                        default:
                                xlog("L_ERR", "N5 QoS Session authorization failed for UE with IP $var(ue_ip). Reason code: $rc\n");
                                xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
                                xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
                                # Comment this if you want to allow even if authorization fails.
                                if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
                                        dlg_terminate("all", "N5 QoS authorization failed for call");
                                } else {
                                        send_reply("412", "N5 QoS authorization failed for call");
                                }
                                exit;
                }
        }
    }

    route[MO_N5_CALL_PCF_POLICY_AUTH_DELETE] {
        # Retrieve the AppSession Id from the hash table.
        sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
        if ($sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) == $null) {
                xlog("L_WARN", "No call AppSession found for Call-Id $ci\n");
                sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
                return;
        }
        $var(app_session_and_ue_ip) = $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci);
        sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
        $var(app_session) = $(var(app_session_and_ue_ip){s.select,0,;});
        $var(ue_ip) = $(var(app_session_and_ue_ip){s.select,1,;});

        xlog("L_INFO", "Terminating AppSession with Id $var(app_session) for UE with IP $var(ue_ip) due to call end\n");

        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        $var(headers) = "X-SIP-Status: Call-End-MO\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
        $var(headers) = $var(headers) + "accept: application/json\r\n";
        $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

        $var(json_request) = "";

        http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)/delete", "$var(json_request)", "$var(headers)", "$var(result)");
        xlog("L_INFO", "CURL error: [$curlerror(error)]\n");
        xlog("L_INFO", "HTTP results: [$var(result)]\n");
        xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
        xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

        # Clear hashtable content irrespective of the response from PCF/IMS as the call has ended.
        sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        $sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $null;
        sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
        sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
        $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $null;
        sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
    }
    #!endif
  sems__etc__sbc.conf: |2+

    # profiles - comma-separated list of call profiles to load
    #
    # <name>.sbcprofile.conf is loaded from module config
    # path (the path where this file resides)
    profiles=mo,mt,register

    # active call profile - comma separated list, first non-empty is used
    #
    # o active_profile=<profile_name>  always use <profile_name>
    #
    # o active_profile=$(ruri.user)    use user part of INVITE Request URI
    #
    # o active_profile=$(paramhdr)     use  "profile" option in P-App-Param header
    #
    # o any replacement pattern
    #
    active_profile=$H(SBC),register

    # regex_maps - comma-separated list of regex maps to load at startup, for $M()
    #
