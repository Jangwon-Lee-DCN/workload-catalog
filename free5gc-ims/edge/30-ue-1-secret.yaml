apiVersion: v1
kind: Secret
metadata:
  name: ims-ue-1-config
  namespace: ims-lab
  annotations:
    argocd.argoproj.io/sync-wave: '-11'
stringData:
  ue.yaml: |
    supi: imsi-001010000000901
    mcc: '001'
    mnc: '01'
    key: @{ue-1-key}
    op: @{ue-1-opc}
    opType: OPC
    amf: '8000'
    imeiSv: 0035609204079511
    gnbSearchList:
    - @{gnb-n2-ip}
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
    - type: IPv4
      apn: internet
      slice:
        sst: 1
        sd: 66051
    configured-nssai:
    - sst: 1
      sd: 66051
    default-nssai:
    - sst: 1
      sd: 66051
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: full
      downlink: full
